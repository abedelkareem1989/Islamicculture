<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>تفسير آيات القرآن الكريم</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@300;400;500;700;800&family=Noto+Kufi+Arabic:wght@300;400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== CSS Variables & Reset ========== */
        :root {
            --bg-primary: #f8f6f0;
            --bg-card: #ffffff;
            --bg-card-hover: #f0ede6;
            --text-primary: #1e2a3a;
            --text-secondary: #3a4a5a;
            --text-muted: #6a7a8a;
            --accent: #2b6d4c;
            --accent-light: #3d8b63;
            --accent-soft: #e6f0ea;
            --shadow: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-hover: 0 12px 36px rgba(0,0,0,0.10);
            --border-radius: 18px;
            --transition: 0.25s ease;
            --font-family: 'Amiri', serif;
            --header-bg: #1e3a2f;
            --header-text: #f8f6f0;
            --icon-bg: #e6f0ea;
            --divider: #e0ddd5;
            --search-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-primary: #12181f;
            --bg-card: #1e2933;
            --bg-card-hover: #2a3743;
            --text-primary: #e8edf2;
            --text-secondary: #c8d0d8;
            --text-muted: #8a9aa8;
            --accent: #4d9e7a;
            --accent-light: #5fb08c;
            --accent-soft: #1f3a2e;
            --shadow: 0 8px 24px rgba(0,0,0,0.3);
            --shadow-hover: 0 12px 36px rgba(0,0,0,0.5);
            --header-bg: #0d1a14;
            --header-text: #e8edf2;
            --icon-bg: #2a3a32;
            --divider: #2f3f47;
            --search-bg: #1e2933;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            padding: 0 0 80px 0;
        }

        /* ========== Scrollbar ========== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 12px; }

        /* ========== Utilities ========== */
        a { text-decoration: none; color: inherit; }
        .container { max-width: 860px; margin: 0 auto; padding: 0 18px; }

        /* ========== Header ========== */
        .app-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 18px 0 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: background 0.3s;
        }
        .app-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .app-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header h1 i {
            color: #d4b48c;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-actions button {
            background: rgba(255,255,255,0.08);
            border: none;
            color: var(--header-text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-actions button:hover {
            background: rgba(255,255,255,0.18);
        }
        .font-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .font-controls button {
            width: 36px;
            height: 36px;
            font-size: 1rem;
            background: rgba(255,255,255,0.06);
        }

        /* ========== Search Bar ========== */
        .search-wrap {
            padding: 14px 0 8px;
            background: var(--bg-primary);
            transition: background 0.3s;
        }
        .search-wrap .container {
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 14px 22px 14px 50px;
            border: none;
            border-radius: 60px;
            background: var(--search-bg);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1rem;
            box-shadow: var(--shadow);
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .search-wrap input:focus {
            outline: none;
            border-color: var(--accent-light);
            box-shadow: 0 0 0 3px rgba(45, 120, 85, 0.15);
        }
        .search-wrap i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .search-wrap .clear-search {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: none;
        }

        /* ========== Sections Grid ========== */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            padding: 18px 0 30px;
        }
        .section-card {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 22px 18px 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.3s, background 0.3s;
            cursor: pointer;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }
        .section-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
        }
        .section-card .icon {
            background: var(--icon-bg);
            color: var(--accent);
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .section-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 4px 0 2px;
            color: var(--text-primary);
        }
        .section-card p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }
        .section-card .badge {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 4px;
        }

        /* ========== Article Page ========== */
        .article-page {
            display: none;
            animation: fadeSlide 0.3s ease;
        }
        .article-page.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .article-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0 8px;
            flex-wrap: wrap;
        }
        .article-header .back-btn {
            background: var(--bg-card);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .article-header .back-btn:hover {
            background: var(--accent-soft);
        }
        .article-header h2 {
            font-size: 1.4rem;
            font-weight: 700;
            flex: 1;
        }
        .article-actions {
            display: flex;
            gap: 8px;
        }
        .article-actions button {
            background: var(--bg-card);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1rem;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .article-actions button:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .article-actions button.fav-active {
            color: #c0392b;
        }

        .article-content {
            background: var(--bg-card);
            border-radius: var(--border-radius);
            padding: 28px 24px;
            box-shadow: var(--shadow);
            margin: 12px 0 30px;
            line-height: 1.9;
            font-size: 1.05rem;
            color: var(--text-secondary);
            transition: background 0.3s, color 0.3s;
        }
        .article-content p {
            margin: 0 0 16px 0;
        }
        .article-content .arabic-text, .article-content { font-family: 'Amiri', serif; }
        .article-content .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.15rem;
            line-height: 2.1;
        }
        .article-content .quran-verse {
            color: var(--accent);
            font-weight: 600;
        }
        .article-content hr {
            border: none;
            border-top: 1px solid var(--divider);
            margin: 22px 0;
        }
        .article-content blockquote {
            border-right: 4px solid var(--accent-light);
            padding-right: 18px;
            margin: 18px 0;
            background: var(--bg-primary);
            padding: 14px 20px;
            border-radius: 12px;
            font-style: italic;
        }

        /* ========== Font family switcher ========== */
        .font-switcher {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .font-switcher button {
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--header-text);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }
        .font-switcher button.active-font {
            background: var(--accent-light);
            color: #fff;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--header-bg);
            color: var(--header-text);
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 0.95rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 999;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            bottom: 40px;
        }

        /* ========== Responsive ========== */
        @media (max-width: 600px) {
            .app-header h1 { font-size: 1.1rem; }
            .sections-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .section-card { padding: 16px 14px; }
            .section-card h3 { font-size: 1rem; }
            .article-content { padding: 18px 16px; font-size: 0.98rem; }
            .article-header h2 { font-size: 1.2rem; }
            .font-controls button { width: 32px; height: 32px; font-size: 0.9rem; }
        }
        @media (max-width: 420px) {
            .sections-grid { grid-template-columns: 1fr; }
            .app-header .container { flex-direction: column; align-items: stretch; gap: 6px; }
            .header-actions { justify-content: space-between; }
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="container">
            <h1><i class="fas fa-book-quran"></i> تفسير الآيات</h1>
            <div class="header-actions">
                <div class="font-controls">
                    <button id="fontDecrease" title="تصغير الخط"><i class="fas fa-minus"></i></button>
                    <button id="fontIncrease" title="تكبير الخط"><i class="fas fa-plus"></i></button>
                </div>
                <div class="font-switcher" id="fontSwitcher">
                    <button data-font="Cairo">القاهرة</button>
                    <button data-font="Tajawal">تاجوال</button>
                    <button data-font="Noto Kufi Arabic">نوتو</button>
                    <button data-font="Amiri" class="active-font">أميري</button>
                </div>
                <button id="themeToggle" title="الوضع الليلي"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <!-- ===== SEARCH ===== -->
    <div class="search-wrap">
        <div class="container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن قسم أو آية..." />
            <button class="clear-search" id="clearSearch"><i class="fas fa-times-circle"></i></button>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container" id="appMain">
        <!-- Home / Sections -->
        <div id="homePage">
            <div class="sections-grid" id="sectionsGrid"></div>
        </div>

        <!-- Article Page -->
        <div id="articlePage" class="article-page">
            <div class="article-header">
                <button class="back-btn" id="backToHome"><i class="fas fa-arrow-right"></i></button>
                <h2 id="articleTitle">العنوان</h2>
                <div class="article-actions">
                    <button id="copyArticle" title="نسخ المقال"><i class="fas fa-copy"></i></button>
                    <button id="shareArticle" title="مشاركة"><i class="fas fa-share-alt"></i></button>
                    <button id="favArticle" title="المفضلة"><i class="fas fa-heart"></i></button>
                </div>
            </div>
            <div class="article-content" id="articleContent"></div>
        </div>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  DATA – Extracted exactly from the file, no changes.
        // ============================================================
        const sectionsData = [
            {
                id: "s1",
                title: "آية ومعنى (1)",
                icon: "fa-book",
                desc: "قوله تعالى ( وهو القاهر فوق عباده )",
                content: `<p><strong>قوله تعالى ( وهو القاهر فوق عباده )</strong> معناه فوقهم بالقهر والغلبة وليس بالحيز والمكان كما ذكر القرطبي في تفسيره فالله تعالى منزه عن التحيز في المكان والجهة.</p>
                <p>»كتاب تفسير القرطبي، طبع دار الكتب العلمية ط٢</p>
                <p>﴿وَهُوَ القَاهِرُ فَوْقَ عِبَادِهِ﴾: "الْقَهْرُ الْغَلَبَةُ، وَالْقَاهِرُ الْغَالِبُ".</p>
                <p>»ثم قال: "وَمَعْنَى ﴿فَوْقَ عِبادِهِ﴾ فَوْقِيَّةُ الِاسْتِعْلَاءِ بِالْقَهْرِ وَالْغَلَبَةِ عَلَيْهِمْ، أَيْ هُمْ تَحْتَ تَسْخِيرِهِ لَا فَوْقِيَّةَ مَكَانٍ، كَمَا تَقُولُ: السُّلْطَانُ فَوْقَ رَعِيَّتِهِ أَيْ بِالْمَنْزِلَةِ وَالرِّفْعَةِ".</p>
                <p>قال الامام الطبري في جامع البيان " وقد بينا ان كل شيء عال بقهر وغلبة على شيء ، فإن العرب تقول (وهو فوقه)</p>
                <p>وهذا في قوله تعالى " وهو القاهر فوق عباده "</p>
                <p>قرن الفوقية بصفة القهر والغلبة وليس الفوقية الجهوية .</p>
                <p>لان الله كان متصفا بعلو القدر والعظمة قبل خلق العرش ولما خلق العرش لم يزد العرش في كمال علو الله شيئا لان علوه تعالى لم يكن ناقصا واكتمل بوجود العرش ..</p>
                <p>فالعرش مخلوق اوجده الله من الماء وهو يشبه السرير الحسي الملموس عظيم الحجم وهو سقف الجنة كما قال الامام احمد كما ثبت عنده من الحديث وفوق العرش حقيقة كتاب مكتوب فيه ان رحمتي سبقت غضبي .. وقال بعض العلماء فوق العرش ايضا اللوح المحفوظ .. فهذا العلو المكاني الملموس الحسي مخلوق وهو عال جدا بالمناسبة اعلى العالم ...</p>
                <p>فلا يجوز ان يكون علو العرش او علو الكتاب الذي فوق العرش شبيها بعلو الله بأي وجه من الوجوه</p>
                <p>فالله ليس له شريك من خلقه في صفاته .. لا العرش شريك لله في العلو ولا الكتاب ولا الملائكة ولا غيرهم</p>
                <p>ولا يقال لمن خلق الاين اين</p>
                <p>لان الاين بالمعنى المكاني لا تليق بالله لانه غني عنها قبل ان يخلقها وبعد ان خلقها</p>
                <p>قال تعالى وخلق كل شيء</p>
                <p>و قال عليه السلام كان الله ولم يكن شيء غيره</p>
                <hr>
                <p>كلمة فوق في لغة العرب لها معنيان، إما أن تكون بمعنى ارتفاع المكان والجهة وإما أن تكون باعتبار الدرجة والقدرة والعلم، على حسب ما يفهم الشخص من كلمة الله فوق. إن كان يفهم منه أن الله متحيز في هذه الجهة، جهة فوق، فهو كفر. السماء في جهة فوق والعرش والملائكة أكثرهم في جهة فوق والنجم والشمس والقمر والجنة في جهة فوق، الله لا يقال فيه على هذا المعنى الله فوق، لا يقال. بالنسبة إلى الله فوق وتحت على حد سواء، بالنسبة إلى ذات الله العرش والأرض السفلى الأرض السابعة على حد سواء، ليس متحيزًا على العرش بحيث يكون بعيدًا عن الأرض، بل الأرض والعرش بالنسبة إلى ذات الله على حد سواء، لأنه موجود بلا مكان ولا جهة هذا هو عقيدة أهل الحق الذي عليه علماء الإسلام في الشرق والغرب. أما من يقول الله فوق ويفهم منه أنه أقدر من كل شىء وأعلم من كل عالم وأنه خالق كل شىء فلا يضر العقيدة. ﴿وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ﴾ معناه الله تعالى قاهر فوق عباده أي بالقدرة والعلم، معناه قادر عليهم، لا يخرج شىء عن قدرة الله وعن علم الله، هذا معنى ﴿وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ﴾ أي قهر كل شىء، أعلى من عباده، أي بالقدرة والعلم، على هذا المعنى من قال الله فوق لا يكفر. أما الذي يعتقد أن الله متحيز في جهة فوق كما أن العرش والسموات والجنة في جهة فوق، الذي يقول على هذا المعنى الله فوق كافر. كلمة فوق تقال لشىء في جهة فوق كما إذا قلنا السماء فوق والعرش فوق والجنة فوق ويقال أيضًا السلطان فوق الأمير والخليفة فوق السلطان معناه بالحكم والقوة والتدبير. الذي يقول الله فوق، إن كان يفهم من هذا أن الله في هذه الجهة، متحيز، كما أن النجوم والعرش والسموات والجنة متحيزون فوق في جهة فوق، من يعتقد أن الله أيضًا متحيز في جهة فوق على العرش أو على الكرسي، هذا كافر، ما عرف الله. الله تعالى كان قبل الفوق والتحت واليمين والشمال والأمام والخلف، قبل العرش، قبل الجهات الست، قبل الضوء وقبل الظلام، قبل المكان، قبل الزمان كان موجودًا، لا ابتداء لوجوده. ثم خلق المكان، خلق الجهات الست، خلق الشمس والقمر، وخلق الضوء والظلام والملائكة فهو كما كان قبل أن يخلق العالم، لم يتغير، لم يتخذ مكانًا. بعد أن خلق العرش لم يتخذ العرش مكانًا، هو كما كان قبل أن يخلق العرش لا يتغير. كل شىء يتحول من حال إلى حال مخلوق، الخالق لا يتحول من حال إلى حال، لذلك أي لأنه موجود بلا مكان ولا جهة وليس حجمًا كبيرًا ولا حجمًا صغيرًا ولا بأي حجم، لذلك لا يمكن تصور الله في النفس، لا يمكن. أما المخلوق بما أن له حجمًا كبيرًا أو صغيرًا لو لم نره نتصوره في عقولنا.</p>`
            },
            {
                id: "s2",
                title: "آية ومعنى (2)",
                icon: "fa-book",
                desc: "قوله تعالى ( الرحمن على العرش استوى )",
                content: `<p><strong>قوله تعالى ( الرحمن على العرش استوى )</strong> معناه الله تعالى قهر العرش وليس معنى استوى هنا جلس لأن الجلوس صفة المخلوق والله تعالى لا يوصف بذلك كما ذكر مثل هذا الرازي في تفسيره.</p>
                <p>فَسَّرَهُ بَعْضُ الْعُلَمَاءِ بِالْقَهْرِ لَكِنْ لا يُقْطَعُ بِأَنَّ مُرَادَ اللَّهِ بِالِاسْتِوَاءِ عَلَى الْعَرْشِ الْقَهْرُ إِنَّمَا يُظَنُّ ظَنًّا رَاجِحًا. وَمَعْنَى قَهْرِ اللَّهِ لِلْعَرْشِ الَّذِى هُوَ أَكْبَرُ الْمَخْلُوقَاتِ حَجْمًا أَنَّ الْعَرْشَ تَحْتَ تَصَرُّفِ اللَّهِ هُوَ أَوْجَدَهُ وَحَفِظَهُ وَأَبْقَاهُ، حَفِظَهُ مِنَ الْهُوِىِّ وَالسُّقُوطِ وَلَوْلا حِفْظُ اللَّهِ لَهُ لَهَوَى وَتَحَطَّمَ. أَمَّا مَنْ يُفَسِّرُ الِاسْتِوَاءَ بِالْجُلُوسِ أَوِ الِاسْتِقْرَارِ فَيَقُولُ إِنَّ اللَّهَ جَالِسٌ عَلَى الْعَرْشِ أَوْ مُسْتَقِرٌّ عَلَيْهِ أَوْ مُحَاذٍ لَهُ بِوُجُودِ فَرَاغٍ بَيْنَهُ وَبَيْنَ الْعَرْشِ فَهُوَ كَافِرٌ لِأَنَّهُ لَمْ يَعْرِفِ اللَّهَ. فَتُحْمَلُ الآيَةُ عَلَى الْقَهْرِ أَوْ يُقَالُ اسْتَوَى اسْتِوَاءً يَلِيقُ بِهِ أَوِ اسْتَوَى بِلا كَيْفٍ. وَالْكَيْفُ الْمَنْفِىُّ عَنِ اللَّهِ هُوَ مَا كَانَ مِنْ صِفَاتِ الْخَلْقِ كَالْجُلُوسِ وَالِاسْتِقْرَارِ وَالْمُحَاذَاةِ أَىْ كَوْنِ الشَّىْءٍ فِى مُقَابِلِ شَىْءٍ وَالتَّحَيُّزِ فِى الْمَكَانِ وَالْجِهَةِ. وَهَذِهِ الآيَةُ ﴿الرَّحْمٰنُ عَلَى الْعَرْشِ اسْتَوَى﴾ مِنَ الآيَاتِ الْمُتَشَابِهَةِ وَقَدْ وَرَدَ عَنِ النَّبِىِّ ﷺ اعْمَلُوا بِمُحْكَمِهِ (أَىِ الْقُرْءَانِ) وَءَامِنُوا بِمُتَشَابِهِهِ رَوَاهُ ابْنُ حِبَّانَ فِى صَحِيحِهِ. وَءَامِنُوا بِمُتَشَابِهِهِ أَىْ مِنْ غَيْرِ أَنْ تَتَوَهَّمُوا أَنَّ مَعَانِيَهُ مِنْ صِفَاتِ الأَجْسَامِ فَقَدْ نَقَلَ الْبَيْهَقِىُّ فِى كِتَابِ الْمُعْتَقَدِ بِإِسْنَادِهِ عَنِ الأَوْزَاعِىِّ وَمَالِكٍ وَسُفْيَانَ وَاللَّيْثِ بنِ سَعْدٍ أَنَّهُمْ سُئِلُوا عَنِ الآيَاتِ الْمُتَشَابِهَةِ فَقَالُوا أَمِّرُوهَا كَمَا جَاءَتْ بِلا كَيْفِيَّةٍ، أَىْ ءَامِنُوا بِهَا وَلا تُفَسِّرُوهَا تَفْسِيرًا فَاسِدًا بِنِسْبَةِ الْكَيْفِيَّةِ إِلَى اللَّهِ. وَلْيُعْلَمْ أَنَّ الِاسْتِوَاءَ فِى لُغَةِ الْعَرَبِ لَهُ خَمْسَةَ عَشَرَ مَعْنًى مِنْهَا مَا لا يَلِيقُ بِاللَّهِ كَالْجُلُوسِ وَالِاسْتِقْرَارِ وَمِنْهَا مَا يَلِيقُ بِاللَّهِ كَالْقَهْرِ لِقَوْلِهِ تَعَالَى ﴿وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ﴾.</p>`

                content: `<p><strong>قوله تعالى ( وهو معكم أينما كنتم )</strong> معناه بعلمه وليس معناه أن الله تعالى متحيز في كل مكان كما يقول بعض الناس ( الله موجود في كل مكان ) بل هذا الكلام لا يجوز لأن الله تعالى هو خالق الأمكنة ولا يحتاجها.</p>
                <p>تفسير قول الله تعالى : { وهو معكم أين ما كنتم } [4: سورةالحديد] أي بالعلم والقدرة (أي الله عالم بكم أينما كنتم). قال الثوري: المعنى علمه معكم.</p>
                <p>وهذه الآية أجمعت الأمّة على هذا التأويل فيها، وأنها لا تحمل على ظاهرها من المعية بالذات.</p>

                content: `<p><strong>قوله تعالى ( ما منعك أن تسجد لما خلقت بيديّ )</strong> يجوز أن يكون المراد باليدين الحفظ والعناية أي أن ءادم عليه السلام خلقه الله بعنايته وحفظه لأنه مشرف عند الله ولا يجوز أن نفسر اليدين بالعضو الجارح لأن الله منزه عن ذلك.</p>
                <p>قوله تعالى في توبيخ إبليس الذي استكبر عن السجود لنبيّ الله آدم ‏سجود تحية بعدما أمره الله بذلك فكفر والعياذ بالله لاستكباره وتعنّته: ‌‏"ما منعكَ أن تسجدَ لِما خلقتُ بِيَدَيَّ" (الآية 75 من سورة صاد)، قال ‏فيه العلامة أبو حيان الأندلسي في البحر المحيط إن ذلك عبارة عن ‏القدرة والقوة، ومعلوم لمن مارس شيئاً من علم النحو واللغة والتفسير ‏أن أبا حيان من كبار اللغويين والنحاة فلا يُعترض على مثله في ذلك، ‏ومن أين لمعترض على تأويل أبي حيان أن يجاريه علماً وفقهاً.‏</p>
                <p>وقال الماوردي في تفسيره "بيديّ" فيه أوجه منها بقدرتي ومنه قول ‏الشاعر‎:‌‏ تحملت من عفراء ما ليس لي به.. ولا للجبال الراسيات يدان ‌‏(هي بمعنى القدرة وإن جاءت من حيث اللفظ بالتثنية "يدان")‌‎.‌‏</p>
                <p>ويجوز ‏أن يقال المراد باليَدين هنا العناية والحفظ، ويدلّ قوله تعالى: "بيديَّ" ‏على أن آدم خُلِق مُشرّفا مُكرّماً بخلاف إبليس خلقه الله للإهانة، ‏وكلاهما بل وسائر المخلوقات خلقها الله بقدرته كما يقول السادة ‏الأشاعرة‎.</p>
                <p>ولا يجوز أن تحمل كلمة بيدَيَّ على معنى الجارحة أي العضو لأنه لو ‏كانت لله جارحة لكان شبيهاً لنا، ولجاز عليه التعب كما يجوز علينا، ‏ولو كان مِثلنا لَما استطاع أن يخلقنا، فلذلك قال العلماء "بيديّ" معناه ‏أن نبيّ الله آدم خُلق بقدرة الله على وجه الإكرام والتعظيم، أما إبليس ‏فما خلقه الله تعالى بعنايته لأن الله عالم في الأزل بأن إبليس خبيث، ‏فهذا هو الفرق هنا بين سيدنا آدم نبي الله وإبليس عدو الله‎.</p>
                <p>وقال بعض العلماء بالتأويل الإجمالي فقالوا يصح أن يقال لله يد بلا ‏كيف بمعنى الصفة لا على معنى الجارحة، قالوا يد لا كأيدينا على ‏معنى الصفة لا على معنى الجسمية، لأن الله مستحيل عليه الحجم ‏والجسمية والكيفية والهيئة والصورة والجهة والمكان سبحانه ليس ‏كمثله شىء.‏</p>
                <p>وأما الوقوف بين يدي الله للحساب يوم القيامة فمعناه حساب العباد عند ‏عرض أعمالهم عليهم، وليس المعنى أن الله تعالى يكون في موقف ‏القيامة ويكون الناس حوله لأن الله تعالى ليس جسماً يَتحيّز في مكان‎.‌‏ ‏الله منزه عن صفات المخلوقين، مهما تصورتَ ببالك فالله بخلاف ‏ذلك.‏</p>`
            },
            {
                id: "s8",
                title: "آية ومعنى (8)",
                icon: "fa-book",
                desc: "قوله تعالى ( فنفخنا فيه من روحنا )",
                content: `<p><strong>قوله تعالى ( فنفخنا فيه من روحنا )</strong> معناه أن الله تعالى أمر جبريل عليه السلام أن ينفخ في مريم الروح التي هي مخلوقة لله وملك له ومشرفة عنده ولا يجوز أن يقال إن لله روحا وعيسى جزء منها فالله منزه عن ذلك.</p>
                <p>مَا مَعْنَى قَوْلِهِ تَعَالَى ﴿فَنَفَخْنَا فِيهِ مِنْ رُّوحِنَا﴾.</p>
                <p>اعْلَمْ أَنَّ اللَّهَ تَعَالَى هُوَ خَالِقُ الرُّوحِ وَالْجَسَدِ فَلَيْسَ رُوحًا وَلا جَسَدًا لَكِنَّهُ أَضَافَ رُوحَ عِيسَى إِلَى نَفْسِهِ عَلَى مَعْنَى الْمِلْكِ وَالتَّشْرِيفِ أَىِ التَّعْظِيمِ لِلدِّلالَةِ عَلَى شَرَفِ رُوحِ عِيسَى عِنْدَ اللَّهِ لا عَلَى مَعْنَى الْجُزْئِيَّةِ فَمَعْنَى قَوْلِهِ تَعَالَى ﴿فَنَفَخْنَا فِيهِ مِنْ رُّوحِنَا﴾ أَمَرْنَا جِبْرِيلَ عَلَيْهِ السَّلامُ أَنْ يَنْفُخَ فِى مَرْيَمَ الرُّوحَ الَّتِى هِىَ مِلْكٌ لَنَا وَمُشَرَّفَةٌ عِنْدَنَا لِأَنَّ الأَرْوَاحَ قِسْمَانِ أَرْوَاحٌ مُشَرَّفَةٌ لَهَا مَنْزِلَةٌ عَظِيمَةٌ عِنْدَ اللَّهِ كَأَرْوَاحِ الأَنْبِيَاءِ وَالأَوْلِيَاءِ وَالْمَلائِكَةِ وَأَرْوَاحٌ خَبِيثَةٌ لا يُحِبُّهَا اللَّهُ وَهِىَ أَرْوَاحُ الْكُفَّارِ. أَمَّا الَّذِى يَعْتَقِدُ أَنَّ اللَّهَ رُوحٌ وَأَنَّهُ اقْتَطَعَ مِنْ ذَاتِهِ الَّذِى هُوَ رُوحٌ قِطْعَةً فَنَفَخَهَا فِى عِيسَى بِوَاسِطَةِ النَّفَسِ كَمَا يَنْفُخُ الإِنْسَانُ فَقَدْ شَبَّهَ اللَّهَ بِخَلْقِهِ وَكَانَ مِنَ الْكَافِرِينَ</p>`
            },
            {
                id: "s9",
                title: "آية ومعنى (9)",
                icon: "fa-book",
                desc: "قوله تعالى ( أن طهّرا بيتي للطائفين )",
                content: `<p><strong>قوله تعالى ( أن طهّرا بيتي للطائفين )</strong> معناه البيت الذي هو مشرف عند الله وليس معناه أن الله تعالى يسكن الكعبة لأن الله تعالى منزه عن التحيز في المكان فإضافة البيت لله تعالى إضافة تشريف.</p>
                <p>قال الله تعالى: {وَعَهِدْنَا إِلَى إِبْرَاهِيمَ وَإِسْمَاعِيلَ أَنْ طَهِّرَا بَيْتِي} [سورة البقرة]</p>
                <p>قول الله تعالى في الكعبة {بَيْتِي} إضافة ملك للتشريف لا إضافة صفة أو ملابسة لاستحالة الملامسة أو المماسة بين الله والكعبة. قال البغوي في تفسيره :{أَنْ طَهِّرَا بَيْتِي} يعني: الكعبة أضافه إليه تخصيصًا وتفضيلا» اهـ. قال الله تعالى عن الكعبة لإبراهيم وإسماعيل {أَنْ طَهِّرَا بَيْتِي} ليفهمنا أن للكعبة عنده مقاما عاليا وأنها مشرفة عنده .</p>`
            },
            {
                id: "s10",
                title: "آية ومعنى (10)",
                icon: "fa-book",
                desc: "قوله تعالى ( وجاء ربك والملك صفا صفا )",
                content: `<p><strong>قوله تعالى ( وجاء ربك والملك صفا صفا )</strong> معناه جاء أمر ربك أي أثر من ءاثار ربك كما ثبت عن الإمام أحمد أنه قال جاءت قدرته، وليس معناه مجىء الحركة والانتقال لأن الله تعالى منزه عن الحركة والسكون لأنهما من خلق الله تعالى وهما من صفات المخلوقين.</p>
                <p>تفسير قول الله تعالى: ﴿وَجَاءَ رَبُّكَ وَالمَلَكُ صَفًّا صَفًّا﴾</p>
                <p>كتاب "تفسير القرطبي"، المعروف كذلك باسم "الجامع لأحكام القرءان" طبعة دار الكتب العلمية، الطبعة الثانية سنة ١٤٢٤هـ وفي المجلد العاشر، في الجزء العشرين، في الصحيفة ۳۷،</p>
                <p>يقول القرطبي في تفسير قول الله تعالى: ﴿وَجَاءَ رَبُّكَ وَالمَلَكُ صَفًّا صَفًّا﴾ "قوله تعالى: ﴿وَجَاءَ رَبُّكَ﴾ أي أَمْرُهُ وَقَضاؤُهُ".</p>
                <p>ثم يقول: وَقيلَ: جَاءَهُمُ الرَّبُّ بِالآياتِ الْعَظيمَةِ.</p>
                <p>ثم يقول: "وَاللَّهُ جَلَّ ثَنَاؤُهُ لَا يُوصَفُ بِالتَّحَوُّلِ مِنْ مَكَانٍ إِلَى مَكَانٍ، وَأَنَّى لَهُ التَّحَوُّلُ وَالِانْتِقَالُ، وَلَا مَكَانَ لَهُ وَلَا أَوَانَ، وَلَا يَجْرِي عَلَيْهِ وَقْتٌ وَلَا زَمَانٌ ". اهـ.</p>`
            },
            {
                id: "s11",
                title: "آية ومعنى (11)",
                icon: "fa-book",
                desc: "قوله تعالى ( أقرب إليه من حبل الوريد )",
                content: `<p><strong>قوله تعالى ( أقرب إليه من حبل الوريد )</strong> معناه أن الله تعالى أعلم بالعبد من نفسه، وليس معناه أن الله قريب منا حسا فالله منزه عن المكان، والوريد عِرقان في الإنسان من جانبي الرقبة ينزلان من الرأس ويتصلان بعِرق القلب.</p>
                <p>قال اللهُ تعالى: "وَنَحْنُ أَقرَبُ إلَيهِ مِنْ حَبْلِ الوَرِيْد". أي أنَّ اللهَ أعلم بالعبد من نفسه، هو سبحانه أعلم بنا من أنفسنا، إذْ هو خالقنا وخالق أعمالنا وحركاتنا. أما الوريد فعرقان في الإنسان من جانبي الرّقبة. وليس المعنى أنَّ اللهَ داخلٌ فينا أو حالٌّ فينا نعوذ بالله من اعتقاد أهل الكفر والحلول.</p>
                <p>قال الإمام أبو حنيفة في الفقه الأكبر: (وليس قرب الله تعالى من طريق المسافة "لأن المسافة للمخلوق" وأما الخالق فموجود بلا كيف ولا مكان ولا جهة، لا يكون بينه وبين خلقه مسافة).</p>
                <p>قال الحافظ محمّد مرتضى الزبيدي في كتابه إتحاف السّادة المتّقين في شرح أسرار إحياء علوم الدين 2/25: "وهذا معنى قوله تعالى: "ونحن أقرب إليه من حبل الوريد" أيْ أعلم منه بنفسه.</p>
                <p>وقال الطبري "فلا شىء أقرب إلى شىء منه،</p>
                <p>كما قال ﴿وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ﴾ (16) [سورة ق]" انتهى. [ :جامع البيان (مجلد 13/ جزء 27/ ص 215]</p>
                <p>ليس المراد به القرب الجسماني والعياذ بالله من الكفر لأن الله ليس جسمًا والجسم من صفات المخلوقات، فاللهُ تبارك وتعالى يستحيل عليه القرب المسافي .</p>`
            },
            {
                id: "s12",
                title: "آية ومعنى (12)",
                icon: "fa-book",
                desc: "قوله تعالى ( فأينما تولوا فثَمّ وجه الله )",
                content: `<p><strong>قوله تعالى ( فأينما تولوا فثَمّ وجه الله )</strong> معناه أينما وجهتم وجوهكم في صلاة النفل في السفر فتلك الوجهة التي توجهتم لها هي قبلة لكم، ولا يراد بالوجه العضو الجارح لأن الله منزه عن ذلك.</p>
                <p>قال الله تعالى: *{وَللهِ المَشْرِقُ والمَغْرِبُ فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللهِ}* [سورة البقرة115] فما معناها؟</p>
                <p>فقول الله تعالى *{فأيْنَمَا تُوَلُّوا}* أي أيَّ جهة تستقبلوا وتتوجهوا في السفر، كصلاة النفل في السفر كالوتر وأنتم على ظهور الدواب أو مشاة *{فَثَمَّ وَجْهُ اللهِ}* أي في الجهة التي تتوجهون إليها وجه الله أي قِبلة الله.</p>
                <p>القِبلة في السفر للمسافر الذي يريد السُّنة هي الوجهة التي هو سائر إليها، إن كنت مغرّباً فقبلتك المغرب، وإن كنت سائراً إلى الجنوب فقبلتك الجنوب، وإن كنت سائراً إلى الشمال فقبلتك الشمال، في نفل السفر إذا الإنسان كان على دابّة أو ماشياً خارج البلد أراد أن يصلّي الوتر أو الضحى أو سنّة الظهر أو سنّة العصر أو غير ذلك من الصلوات النّافلة غير الفرض فقبلته الجهة التي هو قاصدها ليس عليه أن يستقبل الكعبة الشريفة بل يستقبل في تكبيرة الاحرام تخفيفاً من الله تبارك وتعالى أما الفرض فلا يصلّى إلا باستقبال الكعبة الشريفة، وجه الله معناه قبلة الله في هذه الآية.</p>
                <p>الوجه في لغة العرب له أكثر من معنى، ليس معناه هذا الجزء الذي نعلمه من أنفسنا فقط، لغة العرب واسعة.</p>`
            },

                content: `<p><strong>قوله تعالى ( الله نور السموات والأرض )</strong> معناه أن الله تعالى هادي أهل السموات ومن شاء من أهل الأرض لنور الإيمان كما قال ابن عباس ولا يجوز تفسير النور بالضوء لأن الله تعالى ليس نورا بمعنى الضوء فالله هو خالق الضوء.</p>
                <p>*مَا مَعْنَى قَوْلِهِ تَعَالَى فِى سُورَةِ النُّورِ ﴿اللَّهُ نُورُ السَّمَوَاتِ وَالأَرْضِ﴾.*</p>
                <p>اعْلَمْ أَنَّ النُّورَ يُطْلَقُ عَلَى اللَّهِ بِمَعْنَى الْهَادِى فَمَعْنَى قَوْلِهِ تَعَالَى ﴿اللَّهُ نُورُ السَّمَوَاتِ وَالأَرْضِ﴾ أَنَّ اللَّهَ تَعَالَى هَادِى أَهْلِ السَّمَوَاتِ وَالأَرْضِ لِنُورِ الإِيمَانِ رَوَاهُ الْبَيْهَقِىُّ فِى الأَسْمَاءِ وَالصِّفَاتِ عَنْ عَبْدِ اللَّهِ بنِ عَبَّاسٍ رَضِىَ اللَّهُ عَنْهُمَا أَىْ أَنَّ اللَّهَ تَعَالَى أَعْطَى الإِيمَانَ لِأَهْلِ السَّمَوَاتِ وَهُمُ الْمَلائِكَةُ وَلِمَنْ شَاءَ لَهُ الإِيمَانَ مِنْ أَهْلِ الأَرْضِ مِنَ الإِنْسِ وَالْجِنِّ وَقَالَ قَتَادَةُ ﴿اللَّهُ نُورُ السَّمَوَاتِ وَالأَرْضِ﴾ أَىْ مُنِيرُ السَّمَوَاتِ وَالأَرْضِ ذَكَرَهُ ابْنُ السَّمْعَانِىِّ فِى تَفْسِيرِهِ. وَحُكْمُ مَنْ يَعْتَقِدُ أَنَّ اللَّهَ نُورٌ بِمَعْنَى الضَّوْءِ التَّكْفِيرُ قَطْعًا لِأَنَّ الضَّوْءَ مَخْلُوقٌ بِدَلِيلِ قَوْلِهِ تَعَالَى فِى سُورَةِ الأَنْعَامِ ﴿الْحَمْدُ لِلَّهِ الَّذِى خَلَقَ السَّمَوَاتِ وَالأَرْضَ وَجَعَلَ الظُّلُمَاتِ وَالنُّورَ﴾ أَمَّا إِذَا قَالَ قَائِلٌ اللَّهُ نُورٌ بِمَعْنَى الْهَادِى فَلا يُعْتَرَضُ عَلَيْهِ لِأَنَّ اللَّهَ تَعَالَى سَمَّى نَفْسَهُ بِهَذَا الِاسْمِ قَالَ تَعَالَى فِى سُورَةِ النُّورِ ﴿اللَّهُ نُورُ السَّمَوَاتِ وَالأَرْضِ﴾ وَوَرَدَ هَذَا الِاسْمُ فِى تَعْدَادِ أَسْمَاءِ اللَّهِ الْحُسْنَى عِنْدَ الْبَيْهَقِىِّ وَغَيْرِهِ.</p>`
            },

                content: `<p><strong>قوله تعالى ( أمره إذا أراد شيئا أن يقول له كن فيكون )</strong> معناه أن الله تعالى يوجد الأشياء بدون تعب ومشقة وليس معناه أن الله كلما أراد أن يخلق شيئا يقول هذان الحرفان ( كن ) لأن كلام الله ليس حرفا وكلامه لا يشبه كلامنا ..</p>
                <p>تفسير قوله تعالى "إنّما أمْرُه إذا أراد شيئا أن يقول له كُنْ فيكون":</p>
                <p>اعلم أخي المسلم أن معنى هذه الآية أن الله يُوجِد الأشياء بدون تعب ولا مشقّة ولا مُمانعة أحد له أي أنه يخلق الأشياء التي شاء أن يخلقها بسرعة بلا تأخر عن الوقت الذي شاء وجودها فيه فمعنى "كُنْ فَيَكُونُ" يدل على سرعة الإيجاد وليس المعنى أن الله ينطق بلفظ كُن المُركّب من الكاف والنون بعدد مخلوقاته وإلا لكان معنى ذلك أن الله كل الوقت يقول كُن كُن كُن وهذا مُحال لأن الله عز وجل يخلق في اللحظة الواحدة ما لا يدخل تحت الحصر والله تعالى مُنَزَّه عن أن يتكلّم بكلام هو حرف وصوت كما نحن نتكلّم وإنما نزل هذا في القرءان بهذه العبارة لتقريب المعنى إلى عباده وذلك أن كلمة كُنْ أسهل شىء بالنسبة للعباد فيكون المعنى أن الله هيِّن عليه إيجاد ما أراد وجوده كما يهون على العباد النطق بهذه الكلمة. وإنما امتنع تفسير الآية على الظاهر الذي هو نسبة إثبات النطق بالحرف إلى الله لأنه لو كان الله ينطق بهذه الكلمة لَلَزِمَ تشبيه الله بخلقه ولو كان الله يتكلّم بهذه الكلمة بالحرف والصوت لكان مثل عباده فلو كان يجوز هذا على الله لكان يجوز عليه كل صفات البشر وذلك يُنافي التوحيد لأن التوحيد عَدَم تشبيه الله بشىء من خلقه ثم "كُنْ" لغة عربية والله تعالى كان قبل اللغات كلها وقبل أصناف المخلوقات فعلى قول الوهابية أدعياء السلفيّة يلزم أن يكون الله ساكتا قَبْلُ ثم صار مُتكلِّما وهذا مُحال لأن هذا شأن البشر وغيرهم.</p>
                <p>والله اعلم واحكم</p>`
            },
            {
                id: "s15",
                title: "آية ومعنى (15)",
                icon: "fa-book",
                desc: "قوله تعالى ( ومكروا ومكر الله والله خير الماكرين )",
                content: `<p><strong>قوله تعالى ( ومكروا ومكر الله والله خير الماكرين )</strong> معناه أن الله تعالى أقوى في إيصال الضرر إلى الماكرين من كل ماكر جزاء لهم على مكرهم ولا يجوز وصف الله تعالى بالمكر الذي هو الاحتيال لأنه مستحيل على الله.</p>
                <p>قال تعالى ﴿ومكروا ومكر الله والله خير الماكرين﴾ أي أن الله أقوى في إيصال الضرر إليهم من حيث لا يشعرون</p>
                <p>قال أبو حيان الأندلسي في تفسيره البحر المحيط: قوله تعالى: {وَمَكَرُواْ وَمَكَرَ اللهُ} الضمير في مكروا عائد على من عاد عليه الضمير في: {فَلَمَّا أَحَسَّ عِيسىَ مِنْهُمُ الكُفْرَ} وهم بنو إسرائيل، ومكرهم هو احتيالهم في قتل عيسى بأن وكلوا به من يقتله غيلة، ومَكْرُ الله مجازاتهم على مكرهم، سمى ذلك مكرًا لأن المجازاة لهم ناشئة عن المكر كقوله: {وَجَزَاء سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا} [سورة الشورى]. وقوله: {فَمَنِ اعْتَدَى عَلَيْكُمْ فَاعْتَدُواْ عَلَيْه} [سورة البقرة].</p>
                <p>وكثيرًا ما تسمى العقوبة باسم الذنب وإن لم تكن في معناه.</p>
                <p>قوله تعالى: {وَاللَّهُ خَيْرُ الْمَاكِرِينَ} معناه المجازين على المكر بما يستحق فاعله.</p>
                <p>هذا يسمى (اسلوب المشاكلة) وهو اسلوب معروف عند العرب, وهو ذكر معنى بلفظ غيره لوقوعه في صحبة ذلك الغير وقد جاء من قبيل الجزاء من جنس العمل. كقوله تعالى: (مكروا ومكر الله) وقوله: (نسوا الله فنسيهم) وقوله: (يخادعون الله وهو خادعهم)</p>
                <p>والرسول صلى الله عليه وسلم قال: من سمّع سمَّع الله به, ومن يرائي يرائي الله به</p>`
            },
            {
                id: "s16",
                title: "آية ومعنى (16)",
                icon: "fa-book",
                desc: "قوله تعالى ( ومن لم يؤمن بالله ورسوله فإنا أعتدنا للكافرين سعيرا )",
                content: `<p><strong>قوله تعالى ( ومن لم يؤمن بالله ورسوله فإنا أعتدنا للكافرين سعيرا )</strong> معناه من لم يَجمَع الإيمان بالنبي إلى الإيمان بالله تعالى إلى أن مات ولم يحصل ذلك فلا يكون مؤمنا وقد هيأ الله له نار جهنم جزاء في الآخرة.</p>
                <p>الذي لا يؤمنُ بمحمّدٍ فهوَ كافِر، الله تعالى قال:" ومَن لم يؤمِن بالله ورسولِه فإنّا اعتَدنا للكافِرين سعيرًا" ورسولِه أي محمّد أي أن مَن لم يؤمن بالله كما يجب وبمحمّدٍ أنّهُ رَسولُ الله صادقٌ فيما جاءَ به ويَرضَى بذلكَ فهوَ كافرٌ مِن أهلِ النار المؤبَّدين المخلّدين، إذا إنسانٌ وحَّدَ الله وقالَ الله موجودٌ واحِدٌ أحَدٌ لا شريكَ لهُ ولا شبِيهَ، أزليٌّ أبديّ، لكن ما صَدّق بمحمّد هذا كافرٌ، ومَن شَكّ في كفره فهوَ كافِر.</p>
                <p>والذي وقَع في الكُفر لا يَنفَعُه قولُه أستَغفرُ الله، أستغفرُ الله يُفِيد المُسلِم الذي وقَع في معصيةٍ كبيرةٍ أو صغيرة، الذي يُكذّب نبيًّا مِن أنبياءِ الله فهو كافرٌ مؤبَّدٌ في النار.</p>
                <p>قوله تعالى :"فإنا أعتَدنا للكافرينَ سعِيرًا" معناهُ نحن هَيّأنا لهم النارَ الشّديدةَ أي جهنّمَ لكُفرهِم، لكفرهِم هيّأنا لهمُ النارَ الشّديدة.</p>
                <p>اللهُ تعالى أنزَل القرآنَ بلِسانٍ عربيٍّ مُبِين وجعَلَهُ أفصَح كلام، فقولُه تَعالى " فإنّا أَعتَدنا للكافرين سعيراً" المعنى أنّ اللهَ هيّأ لهم لكُفرِهم سعيرًا أي نارًا شَديدةً أي جهنّم، ما قالَ فإنا اعتَدنا لهم سعيرًا بل قالَ فإنّا أعتدنا للكافرينَ سعيرًا أي هيّأنا لأولئكَ الذينَ لا يؤمنونَ بالله ورسولِه نارًا شَديدةً لكُفرِهم، فأفَادنا بهذا التّعبِير أنّ أولئك كُفّار وأفادَنا أيضًا أنهم مِن أهلِ النار الخالدِينَ فيها، أفادَنا مَعنَيَين.</p>`
            },
            {
                id: "s17",
                title: "آية ومعنى (17)",
                icon: "fa-book",
                desc: "قوله تعالى ( إن الدين عند الله الإسلام )",
                content: `<p><strong>قوله تعالى ( إن الدين عند الله الإسلام )</strong> معناه الدين الوحيد المقبول في الآخرة هو الإسلام وهو دين جميع الأنبياء من ءادم لمحمد عليهم الصلاة والسلام فمن عدل عنه فقد خاب وخسر.</p>
                <p>[《أدلة قرآنية على أن الدين السماوي الوحيد هو الإسلام وأنه دين جميع الأنبياء》]</p>
                <p>يقول الله تعالى في القرآن الكريم:</p>
                <p>- سورة آلِ عمران: (آية 19) {إنّ الدينَ عندَ الله الإسلام وما اختلفَ الذين أوتوا الكتابَ إلا من بعدِ ما جآءهم العلمُ بغيًا بينَهم}</p>
                <p>- سورة آل عمران (آية 85)/ (وتدلّ أنّ الدينَ الحق هو الإسلام) {ومَنْ يبتغِ غيرَ الإسلامِ دينًا فلنْ يُقبَلَ منه وهو في الآخرةِ من الخاسرين}</p>
                <p>- سورة المائدة: (آية 3) {اليومَ أكملتُ لكم دينَكم وأتْمَمْتُ عليكم نعمتي ورَضيتُ لكم الإسلامَ دينًا}</p>
                <p>- سورة الصف: (آية 7) {ومَنْ أظلمُ مِمّن افترى على اللهِ الكذبَ وهو يُدعَى إلى الإسلام}</p>
                <p>- سورة البقرة: (128) {ربَّنا واجعلنا مُسلِمَيْنِ لكَ ومِنْ ذرّيَتِنآ أمةً مُسْلِمةً لك} (هذا عن سيّدنا إبراهيم وسيّدنا إسماعيل عليهما السلام).</p>
                <p>- في سورة البقرة: (آية 132) {ووصّى بهآ إبراهيمُ بَنِيهِ ويعقوبُ يآ بَنِيَّ إنّ اللهَ اصطفى لكمُ الدينَ فلا تَموتُنَّ إلا وأنتم مسلمون}</p>
                <p>- في سورة البقرة: (133) {أمْ كنتم شهدآءَ إذْ حضرَ يعقوبُ الموتُ إذْ قال لبَنِيهِ ما تعبدونَ مِنْ بعدي قالوا نعبُدُ إلهكَ وإلهَ ءابآئِكَ إبراهيمَ وإسماعيلَ وإسحقَ إلهًا واحدًا ونحنُ له مسلمون}</p>
                <p>- وفي سورة البقرة: (آية 136) {قولوا آمنّا باللهِ ومآ أُنزِلَ إلينا ومآ أُنزِلَ إلى إبراهيمَ وإسماعيلَ وإسحقَ ويعقوبَ والأسباط ومآ أوتيَ موسى وعيسى ومآ أوتيَ النّبيونَ مِنْ ربِّهم لا نُفرِّقُ بينَ أحدٍ منهم ونحنُ له مسلمون}</p>
                <p>- وفي سورةِ آلِ عمران: (آية 52) {فلمّآ أحسَّ عيسى منهم الكفرَ قال مَنْ أنصاري إلى الله قال الحواريّونَ نحنُ أنصارُ الله آمنّا بالله واشهدْ بأنّا مسلمون}</p>
                <p>- وفي سورة آل عمران: (آية 64) {قلْ يآ أهلَ الكتابِ تعالَوا إلى كلمةٍ سوآءٍ بينَنا وبينَكم ألّا نعبُدَ إلا اللهَ ولا نُشرِكَ به شيئًا ولا يتّخِذَ بعضُنا بعضًا أربابًا مِنْ دونِ الله فإنْ توَلَّوْا فقولوا اشهدوا بأنّا مسلمون}</p>
                <p>- في سورة آلِ عمران: (67) {ما كان إبراهيمُ يهوديًّا ولا نصرانيًّا ولكنْ كان حنيفًا مسلمًا وما كان من المشركين}</p>
                <p>- سورة آل عمران: (آية 80) {ولا يأمرَكمْ أنْ تتّخِذوا الملآئكةَ والنّبيينَ أربابًا أيأمرُكم بالكفرِ بعدَ إذْ أنتمْ مسلمون}</p>
                <p>- سورة آلِ عمران: (102) {يآ أيها الذين آمنوا اتّقوا اللهَ حقَّ تُقاتِه ولا تموتُنَّ إلا وأنتم مسلمون}</p>
                <p>- سورة المائدة: (آية 111) {وإذْ أوْحَيْتُ إلى الحواريينَ أنْ آمِنوا بي وبرسولي قالوا آمنّا واشهدْ بأنّنا مسلمون}</p>
                <p>- سورة الأنعام: (آية 163) {لا شريكَ له وبذلكَ أُمِرْتُ وأنا أوّلُ المسلمين} يعني إبراهيم كان أول مسلمي زمانِه، ونبيُّنا كذلك كان أول مسلمي زمانِه بين البشر على وجه الأرض</p>
                <p>- سورة الأعراف: (آية 126) {وما تَنْقِمُ منّآ إلآ أنْ ءامنّا بآياتِ ربِّنا لمّا جآءَتْنا ربَّنآ أفرِغْ علينا صبرًا وتوَفَّنا مسلمين}</p>
                <p>- سورة يونس: (آية 84) {وقال موسى يا قومِ إنْ كنتم ءامنتُم بالله فعليه توكّلوا إنْ كنتم مسلمين}</p>
                <p>- سورة يونس: (آية 90) {حتى إذآ أدركَه الغرقُ قال ءامنتُ أنه لآ إله إلا الذي ءامنَتْ به بَنو إسرآئيلَ وأنا من المسلمين}</p>
                <p>- سورة هود: (آية 14) {فإلّم يستجيبوا لكم فاعلموا أنّمآ أُنزِلَ بعلمِ الله وأنْ لآ إله إلا هو فهل أنتم مسلمون}</p>
                <p>- سورة يوسف: (101) {ربِّ قدْ ءاتَيْتَني من المُلكِ وعلّمتَني مِنْ تأويلِ الأحاديث فاطرَ السمواتِ والأرضِ أنتَ وليِّ في الدنيا والآخرة توَفَّني مسلمًا وألْحِقْني بالصالحين}</p>
                <p>- سورة الحِجر: (آية 2) {رُبَما يوَدُّ الذين كفروا لوْ كانوا مسلمين}</p>
                <p>- سورة النحل: (89) {ونزّلْنا عليك الكتابَ تِبْيانًا لكلِّ شىءٍ وهدىً ورحمةً وبشرَى للمسلمين}</p>
                <p>- سورة النحل: (102) {قلْ نزّلَه روحُ القُدُسِ مِنْ ربِّكَ بالحقِّ ليُثَبِّتَ الذين ءامنوا وهدًى وبشرَى للمسلمين}</p>
                <p>- سورة الأنبياء: (آية 108) {قل إنّما يُوحى إليَّ أنّمآ إلهُكم إلهٌ واحد فهل أنتم مسلمون}</p>
                <p>- سورة الحج: (آية 78) {وجاهِدوا في اللهِ حقَّ جهادِه هو اجْتَباكم وما جعلَ عليكم في الدينِ مِنْ حرَج ملّةَ أبيكم إبراهيم هو سمّاكمُ المسلمينَ مِنْ قبلُ وفي هذا ليَكونَ الرسولُ شهيدًا عليكم وتكونوا شهدآءَ على الناس}</p>
                <p>- سورة النمل: (آية 31) {ألّا تعلُوا عليّ وأْتوني مسلمين}</p>
                <p>- سورة النمل: (81) {ومآ أنتَ بهادي العُميِ عنْ ضلالتِهم إنْ تُسمِعُ إلا مَنْ يؤمنُ بآياتِنا فهم مسلمون}</p>
                <p>- سورة النمل: (آية 91) {إنّمآ أُمِرْتُ أنْ أعبدَ ربَّ هذه البلْدة الذي حرَّمَها وله كلُّ شىءٍ وأُمِرْتُ أنْ أكونَ من المسلمين}</p>
                <p>- سورة القصص: ( آية 53) {وإذا يُتلى عليهم قالوا آمنّا به إنّه الحقُّ مِنْ ربِّنآ إنّا كنا مِنْ قبلِه مسلمين}</p>
                <p>- سورة العنكبوت: (آية 46) {وقولوا ءامنّا بالذي أُنزِلَ إلينا وأُنزِلَ إليكم وإلهُنا وإلهُكم واحدٌ ونحنُ له مسلمون}</p>
                <p>- سورة فصّلت: (آية 33) {ومَنْ أحسنُ قولًا ممّنْ دعآ إلى الله وعملَ صالحًا وقال إنّني من المسلمين}</p>
                <p>- سورة الزخرف: (آية 69) {الذين ءامنوا بآياتِنا وكانوا مسلمين}</p>
                <p>- سورة الأحقاف: (آية 15) {وأنْ أعملَ صالحًا ترضاهُ وأصلِحْ لي في ذريّتي إنّي تُبتُ إليك وإنّي من المسلمين}</p>
                <p>- سورة الذاريات: (آية 36) {فمَا وجدْنا فيها غيرَ بيتٍ من المسلمين}</p>
                <p>- سورة القلم: (35) {أفنَجعلُ المسلمينَ كالمجرمين}</p>
                <p>*وقد جاء كلُ الأنبياء بدين واحدٍ هو الإسلام ""*</p>
                <p>*الغلط الشنيع في قول بعض الناس الأديان السماوية الثلاث فإنه لا دينَ صحيح إلا الإسلام وهو الدين السماوي الوحيد*</p>
                <p>*لا دينَ صحيحٌ إلا الإسلامُ*</p>
                <p>*الدينُ الحقُّ عندَ الله الإسلامُ قالَ تعالى:*</p>
                <p>*وَمَن يَبْتَغِ غَيْرَ الإِسْلاَمِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الآخِرَةِ مِنَ الْخَاسِرِينَ (85)﴾*</p>
                <p>[سورة ءال عمران]. وقالَ تَعالى أيضًا:</p>
                <p>*إِنَّ الدِّينَ عِندَ اللهِ الإِسْلاَمُ (19)﴾ [سورة ءال عمران].*</p>
                <p>*فكُلُّ الأنبياءِ مسلمونَ فمن كانَ متَّبعًا لموسى صلى الله عليه وسلم فهو مسلمٌ موسويٌّ،*</p>
                <p>*ومن كانَ متَّبعًا لعيسى صلى الله عليه وسلم فهوَ مسلمٌ عيسويٌّ،*</p>
                <p>*ويَصحُّ أن يُقالَ لمن اتَّبعَ محمدًا صلى الله عليه وسلم مسلمٌ محمديٌّ.*</p>
                <p>*والإسلامُ هو الدّينُ الذي رضيَهُ الله لعبادهِ وأمرَنا باتّباعِهِ.*</p>
                <p>*ولا يُسمَّى الله مسلمًا كما تلفظَ به بعضُ الجهالِ*</p>
                <p>*فقديمًا كان البشرُ جميعُهم على دينٍ واحدٍ هو الإسلامُ. وإنّما حدثَ الشركُ*</p>
                <p>*والكفرُ بالله تعالى بعد النبي إدريس.*</p>
                <p>*فكان نوحٌ أوّلَ نبيٍ أُرسِلَ إلى الكفارِ يدعو إلى عبادةِ الله الواحدِ الذي لا شريكَ له.*</p>
                <p>*وقد حذَّرَ الله جميعَ الرُّسُلِ مِن بعدهِ منَ الشركِ.( اي أممهم )*</p>
                <p>*فقام سيدُنا محمد صلى الله عليه وسلم بتجديدِ الدعوةِ إلى الإسلام بعد أنِ انقطعَ فيما بينَ الناسِ في الأرضِ مؤيَّدًا بالمعجزاتِ الدَّالَّةِ على نبوتِهِ.*</p>
                <p>*فَدَخَلَ البعضُ في الإسلامِ، وجَحَدَ بنبوتِهِ أهلُ الضلالِ الذين منهم مَن كان مشركًا قبلا كفرقةٍ من اليهودِ عَبَدَت عُزيرًا فازدادُوا كفرًا إلى كفرهم.*</p>
                <p>*ءامنَ به بعضُ أهلِ الكتابِ اليهودِ والنصارى كعبدِ الله بن سلامٍ عالم اليهودِ بالمدينةِ، وأصحَمةَ النّجاشيّ ملكِ الحبشةِ وكان نصرانيًّا ثم اتَّبعَ الرسولَ اتباعًا كاملا وماتَ في حياةِ رسولِ الله صلى الله عليه وسلم وصلَّى عليه الرسولُ صلاةَ الغائبِ يومَ ماتَ. أوحى الله إليه بموتِهِ.*</p>
                <p>*ثم كان يُرى على قبرهِ في الليالي نورٌ وهذا دليلٌ أنه صارَ مسلمًا كاملا وليًّا مِن أولياءِ الله رضيَ الله عنه.*</p>
                <p>*والمبدأُ الإسلاميُّ الجامعُ لجميعِ أهلِ الإسلامِ عبادةُ الله وحدَه*</p>`
            },
            {
                id: "s18",
                title: "آية ومعنى (18)",
                icon: "fa-book",
                desc: "قوله تعالى ( إن الله لعن الكافرين وأعد لهم سعيرا خالدين فيها أبدا )",
                content: `<p><strong>قوله تعالى ( إن الله لعن الكافرين وأعد لهم سعيرا خالدين فيها أبدا )</strong> معناه أن من مات كافرا مأواه في الآخرة جهنم خالدا فيها أبدا ولا ينقطع عنه العذاب في الآخرة إلى ما لا نهاية له وما هو بخارج من النار لأن النار باقية لا تفنى.</p>
                <p>لا يجوز الترحم على من مات على الكفر</p>
                <p>الدليل من القرءان والحديث على أن الله لا يغفر لمن مات كافرا</p>
                <p>قال الله تعالى: {إِنَّ الله لاَ يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَلِكَ لِمَن يَشَاء}</p>
                <p>وقال تعالى: {إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَن سَبِيلِ الله ثُمَّ مَاتُوا وَهُمْ كُفَّارٌ فَلَن يَغْفِرَ اللهُ لَهُمْ}</p>
                <p>وقال تعالى: {إِنَّ الَّذِينَ كَفَرُواْ وَظَلَمُواْ لَمْ يَكُنِ الله لِيَغْفِرَ لَهُمْ وَلاَ لِيَهْدِيَهُمْ طَرِيقًا {168} إِلا طَرِيقَ جَهَنَّمَ خَالِدِينَ فِيهَا أَبَدًا}</p>
                <p>وروى ابن حبان أن رسول الله صلى الله عليه وسلم قال: "إن الله ليغفر لعبده ما لم يقع الحجاب قالوا: وما وقوع الحجاب يا رسول الله؟ قال: أن تموت النفس وهي مشركة".</p>
                <p>فلا يجوز الدعاء بالمغفرة أو الترحمُ على كافر مات ولا يجوز أن يقال عنه شهيد</p>
                <p>قال تعالى: { مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ ءامَنُواْ أَن يَسْتَغْفِرُواْ لِلْمُشْرِكِينَ وَلَوْ كَانُواْ أُوْلِي قُرْبَى مِن بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ}</p>
                <p>فالدين ليس مجموعة أراء حتى آخذ ما يعجبني ويوافق هواي الاعتبار يكون بموافقة الشرع.</p>
                <p>والوزن يكون لمن معه الدليل.</p>
                <p>فدر مع الدليل أينما دار.</p>
                <p>فلما ترى أناسا لا يقيمون لدليل الشرع اعتبارا ولا وزنا.</p>
                <p>فاعلم حينها أن غرضه ليس كما يدعي.</p>
                <p>الكافر ما دام حياً فإنه يتقلبُ في رحمة الله</p>
                <p>الهواء العليل الذي يتنفسه في الدنيا والماء العذب الذي يشربه في الدنيا والصحة الجيدة التي يتنعم بها في الدنيا والمال الذي يرزقه الله إياه ويصرِفه لمنفعته والطعام الذي يتغذى به وغيرُ هذا الذي ذكرناه كله رحمة من الله</p>
                <p>لأن الله وَسِعت رحمته في الدنيا الكافر والمؤمن. وَسِعَت رحمة الله في الدنيا الناس جميعا والجنّ جميعا مؤمنهم وكافرهم. ولكن في الآخرة لا ينالها إلا المؤمنون الذين ماتوا على الإسلام. قال الله تعالى : ورحمتي وَسِعَتْ كلّ شيء فسأكتبها للذين يتقون. سورة الأعراف(156)</p>
                <p>معناه : يتقون الكفر. فرحمة الله يوم القيامة لا تكون إلا لمن مات على الإسلام. فالكافر أي غير المسلم محروم منها يوم القيامة</p>
                <p>قال الله تعالى: ونادى أصحابُ النارِ أصحاب الجنةِ أنْ أفيضوا علينا من الماءِ أو ممّا رَزقكم الله، قالوا إنّ الله حَرّمَهُما على الكافرين. سورة الأعراف (50)</p>
                <p>قال الله تعالى: إنّ الله لعنَ الكافرين وأعدّ لهم سعيراً خالدين فيها أبدا لا يجدون وليّا ولا نصيرا .سورة الأحزاب (64-65)</p>
                <p>وقال الله تعالى: ومَنْ لم يؤمن بالله ورسوله فإنا أعتدْنا للكافرين سعيرا .سورة الفتح(13)</p>
                <p>قال الله تعالى: وأمّا الذين فسقوا فمأواهم النار كلما أرادوا أنْ يخرجوا منها أعيدوا فيها وقيلَ لهم ذوقوا عذابَ النار الذي كنتم به تكذبون. سورة السجدة(20)</p>
                <p>معناه لهم عذاب دائم في نكد. لذلك الكفار يوم القيامة بعدما يدخلون جهنم لا تنتهي محاولاتهم للفرار من جهنم، ولكن من دون جدوى. وذلك لأن ملائكة العذاب ترُدّهم. وهذا يدلّ على أنهم في عذاب مستمرّ لا ينتهي</p>
                <p>فالحاصل أنّ الكافر ما دام حَيّا في الدنيا فإنه يتقلب في رحمة الله.</p>
                <p>وأما إذا مات على الكفر فلا يجوز لمنْ عَلِمَ بحاله أنْ يطلب من الله له الرحمة. لأنه يكذب القرءان. ويكذب دين محمّد. ويكذب ما عُلِم من الدين بالضرورة وظهر بين المسلمين وانتشر انشارا لا يُردّ ولا ينفع الجاهل جهله فيما عُلِم من الدين بالضرورة</p>
                <p>دين الله ليس ملعبة، دين الله ليس بالرأي..</p>
                <p>الإيمان هو الأساس، بدون الإيمان لا ينفع الإنسان شىءٌ.</p>
                <p>الرسول أول ما دعا الناس دعاهم إلى الإيمان.</p>
                <p>لما عائشة رضي الله عنها سألت الرسول صلى الله عليه وسلم عن قريب لها يسمى عبد الله بن جدعان، هذا كان رزقه الله رزقًا كثيرًا، كان في الجاهلية قبل بعثة الرسول صلى الله عليه وسلم؛ كان شديد الكرم يوزع الطعام ويضع الطعام في طريق المسافرين ويصل رحمه ويكرم الضيف، فقالت عائشة رضي الله عنها للرسول صلى الله عليه وسلم: إن ابن عمي عبد الله بن جدعان كان يقري الضيف ويصل الرحم ويفعل ويفعل (أي من الإحسانات)، قالت: يا رسول الله، هل ينفعه ذلك؟</p>
                <p>قال: لا لأنه لم يقل يومًا رب اغفر لي خطيئتي يوم الدين.</p>
                <p>معناه لم يكن مسلمًا لم يكن يؤمن بيوم الدين، هو من أهل الفترة قبل البعثة، لكن لا يكتب له حسنات مع أنه قبل بعثة الرسول..</p>
                <p>قال الرسول صلى الله عليه وسلم:</p>
                <p>*"وأما الكافر فيطعم بحسناته في الدنيا حتى إذا أفضى إلى الآخرة لم يكن له منها نصيب"*</p>
                <p>الله لا يرحمه في الآخرة، لا يُدخله الجنة، فلا يجوز الترحم على كافر مات.</p>
                <p>الرسول صلى الله عليه وسلم كان معه سيدنا عمر فقال لعمر:</p>
                <p>*"يا ابن الخطاب نادِ أنه لا يدخل الجنة إلا نفسٌ مؤمنة"*</p>
                <p>ولا يكون شهيدا إلا من شهد بأن لا إله إلا الله محمد رسول الله. ولا يجوز الدعاء بالرحمة والمغفرة والجنة لمن مات على غير دين الإسلام، ولا يجوز الصلاة عليه أيضا.</p>
                <p>هذا من ثوابت العقيدة وأصول الدين.</p>
                <p>قال تعالى في سورة آل عمران آية ٨٥:</p>
                <p>"وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ". صدق الله العظيم</p>
                <p>وقال رسول الله صلى الله عليه وسلم في الحديث الذي رواه الإمام مسلم في صحيحه عن أبي هريرة رضي الله عنه: "والذي نفْسُ محمدٍ بيدِهِ ، لا يسمعُ بي أحدٌ من هذه الأمةِ ، لا يهودِيٌّ ، و لا نصرانِيٌّ ، ثُمَّ يموتُ ولم يؤمِنْ بالذي أُرْسِلْتُ به ، إلَّا كان من أصحابِ النارِ". صدق رسول الله صلى الله عليه وسلم.</p>
                <p>لكن للأسف الميزان اختلّ في هذا الزّمان العجيب الذي نحن فيه، ولو كنتَ وحدك اتبع الحقّ والدّليل ولا تكن من جملة القطيع الذي يُساق إلى الذبح وهو لا يدري.</p>
                <p>والأمر كما أسلفت يحتاج إلى إنصاف وإلى معرفة ودراية بما يُتنازع فيه، فليس للجاهل أن يكون حَكَما في مسائل شرعيّة بل عليه أن يتعلّم ويتّبع الدّليل الواضح القاطع الذي لا لُبس فيه، ولا يحاجج عن غيره بهوى نفس قد يؤدّي به إلى الغوص في الفساد أكثر فأكثر.</p>
                <p>لو نظرت بعد كلمة... أكثرهم ...فى القرآن تجد..</p>
                <p>لا يؤمنون</p>
                <p>لا يعقلون</p>
                <p>لا يفقهون</p>
                <p>لا يعلمون</p>
                <p>لا يعملون</p>
                <p>فلا يهمك كثرة الهالكين وقلة سالكين طريق الحق..</p>
                <p>الجنة لا يدخلها إلا مسلم موحد و لا يقال عن غير المسلم حقا شهيد ولا يجوز الترحم على غيره ومن يكذب يكون عاند القران والدين وكذب الله والرسول وموعده جهنم إن مات على ذلك.</p>
                <p>قول الحق لا يقدم أجلا و لا يمنع رزقا..</p>
                <p>الحمد لله الذي لم يجعلنا من أهل الدنيا السفهاء اللهم حسن الختام.</p>
                <p>وقد نصحناك حامدينَ اللهَ أنْ وفَّقنا إلى ذلك فهنيئًا للرَّاكبين في سفينة النَّجاة واللهُ المُستعان هو نِعمَ المولى ونِعم الوكيل.</p>`
            },
            {
                id: "s19",
                title: "آية ومعنى (19)",
                icon: "fa-book",
                desc: "قوله تعالى ( اليوم ننساكم كما نسيتم لقاء يومكم هذا )",
                content: `<p><strong>قوله تعالى ( اليوم ننساكم كما نسيتم لقاء يومكم هذا )</strong> معناه تركناكم من رحمتنا كما أنتم تركتم طاعة الله في الدنيا بترك الإيمان، وليس معناه أن الله يوصف بالنسيان المعروف لأن هذا فيه تشبيه الله بخلقه.</p>
                <p>الله تعالى منزَّهٌ عن النسيان المعروف لأنه لا يشبه شيئًا من مخلوقاته، أما ما ورد من إضافة المكر والنسيان لله تعالى في القرءان الكريم، فهذا من باب المقابلة وهو جائزٌ كقوله تعالى: {وَمَكَرُوا وَمَكَرَ اللَّهُ} وقوله تعالى: {نَسُوا اللَّهَ فَنَسِيَهُمْ} أي تركهم من رحمته، وأما قوله تعالى: {وَقِيلَ اليَومَ نَنْسَاكُمْ كَمَا نَسِيتُمْ لِقَاءَ يَوْمِكُمْ هَذَا}، فقد ذُكرَ على وجهِ المقابلة، ومعناه تركناكم من رحمتنا كما أنتم تركتُم طاعةَ الله في الدنيا بترك الإيمان به. وليس معناه أنه يوصف بالنسيان المعروف لأن هذا تشبيه لله بخلقه وهو تكذيب للقرءان، أما مَن استحلَّ قولَ «يا ماكرُ ارزقني» ونحو ذلك فهذا يكفرُ، وكذا يكفُرُ من يُسمّي الله المضلَّ لأنه جَعَلَهُ اسمًا لله كالرحمـن فيكونُ معنى كلامِهِ يجوزُ أن نقولَ يا مضلُّ أعِنّي أو أن يُسمي الشخص ولدَه «عبد المضل».</p>
                <p>أما قولُ «يا الله يا جبَّارُ ارزقني» أو «يا الله يا متكبّرُ» فلا يدلُّ على النقص في حقّ الله، أما الذي يدلُّ على النقص فهو مثل أن يقال في حقّ الله «يا مخادعُ» أو «يا ناسي» أو «يا مستهزىء» أو «يا ماكرُ».</p>
                <p>فلا يجوز تسمية الله بغير ما ورد في القرءان أو السنة الصحيحة أو الإجماع فقد قال الإمام أبو الحسن الأشعري: «لا يجوز تسمية الله إلا بما ورد في الكتاب والسنة الصحيحة أو الإجماع» نقله عنه الإمام ابن فُورك في كتابه «مجرد مقالات أبي الحسن الأشعري»، وهذا هو المعتمد، وقال الإمام أبو منصور البغدادي في كتابه «تفسير الأسماء والصفات»: «لا مجال للقياس في أسماء الله وإنما يُراعى فيها الشرعُ والتوقيفُ» اهـ. أي بحسب ما ورد في الشرع.</p>`
            },
            {

                content: `<p><strong>قوله تعالى ( إن الله لا يستحي أن يضرب مثلا ما بعوضة فما فوقها )</strong> معناه أن الله لا يحب ترك إظهار الحق فلا يتركه للاستحياء كما يفعل الخلق وليس معناه وصف الله بالاستحياء المعروف للخلق فهذا مستحيل على الله.</p>
                <p>معنى الله حيي ستير</p>
                <p>260_ قال شيخنا رحمه الله ونفعنا به وأمدنا بأمداده</p>
                <p>وَرَد في الحَديث:"إنّ اللهَ حَيِيٌّ ستير"رواه أحمد وأبو داود والنسائي والبيهقي. الحيَاءُ إذَا أُضِيفَ إلى اللهِ عندَ الماتُريديّة صِفَةٌ أزَليّةٌ أمّا عندَ الأشَاعِرَة صِفَةٌ تَرجِعُ إلى إحْدَى الصّفَاتِ السَّبعَة.</p>
                <p>ولا يجوزُ أن يُؤخَذَ من قولِ الله تعالى: {إِنَّ اللَّهَ لاَ يَسْتَحْيِي أَنْ يَضْرِبَ مَثَلاً مَا بَعُوضَةً ... *} الآية [سورة البقرة] جوازُ تسميةِ الله بالمستحيى، ومعنى الآية أننا لا نترك استحياءً كما يتركُ البشرُ الشىءَ استحياءً، معناه أنَّ الله لا يُحِبُّ تركَ إظهارِ الحَقّ فلا يتركُهُ للاستحياءِ كما يَفعَلُ الخلقُ، فهذا مستحيلٌ على الله.</p>
                <p>وكذلكَ لا يجوزُ أن يُستَخرَجَ اسمُ المستحي لله من الحديثِ الذي رواه الترمذي: «إنَّ الله حييٌّ كريمٌ يَستحي إذا رَفَعَ الرجلُ إليه يديهِ أن يَردّهما صِفرًا خائبتين» معناه لا يُخَيّبُ، إما أن يعطيَهُ الثَّوابَ أو يعطيَهُ ما طَلَبَ، ومعنى: «رَفَعَهُمَا إليه» أي إلى جِهَةِ مَهبِطِ الرّحمةِ وهي السماءُ.</p>
                <p>(قالَ السّندِيُّ في حَاشِيَتِه على ابنِ مَاجَه حَيِيٌّ بِكَسْرِ الْيَاء الْأُولَى وَتَشْدِيد الثَّانِيَة فَعِيل مِنْ الْحَيَاء أَيْ لَا يَتْرُك الْعَطَاء كَصَاحِبِ الْحَيَاء يَمْنَعهُ مِنْ تَرْك الْعَطَاء (قال ابن الأثير في النّهايَة [ إنّ اللّهَ حَيِىٌّ سَتِيرٌ يحِبُّ الحَياءَ والسَّتْر ] سَتِيرٌ : فَعِيلٌ بمعنى فَاعِل : أي من شَأنه وإرادتَهِ حُبُّ السَّتر والصَّون)</p>`
            },
            {
                id: "s21",
                title: "آية ومعنى (21)",
                icon: "fa-book",
                desc: "قوله تعالى ( ويبقى وجه ربك ذو الجلال والإكرام )",
                content: `<p><strong>قوله تعالى ( ويبقى وجه ربك ذو الجلال والإكرام )</strong> معناه يبقى ذات الله تعالى الذي ليس جسما ، فوجه الله هنا معناه ذاته الذي لا يشبه الذوات والله تعالى باق لا نهاية لوجوده.</p>
                <p>مَا مَعْنَى الْوَجْهِ إِذَا أُضِيفَ إِلَى اللَّهِ فِى الْقُرْءَانِ وَالْحَدِيثِ.</p>
                <p>اعْلَمْ أَنَّ الْوَجْهَ فِى لُغَةِ الْعَرَبِ لَهُ مَعَانٍ كَثِيرَةٌ فَهُوَ يَأْتِى بِمَعْنَى الْجُزْءِ الْمُرَكَّبِ عَلَى الْبَدَنِ وَيَأْتِى بِمَعْنَى قَصْدِ التَّقَرُّبِ إِلَى اللَّهِ كَقَوْلِ الْقَائِلِ فَعَلْتُ كَذَا وَكَذَا لِوَجْهِ اللَّهِ أَىْ عَمِلْتُ كَذَا وَكَذَا تَقَرُّبًا إِلَى اللَّهِ وَامْتِثَالًا لِأَمْرِ اللَّهِ وَيَأْتِى بِمَعْنَى الذَّاتِ كَمَا فِى قَوْلِهِ تَعَالَى ﴿كُلُّ مَنْ عَلَيْهَا فَانٍ وَيَبْقَى وَجْهُ رَبِّكَ ذُو الْجَلالِ وَالإِكْرَامِ﴾. ﴿كُلُّ مَنْ عَلَيْهَا فَانٍ﴾ أَىْ أَنَّ كُلَّ مَنْ عَلَى وَجْهِ الأَرْضِ يَفْنَى وَفَنَاءُ الْبَشَرِ وَالْجِنِّ مَعْنَاهُ مُفَارَقَةُ أَرْوَاحِهِمْ لِأَجْسَادِهِمْ، وَ﴿وَيَبْقَى وَجْهُ رَبِّكَ﴾ أَىْ ذَاتُ رَبِّكَ أَىْ يَبْقَى اللَّهُ، وَ﴿ذُو الْجَلالِ وَالإِكْرَامِ﴾ مَعْنَاهُ أَنَّ اللَّهَ يَسْتَحِقُّ أَنْ يُجَلَّ فَلا يُجْحَدَ وَلا يُكْفَرَ بِهِ أَىْ أَنَّهُ يَسْتَحِقُّ مِنَّا أَنْ نُعَظِّمَهُ وَلا يَجُوزُ لَنَا أَنْ نُنْكِرَ وُجُودَهُ أَوْ أَنْ نَكْفُرَ بِهِ وَهُوَ الْمُكْرِمُ أَهْلَ وِلايَتِهِ بِالْفَوْزِ وَالنُّورِ التَّامِّ يَوْمَ الْقِيَامَةِ. وَيَأْتِى الْوَجْهُ بِمَعْنَى الْمُلْكِ كَمَا فِى قَوْلِهِ تَعَالَى ﴿كُلُّ شَىْءٍ هَالِكٌ إِلَّا وَجْهَهُ﴾ قَالَ الْبُخَارِىُّ أَىْ إِلَّا مُلْكَهُ وَمُلْكُ اللَّهِ أَىْ سُلْطَانُهُ صِفَةٌ مِنْ صِفَاتِهِ الأَزَلِيَّةِ فَاللَّهُ تَعَالَى لَهُ سُلْطَانٌ عَلَى هَذَا الْعَالَمِ وَسُلْطَانُهُ لا يَفْنَى وَقِيلَ إِلَّا وَجْهَهُ أَىِ الأَعْمَالُ الصَّالِحَةُ فَإِنَّهَا تَبْقَى. وَيَأْتِى الْوَجْهُ بِمَعْنَى الْقِبْلَةِ كَمَا فِى قَوْلِهِ تَعَالَى ﴿فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ﴾ أَىْ فَثَمَّ قِبْلَةُ اللَّهِ، جَاءَ هَذَا التَّفْسِيرُ عَنْ مُجَاهِدٍ تِلْمِيذِ ابْنِ عَبَّاسٍ فَإِنَّهُ فَسَّرَ الْوَجْهَ بِالْقِبْلَةِ أَىْ لِصَلاةِ النَّفْلِ فِى السَّفَرِ عَلَى الرَّاحِلَةِ أَىِ الدَّابَّةِ. وَيَأْتِى الْوَجْهُ بِمَعْنَى الطَّاعَةِ كَمَا فِى حَدِيثِ ابْنِ حِبَّانَ الْمَرْأَةُ عَوْرَةٌ (أَىْ أَغْلَبُ بَدَنِهَا عَوْرَةٌ) فَإِذَا خَرَجَتِ اسْتَشْرَفَهَا الشَّيْطَانُ (أَىِ اهْتَمَّ بِهَا لِيَفْتِنَ بِهَا غَيْرَهَا) وَأَقْرَبُ مَا تَكُونُ الْمَرْأَةُ إِلَى وَجْهِ اللَّهِ (أَىْ إِلَى طَاعَةِ اللَّهِ) إِذَا كَانَتْ فِى قَعْرِ بَيْتِهَا. أَمَّا مَنْ يَعْتَقِدُ أَنَّ الْوَجْهَ إِذَا أُضِيفَ إِلَى اللَّهِ فِى الْقُرْءَانِ أَوِ الْحَدِيثِ مَعْنَاهُ الْجُزْءُ الَّذِى هُوَ مُركَّبٌ عَلَى الْبَدَنِ فَهُوَ لَمْ يَعْرِفْ رَبَّهُ لِأَنَّ هَذِهِ هَيْئَةُ الإِنْسَانِ وَالْمَلائِكَةِ وَالْجِنِّ وَالْبَهَائِمِ فَكَيْفَ يَكُونُ خَالِقُ الْعَالَمِ مِثْلَهُمْ.</p>`
            },
            {
                id: "s22",
                title: "آية ومعنى (22)",
                icon: "fa-book",
                desc: "قوله تعالى حكاية عن الملائكة ( قالوا أتجعل فيها من يفسد فيها ويسفك الدماء )",
                content: `<p><strong>قوله تعالى حكاية عن الملائكة ( قالوا أتجعل فيها من يفسد فيها ويسفك الدماء )</strong> فالملائكة قالوا هذا للاستعلام عن الحكمة وليس اعتراضا على الله، وهم علموا ذلك لأنهم اطّلعوا عليه في اللوح المحفوظ.</p>
                <p>• المَلَائِكَةِ لَا يَعْصُونَ اللَّهَ •</p>
                <p>📖 الآية</p>
                <p>قَالَ اللهُ تَعَالَى حِكَايَةً عَنِ المَلَائِكَةِ: ﴿قَالُوا أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ﴾ [سورة البقرة].</p>
                <p>💡المعنى</p>
                <p>قَالَ ابنُ الجَوزِيِّ فِي تَفسِيرِهِ «زَادِ المَسِيرِ»: «المَلَائِكَةُ قَالُوهُ لِاستِعلَامِ وَجهِ الحِكمَةِ لَا عَلى وَجهِ الاعتِرَاضِ» اهـ.</p>
                <p>فَمَن يَقُولُ إِنَّ المَلائِكَة اعتَرَضُوا عَلَى اللهِ تَعَالى يَكُونُ كَذَّبَ القُرءَانَ، لِأَنَّ اللهَ سُبحَانَهُ قَالَ فِي القُرءَانِ الكَرِيمِ: ﴿لَا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾ [سورة التحريم] ، فَالآيةُ صَرِيحَةٌ فِي طَاعَتِهِم لِرَبِّهِم وَتَنفِيذِهِم لِأَوَامِرِهِ.</p>
                <p>وَأَمَّا قَولُ المَلَائِكَةِ: ﴿أَتَجْعَلُ فِيهَا مَنْ يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ﴾، فَهُم عَلِمُوا ذَلِكَ لِأَنَّهُم اطَّلَعُوا عَلَيهِ فِي اللَّوحِ المَحفُوظِ.</p>`
            },
            {
                id: "s23",
                title: "آية ومعنى (23)",
                icon: "fa-book",
                desc: "قوله تعالى ( ولن تستطيعوا أن تعدلوا بين النساء ولو حرصتم )",
                content: `<p><strong>قوله تعالى ( ولن تستطيعوا أن تعدلوا بين النساء ولو حرصتم )</strong> معناه لن تستطيعوا أن تسووا بين الزوجات في المحبة القلبية وليس معناه أن الرجل لا يستطيع أن يعدل بين نساءه في النفقة والمبيت.</p>
                <p>معنى قول الله تعالى {وَلَنْ تَسْتَطِيعُوا أَنْ تَعْدِلُوا بَيْنَ النِّسَاءِ وَلَوْ حَرَصْتُمْ}: بإجماع المفسرين أي مَن كان متزوجًا أكثر من امرأة لا يستطيع أن يسوي بينهن في المحبة القلبية والاستمتاع بالجماع وما دونه، وليس معناه أن الرجل لا يستطيع أن يعدل في النفقة والمبيت بين نسائه، وقد كان رسول الله صلى الله عليه وسلم يعدل بين نسائه في النفقة والمبيت وكذلك سائر الصالحين. كما قال الحافظ ابن الجوزي الحنبلي في تفسيره «زاد المسير» (ج2/ص219) ما نصه: «قال أهل التفسير: لن تطيقوا أن تسوّوا بينهن في المحبة التي هي ميل الطباع لأن ذلك ليس من كسبكم (ولو حرصتم) على ذلك».اهـ ومثله قال القاضي أبو السعود محمد بن محمد بن مصطفى العمادي الحنفي في تفسيره (ج2/ص438 -- 439)، والمفسر الفقيه ابن عطية الأندلسي في تفسيره «المحرر الوجيز في تفسير الكتاب العزيز» (ج2/ص120). وقال أبو بكر ابن عربي في «شرح الترمذي» (5/80) ما نصه: «والمعنى فيه تعلق القلب ببعضهن أكثر منه إلى بعض، فعذرهم في ما يكنون».اهـ</p>`
            },
            {
                id: "s24",
                title: "آية ومعنى (24)",
                icon: "fa-book",
                desc: "قوله تعالى ( اليوم أكملت لكم دينكم ) سورة النساء/٣",
                content: `<p><strong>قوله تعالى ( اليوم أكملت لكم دينكم ) سورة النساء/٣</strong> معناها أنه كَمُلَ معظم الدين كما ذكر ابن حجر في الفتح، وليس معناها أنه لا يجوز للمجتهدين من أمة محمد صلى الله عليه وسلم أن يُحدِثوا ما يوافق الشرع كعمل المولد النبوي مثلا.</p>
                <p>• معنى الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ</p>
                <p>قَالَ اللهُ تَعَالَى ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾ [سورة النساء]</p>
                <p>هَذِهِ الآيَةُ مَعنَاهَا أَنَّهُ كَمُلَ مُعظَمُ الدِّينِ، كَمَا ذَكَر ذَلِكَ البَغَوِيُّ، وَالخَازِنُ، وابنُ حَجَرٍ العَسقَلَانِيُّ وَغَيرُهُم.</p>
                <p>وَليسَ مَعنَاهَا أَنَّهُ لَا يَجُوزُ لِلمُجتَهِدِينَ مِن أُمَّةِ مُحَمَّدٍ ﷺ أَن يُحدِثُوا مَا يُوَافِقُ الشَّرعَ كَعَمَلِ المَولِدِ النَّبَوِيِّ الشَّرِيفِ مَثَلًا.</p>
                <p>قَالَ القُرطُبِيُّ: وَقَالَ الجُمهُورُ: المُرَادُ مُعظَمُ الفَرَائِضِ وَالتَّحلِيلِ وَالتَّحرِيمِ، قَالُوا: وَقَد نَزَلَ بَعدَ ذَلِكَ قُرءَانٌ كَثِيرٌ، وَنَزَلَت آيَةُ الرِّبَا، وَنَزَلَت آيَةُ الكَلَالَةِ إِلَى غَيرِ ذَلِكَ، وَإِنَّمَا كَمُلَ مُعظَمُ الدِّينِ وَأمرِ الحَجِّ اهـ.</p>`
            },
            {
                id: "s25",
                title: "آية ومعنى (25)",
                icon: "fa-book",
                desc: "قوله تعالى ( قد جاءكم من الله نور وكتاب مبين ) سورة المائدة/١٥",
                content: `<p><strong>قوله تعالى ( قد جاءكم من الله نور وكتاب مبين ) سورة المائدة/١٥</strong> معنى النور في الآية أي القرءان وسمّي نورا لكشف ظلمات الشرك أو لأنه ظاهر الإعجاز ، وليس معناها أن النبي محمدا خُلِق من نور.</p>
                <p>قال الله تعالى: {قَدْ جَاءَكُمْ مِنَ اللَّهِ نُورٌ وَكِتَابٌ مُبِينٌ } [سورة المائدة]</p>
                <p>قال المفسر اللغوي النحوي أبو حيان الأندلسي : «هو القرآن؛ سماه نورا لكشف ظلمات الشرك والشك، أو لأنه ظاهر الإعجاز».اهـ قال القرطبي : «قد جاءكم من الله نور أي: ضياء؛ قيل: الإسلام».اهـ فليُحذَر من قول بعض الجهلة أن النبي محمدًا صلى الله عليه وسلم خُلِقَ من نور محتجين بهذه الآية {قَدْ جَاءَكُمْ مِنَ اللَّهِ نُورٌ وَكِتَابٌ مُبِينٌ } ، وقد قدّمنا معنى هذه الآية كما فسرها علماء التفسير ، وليس فيهم عالم معتبر فسّرها بأن جسد النبي خلق من نور، أو أن النبي حقيقة هو نور بمعنى الضوء.</p>`
            },

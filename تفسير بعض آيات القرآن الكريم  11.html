                desc: "قوله تعالى ( تعلمُ ما في نفسي ولا أعلمُ ما في نفسِك ) سورة المائدة/١١٦",
                content: `<p><strong>قوله تعالى ( تعلمُ ما في نفسي ولا أعلمُ ما في نفسِك ) سورة المائدة/١١٦</strong> معناه تعلمُ يا الله ما في سرّي ولا أعلم ما في غَيبِكَ، وليس المعنى أن الله له نَفْس بمعنى الروح، بل الله هو خالق الروح.</p>
                <p>وَرَدَ في القُرءانِ إضَافَةُ النّفْسِ إلى الله لا بمَعنى الرُّوْح بل بمَعنًى ءاخَر ﴿تَعْلَمُ مَا فِي نَفْسِي وَلا أَعْلَمُ مَا فِي نَفْسِكَ﴾ هَذا وَرَدَ أنّ عِيسَى يَقُولُه يَومَ القِيامَةِ لما يسأل ﴿أَأَنْتَ قُلْتَ لِلنَّاسِ اتَّخِذُونِي وَأُمِّيَ إِلَهَيْنِ﴾ مُتَبَرّأ مِن ذَلكَ وقَال ﴿تَعْلَمُ مَا فِي نَفْسِي وَلا أَعْلَمُ مَا فِي نَفْسِكَ﴾ معنَاهُ أنتَ عَلِمتَه أمّا أنَا لم أعلَمْه، بَعضُ العُلَماءِ قَالوا النّفسُ هُنا مَعنَاها العِلم، ﴿ولا أَعلَمُ مَا في نَفسِكَ﴾ أي مَا في عِلمِكَ. ﴿تَعْلَمُ مَا فِى نَفْسِى﴾ [المائدة: 116] ذاتي ﴿وَلا أَعْلَمُ مَا فِى نَفْسِكَ﴾ ذَاتِكَ. فنَفسُ الشّىءِ ذاتُه وهُوِيَّتُه والمعنى: تَعلَمُ مَعلُومِي ولا أَعْلَمُ مَعلُومَكَ. اهـ (قال ابن الجوزي في تفسيره قولُه تَعالى: ﴿تَعلَمُ مَا في نَفسِي ولا أَعْلَمُ مَا في نَفسِكَ﴾ قالَ الزّجّاج تَعلَمُ مَا أُضمِرُه ولا أَعْلَمُ مَا عِندَكَ عِلمُه، والتّأويلُ تَعلَمُ مَا أَعلَمُ وأنَا لا أَعلَمُ مَا تَعلَم).</p>`
            },
            {
                id: "s27",
                title: "آية ومعنى (27)",
                icon: "fa-book",
                desc: "قوله تعالى ( لقد خلقنا الإنسان في أحسن تقويم ) سورة التين/٤",
                content: `<p><strong>قوله تعالى ( لقد خلقنا الإنسان في أحسن تقويم ) سورة التين/٤</strong> معناه أن الله خلق الإنسان في أحسن صورة، وهذا يدل على بطلان قول الملاحدة إن أصل الإنسان قرد والعياذ بالله، فأول البشر هو ءادم عليه السلام وكان جميلا.</p>
                <p>بيان أنّ الإنسان خلق في أحسن تقويم وأنّ آدم جميل الشكل</p>
                <p>، فقد قال الله تبارك وتعالى: {وَالتِّينِ وَالزَّيْتُونِ وَطُورِ سِينِينَ وَهَذَا الْبَلَدِ الْأَمِينِ لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ} الله تعالى أقسم بهذه الأشياء التين والزيتون لعظم منافعهما من منافعهما ما نعرف وما لا نعرف لكن علينا أن نعتقد أنّ لهما شأنا عظيما وذكر طور سينين وهو الجبل الذي سمع موسى كلام الله وهو هناك وهذا البلد الأمين أي مكة، الله تعالى أقسم بهؤلاء الأربعة لقد خلقنا الإنسان في أحسن تقويم: معناه أنّ الله يقسم يحلف بأنه خلق الإنسان في أحسن تقويم فيجب اعتقاد ذلك لأنّه ذكر ذلك في القرءان الكريم.</p>
                <p>أوّل ما خلق الله تعالى من البشر ءادم عليه السلام فقبل ءادم لم يكن إنسان، قال تعالى في سورة النساء: {يَا أَيُّهَا النَّاسُ اتَّقُواْ رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ وَخَلَقَ مِنْهَازَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالاً كَثِيراً وَنِسَاء}.</p>
                <p>فسّر العلماء هذه النفس الواحدة بآدم عليه السلام وذكروا ذلك في تفاسيرهم (كتفسير زاد المسير والبحر المحيط وتفسير النسفي والطبري) وقالوا بأنّ المعنى وبثّ منهما رجالا كثيرا ونساء أي أنّ الله تعالى من ءادم وحواء بثّ بقية البشر فقبل آدم لم يكن بشر كما ذكر أبو حيان في تفسيره فمن قال كان قبل آدم مائة ألف آدم فقد كذب بدليل أنّ سيدنا محمدا أخبر في الحديث الصحيح الذي رواه مسلم "أنّ الناس يوم القيامة يذهبون إلى آدم فيقولون يا آدم أنت أبو البشر" فلو كان هناك آدم غير آدم هذا لكان الرسول قال يذهبون إلى آدم الأول ثمّ إلى آدم الثاني ثم الثالث وهكذا إنما قال: "يذهبون إلى آدم فيقولون يا آدم أنت أبو البشر خلقك الله بيده وأسجد لك ملائكته وعلمك أسماء كل شىء فاشفع لنا إلى ربنا" فآدم عليه السلام من كرامته على الله علّمه أسماء كل شىء بدون دراسة على أحد قال تعالى: {وَعَلَّمَ آدَمَ الأَسْمَاء كُلَّهَا} ومن جملة مزاياه أنّ الله أمر الملائكة أن يسجدوا له تحية وإكراما لأنه خلق في الجنة أما تربته التي خلق منها أخذت من الأرض من أبيضها وأسودها وما بين ذلك وسهلها وحزنها وما بين ذلك فجاء بنوا آدم على قدر الأرض فيهم من هو أبيض ومن هو أسود ومن هو بين الأبيض والأسود وفيهم من هو دمث الأخلاق سهل قريب ومن هو جاف غليظ الطبع شرس الأخلاق لأنّ الأرض هكذا ليست على صفة واحدة.</p>
                <p>وأما إسجاد الملائكة له ليعلمهم أنّ هذا الخلق الذي خلق الآن هو أفضل منهم مع أنّ الملائكة لا يعصون الله ما أمرهم ويفعلون ما يؤمرون، يسبحون الليل والنهار لا يفترون ليسوا مثلنا لا يشغلهم نوم ولا جوع ولا عطش ما خلق الله فيهم داعية الأكل ولا داعية الشرب ولا داعية النوم ومع ذلك أمرهم بالسجود لآدم فسجدوا كلهم، أما إبليس وهو جني مخلوق من نار أبى أن يسجد لآدم اعترض على الله حتى قال كيف تأمرني أن أسجد لهذا الذي خلقته من طين وأنا خلقتني من نار، يعني النار أشرف من الطين فكيف أوْمر لهذا بأن أسجد لهذا الذي خلق من طين فكفر بعد أن كان مسلما واسمه عزازيل فسمّي إبليس من أبلس أي المطرود من الخير فآدم عليه السلام كان سويّ الخلقة طوله ستون ذراعا وعرضه سبعة أذرع وعلى مناسبة هذا الطول والعرض عيناه ويداه ورجلاه وفمه وأنفه .</p>
                <p>كان من أجمل خلق الله كان طويل الشعر لم يكن محدودب الظهر لم يكن قصير القامة. الرسول صلى الله عليه وسلم قال عنه في الحديث الذي رواه البخاريّ وغيره:"إنّ أهل الجنّة على صورة أبيهم آدم ستون ذراعا في السماء في سبعة أذرع عرضا".</p>
                <p>كما أنه كان جميل الصوت قال عليه الصلاة والسلام "ما بعث الله نبيا إلا حسن الوجه حسن الصوت وإنّ نبيكم أحسنهم وجها وأحسنهم صوتا" فالأنبياء كلهم جميلي الخلقة ليس فيهم دميم الوجه ولا قبيح الصوت وقد صحّ عن رسول الله أنه قال: "إذا سلمتم عليّ فسلموا على أنبياء الله فإنهم بعثوا كما بعثت".</p>
                <p>فمن انتقص آدم أو استهزأ به في جد أو مزح فقد خرج من الإسلام كالذي ينتقص نبينا محمد أو إبراهيم أو موسى أو عيسى أو يونس بن متى أو غيرهم من الأنبياء فيجب أن لا يصدق على أي نبي أيّ خبر فيه طعن في واحد منهم صريح أو غير صريح.</p>`
            },
            {
                id: "s28",
                title: "آية ومعنى (28)",
                icon: "fa-book",
                desc: "قوله تعالى ( ولقد همّتْ به وهمّ بها لولا أن رءا برهان ربه ) سورة يوسف/٢٤",
                content: `<p><strong>قوله تعالى ( ولقد همّتْ به وهمّ بها لولا أن رءا برهان ربه ) سورة يوسف/٢٤</strong> من معاني هذه الآية أن امرأة العزيز همّت بأن تدفع يوسف عليه السلام ليزني بها وهمّ يوسف بدفعها ليخلص منها، فيوسف ما همّ بالزنى ولا فعل الزنى.</p>
                <p>قوله تعالى: {وَلَقَدْ هَمَّتْ بِهِ وَهَمَّ بِهَا لَوْلَا أَنْ رَأَى بُرْهَانَ رَبِّهِ} [سورة يوسف] فقد قيل فيه نحو خمس تأويلات وأحسنُ ما قيل في ذلك أن يقال قوله تعالى: {وَهَمَّ بِهَا} مربوط بما بعده أي بقوله (لولا أن رأى برهان ربه) فيكون على هذا التفسير ما همَّ يوسف بالمرة لأنه رأى البرهان، فلولا حرف امتناع لوجود أي امتنع الهم منه عليه السلام لوجود البرهان أما لو لم ير البرهان لهم، والبرهان هو العصمة أي أنه أُلهِمَ أن الأنبياء معصومون عن مثل هذا الشىء وأنه سيؤتى النبوة فلم يهمّ. هذا أحسنُ ما قيل في تفسير هذه الآية. وقال بعض علماء المغاربة معنى {وَلَقَدْ هَمَّتْ بِهِ} أي همت بأن تدفعه ليزني بها وهمَّ بها أي هَمَّ يوسف عليه السلام بدفعها من الأمام ليخلص منها لولا أن رأى البرهان أنك بدفعها من الأمام ستكون الحجة لها عليك فأعطاها ظهره فكان الدفع من الخلف وكانت الحجة له عليها، والخلاصَةُ أنّ الأنبياءَ لا يقعونَ في الزّنى ولا يهمّونَ به..</p>`
            },
            {
                id: "s29",
                title: "آية ومعنى (29)",
                icon: "fa-book",
                desc: "قوله تعالى ( الآن خفف الله عنكم وعلِم أن فيكم ضعفا ) سورة الأنفال/٦٦",
                content: `<p><strong>قوله تعالى ( الآن خفف الله عنكم وعلِم أن فيكم ضعفا ) سورة الأنفال/٦٦</strong> فقوله تعالى ( وعلِم ) ليس راجعا لقوله تعالى ( الآن ) بل المعنى أنه تعالى خفَّفَ عنكم الآن لأنه علِم بعلمه السابق في الأزل أنه يكون فيكم ضعف.</p>
                <p>الله يَعْلَمُ كُلَّ شَىْءٍ بِعِلْمِهِ الأَزَلِيِّ وَلا يَتَجَدَّدُ لَهُ عِلْمٌ لِأَنَّ عِلْمَهُ عِلْمٌ وَاحِدٌ شَامِلٌ لِكُلِّ الْمَعْلُومَاتِ يَعْلَمُ بِهِ سُبْحَانَهُ ذَاتَهُ وَصِفَاتِهِ وَمَا يُحْدِثُهُ مِنْ مَخْلُوقَاتِهِ يَعْلَمُ مَا كَانَ وَمَا يَكُونُ وَمَا لا يَكُونُ أَنْ لَوْ كَانَ كَيْفَ يَكُونُ قَالَ اللَّهُ تَعَالَى ﴿وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًا﴾سُورَةَ الطَّلاق.</p>
                <p>وَمَا أَوْهَمَ تَجَدُّدَ العِلْمِ لله تَعَالَى مِنَ الآيَاتِ القُرْءانِيَّة ِ فليس المراد به ذلك كقوله تعالى ( الآن خَفَّفَ الله عنكم وعَلِمَ أنَّ فيكم ضعفًا )</p>
                <p>فقوله ( الآن خَفَّفَ الله عنكم ) أي تغير الحكم - رفع عنكم الحكم - ما كان واجبًا عليكم من مقاتلة واحد من المسلمين لعشرة من الكفار بإيجاب مقاتلة واحد من المسلمين لاثنين من الكفار</p>
                <p>فقوله ((وعَلِمَ)) ليس مرتبطًا بقوله تعالى ( "الآن" )، "الآن" مرتبط بالحكم أي "الآن" ارتفع ذاك الحكم إلى هذا الحكم الجديد،</p>
                <p>قوله تعالى (وعَلِمَ) أي لأن الله عَلِمَ بعلمه الأزلي أن فيكم ضعفا خفف عنكم الآن بنزول الآية، وليس معناه أن الله علم ذلك بعد أن لم يكن عالمًا. فالله لا يَتَجَدَّدُ لَهُ عِلْمٌ علمه لا بداية له ولا نهاية لا يزيد ولا ينقص.</p>`
            },
            {
                id: "s30",
                title: "آية ومعنى (30)",
                icon: "fa-book",
                desc: "قوله تعالى ( يخافون ربهم من فوقهم ) سورة النحل/٥٠",
                content: `<p><strong>قوله تعالى ( يخافون ربهم من فوقهم ) سورة النحل/٥٠</strong> معناه يخافون ربهم من أن يُنزّل عليهم العذاب من فوقهم والله موصوف بالعلو وفوقية الرتبة والعظمة ومنزه عن الكون في مكان وعن المحاذاة.</p>
                <p>[《 بيان معنى الفوقية في حق الله وتنزيه الله عن المكان والجهة 》]</p>
                <p>1) قال الإمامُ المُفَسِّرُ فخر الدين الرازِيُّ (ت 604هـ) في تفسيره ما نَصُّه:</p>
                <p>["[قوله تعالى: ﴿وَهُوَ الْقاهِرُ فَوْقَ عِبادِهِ﴾] [الأَنْعام: 61]</p>
                <p>اعْلَمْ أَنَّ هَذَا نَوْعٌ ءاخَرُ مِنَ الدَّلَائِلِ الدَّالَّةِ عَلَى كَمَالِ قُدْرَةِ اللَّه تَعَالَى وَكَمَالِ حِكْمَتِهِ،</p>
                <p>وَتَقْرِيرُهُ أَنَّا بَيَّنَّا فِيمَا سَبَقَ أَنَّهُ لَا يَجُوزُ أَنْ يَكُونَ الْمُرَادُ مِنْ هَذِهِ الْآيَةِ الْفَوْقِيَّةَ بِالْمَكَانِ وَالْجِهَةِ بَلْ يَجِبُ أَنْ يَكُونَ الْمُرَادُ مِنْهَا الْفَوْقِيَّةَ بِالْقَهْرِ وَالْقُدْرَةِ،</p>
                <p>كَمَا يُقَالُ أَمْرُ فُلَانٍ فَوْقَ أَمْرِ فُلَانٍ بِمَعْنَى أَنَّهُ أَعْلَى وَأَنْفَذُ، وَمِنْهُ قَوْلُهُ تَعَالَى: ﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾ [الْفَتْحِ: 10]</p>
                <p>وَمِمَّا يُؤَكِّدُ أَنَّ الْمُرَادَ ذَلِكَ أَنَّ قَوْلَهُ: ﴿وَهُوَ الْقاهِرُ فَوْقَ عِبادِهِ﴾ مُشْعِرٌ بِأَنَّ هَذَا الْقَهْرَ إِنَّمَا حَصَلَ بِسَبَبِ هَذِهِ الْفَوْقِيَّةِ،</p>
                <p>وَالْفَوْقِيَّةُ الْمُفِيدَةُ لِصِفَةِ الْقَهْرِ هِيَ الْفَوْقِيَّةُ بِالْقُدْرَةِ لَا الْفَوْقِيَّةُ بِالْجِهَةِ، إِذِ الْمَعْلُومُ أَنَّ الْمُرْتَفِعَ فِي الْمَكَانِ قَدْ يَكُونُ مَقْهُورًا" انتهى.</p>
                <p>2) قال ابن عَطِيَّة الأندلسيّ (ت 542هـ) في تفسيره عن معنى ءاية ﴿يَخافُونَ رَبَّهُمْ مِنْ فَوْقِهِمْ وَيَفْعَلُونَ ما يُؤْمَرُونَ﴾ [النَّحْل: 50] ما نَصُّه:</p>
                <p>"وقوله ﴿مِنْ فَوْقِهِمْ﴾ يَحْتَمِلُ مَعْنَيين:</p>
                <p>أحدهما: الفوقية التي يوصف بها الله تعالى فهي فوقية القدر والعظمة والقهر والسلطان.</p>
                <p>والآخر: أنْ يَتَعَلَّق قوله ﴿مِنْ فَوْقِهِمْ﴾ بقوله ﴿يَخافُونَ﴾، أي يَخافون عذابَ رَبِّهِم مِن فَوْقِهم وذلك أنَّ عادةَ عَذابِ الأُمَمِ إِنّما أَتَى مِن جِهَة فَوْقٍ" انتهى.</p>
                <p>3) قال ابن عادل الحنبلي (ت 775هـ) في تفسيره ما نَصُّه:</p>
                <p>"استَدَلَّ المشبهة بقوله تعالى: ﴿يَخَافُونَ رَبَّهُمْ مِّن فَوْقِهِمْ﴾ على أنه تعالى فوقهم بالذات.</p>
                <p>والجواب: أن معناه: يخافون ربَّهم مِن أَنْ يُنَزِّلَ عَلَيهم العَذابَ مِن فَوْقِهم، وإذا احتَمَل اللَفْظُ هذا المعنى سَقَطَ اسْتِدْلالُهم، وأيضًا يجب حمل هذه الفوقية على الفوقية بالقدرة، والقهر والغلبة؛ لقوله تعالى: ﴿وَإِنَّا فَوْقَهُمْ قَاهِرُونَ﴾ [الأعراف: 127]" انتهى.</p>
                <p>قالَ أهلُ الحقّ: ليس الشأنُ في عُلوّ الجهةِ بل الشأنُ في علوّ القدرِ،</p>
                <p>والفوقية في لغةِ العربِ تأتي على معنيينِ فوقية المكانِ والجهةِ وفوقية القدرِ قال الله تعالى إخبارًا عن فرعون: {وإنا فوقهم قاهرون} أي نحنُ فوقَهُم بالقوةِ والسيطرةِ؛</p>
                <p>لأنه لا يصحُّ أن يقالَ إن فرعونَ أرادَ بهذا أنه فوقَ رقابِ بني إسرائيلَ إلى جهةِ العلوّ إنما أرادَ أنهُم مقهورونَ لَهُ مغلوبونَ.</p>
                <p>فقول الله تعالى اخباراً عن فرعون الكافر {أنا ربكم الأعلى} معناه علو القدر. وكذا قوله {وإنا فوقهم قاهرون}</p>
                <p>أي فوقية القوة والسيطرة وليس فوقية المكان. فلهذا نص العلماء أن الفوقية والعلو أذا أطلق على الله فالمراد منه علو قدر وفوقية قهر سبحانه وتعالى،</p>
                <p>وليس علو مكان وجهة لأن الله كان قبل الخلق والمكان والجهات بلا مكان كما أجمع كل علماء أهل السنة على ذلك ونص على ذلك ابن حجر العسقلاني في شرحه على صحيح البخاري.</p>`
            },
            {
                id: "s31",
                title: "آية ومعنى (31)",
                icon: "fa-book",
                desc: "قوله تعالى ( فمن شاء فليؤمن ومن شاء فليكفر ) سورة الكهف/٢٩",
                content: `<p><strong>قوله تعالى ( فمن شاء فليؤمن ومن شاء فليكفر ) سورة الكهف/٢٩</strong> هذه الآية تهديد ووعيد لمن كفر بالنار وليس إذنا وتخييرا لهم بالكفر كما زعم بعض المحرفين، وهذه الآية ليست دليلا على أن الله أعطى الحرية للكافرين في اعتقاد ما شاؤوا ولو كان كفرا.</p>
                <p>قول الله تعالى {ومن شاء فليكفر} هذا على التهديد والوعيد، معناه أن الذي يكفر فقد هيأ الله له العذاب في اﻵخرة يدخل جهنم خالدًا فيها أبدا. هذا وعيد وليس إذنًا بالضلال وعبادة الحجر والبقر والفئران كما هو حاصل من بعض الناس.</p>
                <p>وليس معنى اﻵية أيها الناس إن شئتم آمنتم وإن شئتم كفرتم، ليس معناها أنه ليس عليكم حرج سواء آمنتم أو كفرتم.</p>
                <p>هذا فساد عريض لم يقل به أحد من المسلمين، فسلف الأمة وخلفها متفقون على أن أساس ما جاء به الأنبياء هو الأمر بالإيمان بالله وحده لا شريك له، وأن من خالف ذلك الأمر الربانيّ فمآله إلى جهنم خالدًا فيها أبداً كما قال كتاب ربنا سبحانه.</p>
                <p>ليس معنى الآية أن الكفر والضلال وفعل الشرور رخصةٌ لمن أراد فعلها، إنما معناها تهديد وتوعّد ﻷن الله أتبع ذلك بقوله {إنا أعتدنا للظالمين} أي للكافرين {نارًا أحاط بهم سرادقها}، والمعنى أن من آمن منكم فلنفسه أي ينفع نفسه، ومن كفر فإنا أعتدنا للظالمين أي للكافرين نارا، هيأنا لهم نارًا أحاط بهم سرادقها، معناه أنهم محفوفون في جهنم من جميع الجهات، فجهنم لها أرض مستقلة غير أرضنا هذه وغير اﻷرض السابعة ولها جدران حتى يقوى الحر عليهم، ولها غطاء لها سقف كذلك ليزداد الحر قوة.</p>`
            },
            {
                id: "s32",
                title: "آية ومعنى (32)",
                icon: "fa-book",
                desc: "قوله تعالى ( وذا النون إذ ذهب مغاضبا فظنّ أن لن نقدر عليه ) سورة الأنبياء/٨٧",
                content: `<p><strong>قوله تعالى ( وذا النون إذ ذهب مغاضبا فظنّ أن لن نقدر عليه ) سورة الأنبياء/٨٧</strong> معناه سيدنا يونس غضب على قومه لأنهم لم يؤمنوا بدعوته ومعنى فظن أن لن نقدر عليه أي ظن أن لن نضيّق عليه ولم يشكّ يونس في قدرة الله عليه.</p>
                <p>أَمَّا مَا وَرَدَ فِى الْقُرْءَانِ فِى شَأْنِ نَبِىِّ اللَّهِ يُونُسَ عَلَيْهِ السَّلامُ ﴿وَذَا النُّونِ إِذْ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَنْ لَّنْ نَّقْدِرَ عَلَيْهِ فَنَادَى فِى الظُّلُمَاتِ أَنْ لا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّى كُنْتُ مِنَ الظَّالِمِينَ فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ وَكَذَلِكَ نُنْجِى الْمُؤْمِنِينَ﴾ فَلَيْسَ مَعْنَاهُ أَنَّهُ ذَهَبَ مُغَاضِبًا لِرَبِّهِ بَلْ ذَهَبَ مُغَاضِبًا لِقَوْمِهِ لِكُفْرِهِمْ وَتَكْذِيبِهِمْ لَهُ لَكِنَّهُ تَرَكَهُمْ قَبْلَ أَنْ يَأْذَنَ اللَّهُ لَهُ.</p>
                <p>وَالنُّونُ أَىِ الْحُوتُ وَأُضِيفَ إِلَيْهِ لِابْتِلاعِهِ لَهُ وَمَعْنَى ذِى النُّونِ صَاحِبُ الْحُوتِ، ﴿فَظَنَّ أَنْ لَّنْ نَّقْدِرَ عَلَيْهِ﴾ أَىْ ظَنَّ أَنَّ اللَّهَ تَعَالَى لَنْ يُضَيِّقَ عَلَيْهِ بِتَرْكِهِ لِقَوْمِهِ قَبْلَ أَنْ يَأْمُرَهُ اللَّهُ بِذَلِكَ أَمَّا مَنْ نَسَبَ إِلَى نَبِىِّ اللَّهِ يُونُسَ عَلَيْهِ السَّلامُ أَنَّهُ ظَنَّ أَنَّ اللَّهَ تَعَالَى لا يَقْدِرُ عَلَيْهِ فَقَدْ نَسَبَ إِلَيْهِ الْكُفْرَ وَالْعِيَاذُ بِاللَّهِ.</p>
                <p>سَيِّدُنَا يُونُسُ عَلَيْهِ السَّلامُ نَبِىٌّ مُرْسَلٌ اللَّهُ تَعَالَى أَرْسَلَهُ إِلَى قَوْمٍ كُفَّارٍ لِيَدْعُوَهُمْ إِلَى الإِسْلامِ فَأَقَامَ فِيهِمْ مُدَّةً طَوِيلَةً يَدْعُوهُمْ إِلَى عِبَادَةِ اللَّهِ وَحْدَهُ وَتَرْكِ عِبَادَةِ الأَوْثَانِ وَلَمْ يُؤْمِنْ بِهِ إِلَّا الْقَلِيلُ فَأَيِسَ مِنْهُمْ وَتَرَكَهُمْ.</p>
                <p>وَعِنْدَمَا أَلْقَى يُونُسُ عَلَيْهِ السَّلامُ بِنَفْسِهِ فِى الْبَحْرِ ابْتَلَعَهُ الْحُوتُ ابْتِلاءً لَهُ عَلَى تَرْكِهِ قَوْمَهُ الَّذِينَ أَغْضَبُوهُ لَكِنَّهُ لَمْ يَخْدِشْ لَهُ لَحْمًا وَلَمْ يَكْسِرْ لَهُ عَظْمًا وَلَمْ يَكُنْ قَصْدُهُ الِانْتِحَارَ.</p>
                <p>أَمَّا مَنِ اعْتَقَدَ أَنَّ سَيِّدَنَا يُونُسَ عَلَيْهِ السَّلامُ أَلْقَى بِنَفْسِهِ فِى الْبَحْرِ لِيَنْتَحِرَ أَىْ لِيَقْتُلَ نَفْسَهُ فَهُوَ كَافِرٌ لِأَنَّ الِانْتِحَارَ ذَنْبٌ كَبِيرٌ وَهُوَ أَكْبَرُ الذُّنُوبِ بَعْدَ الْكُفْرِ فَلا يُتَصَوَّرُ حُصُولُهُ مِنَ الأَنْبِيَاءِ.</p>
                <p>مَكَثَ سَيِّدُنَا يُونُسُ عَلَيْهِ السَّلامُ فِى بَطْنِ الْحُوتِ أَيَّامًا فِى ظُلُمَاتِ الْبَحْرِ يَدْعُو اللَّهَ وَيَسْتَغْفِرُهُ وَيُسَبِّحُهُ فَاسْتَجَابَ اللَّهُ دُعَاءَهُ وَنَجَّاهُ مِنَ الْغَمِّ وَالْكَرْبِ لِأَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ لَهُ فِى بَطْنِ الْحُوتِ فَأَمَرَ اللَّهُ تَعَالَى الْحُوتَ أَنْ يُلْقِيَهُ فِى الْبَرِّ.</p>
                <p>فَعَنْ سَعْدِ بنِ أَبِى وَقَّاصٍ رَضِىَ اللَّهُ عَنْهُ أَنَّهُ قَالَ قَالَ رَسُولُ اللَّهِ ﷺ دَعْوَةُ ذِى النُّونِ إِذْ دَعَا رَبَّهُ وَهُوَ فِى بَطْنِ الْحُوتِ لا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّى كُنْتُ مِنَ الظَّالِمِينَ لَمْ يَدْعُ بِهَا رَجُلٌ مُسْلِمٌ فِى شَىْءٍ إِلَّا اسْتُجِيبَ لَهُ رَوَاهُ أَحْمَدُ وَالتِّرْمِذِىُّ.</p>`
            },
            {
                id: "s33",
                title: "آية ومعنى (33)",
                icon: "fa-book",
                desc: "قوله تعالى ( فأولئك يبدل الله سيئاتهم حسنات ) سورة الفرقان/٧٠",
                content: `<p><strong>قوله تعالى ( فأولئك يبدل الله سيئاتهم حسنات ) سورة الفرقان/٧٠</strong> معناه يبدّل الله في الدنيا سيئاتهم بأن يمحو سوابق معاصيهم ويثبت مكانها لواحق طاعاتهم، وليس معناها أن عين المعصية تتحول حسنة.</p>
                <p>قال الله عز وجلّ</p>
                <p>[(إِلَّا مَنْ تَابَ وَآمَنَ وَعَمِلَ عَمَلًا صَالِحًا فَأُولَئِكَ يُبَدِّلُ اللَّهُ سَيِّئَاتِهِمْ حَسَنَاتٍ وَكَانَ اللَّهُ غَفُورًا رَحِيمًا) سورة الفرقان: 70]</p>
                <p>ليعلم أنه لا يجوز أن يعتقد أن السيئة تنقلب حسنة بحال من الأحوال وليس معنى هذه الآية أن الكافر إن أسلم أو العاصي إن تاب فإن السيئات بعينها تنقلب حسنات</p>
                <p>فإن هذا الاعتقاد معناه لو أن كافرا كان لا يؤذي الناس وكافرًا كان يؤذي الناس ويتمادى في الفساد ثم أسلما فإن هذا الكافر الذي كان يؤذي الناس ويتمادى في الفساد له بإسلامه أجر أعظم من الأجر الذي يكون بإسلام ذاك بزعم من ادعى أن السيئات بذاتها تنقلب حسنات فكلما كانت السيئات أكثر كانت الحسنات أكثر بزعم من ادعى هذا المعنى وهذا معتقد فاسد</p>
                <p>وإنما معنى الآية كما في الدر المنثور للجلال السيوطي عن قتادة " فأولئك يبدل الله سيئاتهم حسنات " قال إنما التبديل طاعة الله بعد عصيانه وذكر الله بعد نسيانه والخير تعمله بعد الشر.</p>
                <p>وبمعنى ما جاء عن قتادة روي عن ابن عباس والحسن ومجاهد كما ذكره الفخر الرازي في التفسير الكبير وقال أيضا قال الزجاج السيئة بعينها لا تصير حسنة وروى هذا التأويل أيضا عن ابن عباس والحسن ومجاهد السيوطي في الدر المنثور والطبري في جامع البيان عن ابن عباس وغيرهم.</p>
                <p>معناه الكافر الذي يدخل في الإسلام فيغفر الله تعالى له بإسلامه ويوفقه</p>
                <p>للعمل الصالح فتحل الحسنات التي عملها بعد إسلامه محل تلك السيئات التي سبق أن ارتكبها وغفرت له بإسلامه.</p>
                <p>فليعلم هذا فإنه نفيس وليحذر من اعتقاد أن الذنب ينقلب بعينه حسنة فإنه كفر خطير وشر مستطير وفساده ظاهر لمن عنده مسكة عقل فيجب على من كان اعتقد هذا المعنى الباطل أن يتشهد للخلاص من الكفر بقول أشهد أن لا إله إلا الله وأشهد أن محمدا رسول الله.</p>
                <p>معنى مسكة (بضم الميم )عقل اي شىء من العقل</p>`
            },
            {
                id: "s34",
                title: "آية ومعنى (34)",
                icon: "fa-book",
                desc: "قوله تعالى ( إنك لا تهدي من أحببت ولكن الله يهدي من يشاء ) سورة القصص/٥٦",
                content: `<p><strong>قوله تعالى ( إنك لا تهدي من أحببت ولكن الله يهدي من يشاء ) سورة القصص/٥٦</strong> معناه إنك يا محمد لا تهدي من أحببتَ هدايته ولكن الله يهدي من يشاء أن يهديه من خلقه بتوفيقه للإيمان بالله ورسوله. فمعنى من أحببتَ في الآية أي أحببت هدايته.</p>
                <p>مسألة مهمة جدا : قال العلماء : مستحيل أن يَمِيلَ قلبُ نبيٍّ لِمَحَبَةِ ذاتِ كافر.</p>
                <p>ما حصل لنبيٍّ من أنبياءِ الله أنْ مالَ قلبُهُ إلى ذات كافرٍ ولو كانت زوجَتُهُ، أما اذا شخص تزوج من كافرة كاليهودية مثلاً إذا مَالَ قلبه لها ما عليه معصية لكن حرام أن يقول لها إني أحبك.</p>
                <p>فإذا شخصٌ ظَنَّ لِجَهَلِهِ أن الرسول كان يحب أبا طالب لِحسانِهِ لَهُ لمعاملتِهِ لَهُ ودفاعِهِ عنه ليس أنه يُحِبُ ذاتَ الكافر لِكُفرِهِ "لا يكفر لكنه غلط"، الرسول ما كان يحبُ كافراً إن كان عمَهُ أو غير عمِهِ.</p>
                <p>قال الله تعالى { إِنَّكَ لَا تَهْدِي مَنْ أَحْبَبْتَ وَلَٰكِنَّ اللَّهَ يَهْدِي مَن يَشَاء) مَن أَحبَبت معناهُ الرّسولُ كانَ يحِبُّ اهتداءَ أبي طالب، ليسَ معناهُ يحِبُّ شَخصَه مع كفرِه، لذَلكَ لمَّا ماتَ ونزَل في الآيةِ بأنّهُ ماتَ على الكفر وأنَّ اللهَ لم يَهدِهِ جاءَ عَلِيُّ ابنُ أبي طالب إلى الرَّسول فقال يا رسولَ اللهِ إنَّ عمَّكَ الشيخَ الضّالَّ قد مات (يعني أباه)، قالَ اذهَبْ فوَارِه أي ادفِنْهُ". رواه البيهقي، وَارِه معناهُ ادْفِنه، أي جَهّزْه للدَّفن، هو ما خَرَج في جِنازتِه لو كان يُحبُّه لِشَخصِه كانَ خَرَج في جِنازتِه، هَذا دليلٌ لنا على أنّه ما كانَ يحِبُّ شَخصَهُ إنما كانَ يحِبُّ اهتداءَه، ومعنى قولِه تعالى: { إنّكَ لا تهدِي مَن أحبَبْتَ }.</p>
                <p>مَن أَحبَبْتَ اهتداءَه لا تهديْه يا محمّد ولكنَّ اللهَ يَهدِي مَن يَشاء، فمَنْ شاءَ اللهُ لهُ الهدايةَ في الأزَلِ اللهُ يَهديهِ أمّا الذي أنتَ تحِبُ لهُ الاهتداءَ ولم يَشإِ اللهُ لهُ الإسلامَ لا يَهديْه اللهُ.</p>`
            },

                icon: "fa-book",
                desc: "قوله تعالى ( إن الصلاة تنهى عن الفحشاء والمنكر ولذكر الله أكبر ) سورة العنكبوت/٤٥",
                content: `<p><strong>قوله تعالى ( إن الصلاة تنهى عن الفحشاء والمنكر ولذكر الله أكبر ) سورة العنكبوت/٤٥</strong> فمعنى ولذكر الله أكبر أي ذكر الله إياكم أكبر من ذكركم إياه، وليس معنى الآية أن التسبيح ونحوه باللسان أفضل من الصلوات الخمس.</p>
                <p>فائدة:معنى قول الله تعالى {إِنَّ الصَّلاَةَ تَنْهَى عَنِ الْفَحْشَاءِ وَالْمُنْكَرِ وَلَذِكْرُ اللَّهِ أَكْبَرُ}: أي ذِكْرُ اللهِ لكم بالثواب والثناء عليكم أكبر من ذِكْرِكُم له في عبادتكم وصلواتكم. ليس معناه أن اشتغال المرء بالتسبيح والتحميد بلسانه ونحو ذلك من الأذكار أفضل من الصلوات الخمس، الصلوات الخمس أفضل الواجبات بعد الإيمان بالله ورسوله. كما قال الطبري في تفسيره عن مجاهد وعكرمة، وقال القرطبي في تفسيره: "عن ابن عمر أن النبي ﷺ قال في قول الله عز وجل: {وَلَذِكْرُ اللَّهِ أَكْبَرُ} قال: ذِكْرُ اللهِ إياكم أكبر مِن ذِكْرِكُم إياه" اهـ. ومثله قال ابن الجوزي في تفسيره "زاد المسير"، والسيوطي في "الدر المنثور".</p>`
            },
            {
                id: "s36",
                title: "آية ومعنى (36)",
                icon: "fa-book",
                desc: "قوله تعالى ( والسماء بنيناها بأييد وإنا لموسعون ) سورة الذاريات/٤٧",
                content: `<p><strong>قوله تعالى ( والسماء بنيناها بأييد وإنا لموسعون ) سورة الذاريات/٤٧</strong> معنى بأييد هنا أي بقدرة كما قال ابن عباس وليس المقصود باليد هنا اليد الجارحة فالله منزه عن ذلك واليد تأتي بمعنى القدرة والقدرة هي القوة.</p>
                <p>قال الله تعالى: {وَالسَّمَاءَ بَنَيْنَاهَا بِأَييْدٍ وَإِنَّا لَمُوسِعُونَ} سورة الذاريات</p>
                <p>قال ابن عباس رضي الله عنهما: "بِأَيْدٍ"</p>
                <p>أي بقدرة، وليس المقصودُ باليد هنا الجارحةَ التي لنا فإن الله تعالى منزه عن ذلك.</p>
                <p>فاليدُ تأتي بمعنى القدرة، والقدرةُ هي القوةُ.</p>
                <p>{وَإِنَّا لَمُوسِعُونَ}: أي قادرون، وليس كما زعم بعض الجهال أن الكون في اتِّساعٍ دائم!</p>
                <p>هذا كذبٌ مردود.</p>
                <p>وتأتي اليد بمعنى العَهدِ كما في قوله تعالى {يَدُ اللهِ فَوْقَ أَيْدِيهِمْ} سورة الفتح، أي عَهدُ الله فوقَ عُهودِهم، أي ثَبَتَ ووجبَ عليهم، لأن معاهدَتَهم للرسول ﷺ تحتَ شجرةِ الرضوان في الحديبية هي معاهدةٌ لله تعالى لأن الله هو الذي أَمَرَ نبيَّهُ ﷺ بهذه المبايَعَة.</p>
                <p>وأما قولُهُ تعالى: {بَلْ يَدَاهُ مَبْسُوطَتَانِ يُنْفِقُ كَيْفَ يَشَاءُ} سورة المائدة، فمعناهُ غنيٌّ واسِعُ الكَرَم.</p>
                <p>فمن حمل إضافة الوجه أو اليد أو العين الوارد في القرءان أو الحديث في حق الله تعالى على الحقيقة أي على هذه الأعضاء والجوارح المؤلَّفة والمركَّبة كما فعلت المجسمة فقد كذَّب الله تعالى.</p>
                <p>الوجه والعين واليد إذا أضيفت إلى الله فلها معنى يليق بالله تعالى ليس بجسم ولا حجم ولا جارحة ولا هيئة ولا صورة ولا كيفية ولا كمية والحمد لله الذي وفق أهل السنة لمعرفة العقيدة الصحيحة.</p>`
            },
            {
                id: "s37",
                title: "آية ومعنى (37)",
                icon: "fa-book",
                desc: "قوله تعالى ( ثم دنا فتدلى فكان قاب قوسين أو أدنى ) سورة النجم/ ٨-٩",
                content: `<p><strong>قوله تعالى ( ثم دنا فتدلى فكان قاب قوسين أو أدنى ) سورة النجم/ ٨-٩</strong> معناه أن جبريل اقترب من النبي عليه الصلاة والسلام فكان ما بينهما من المسافة بمقدار ذراعين أو أقرب واقترب جبريل من النبي فرحا به. وليس معناه أن الله دنا بذاته من النبي لأن الله لا يحويه مكان.</p>
                <p>{ ثُمَّ دَنَا فَتَدَلَّىٰ (8) فَكَانَ قَابَ قَوْسَيْنِ أَوْ أَدْنَىٰ (9) }</p>
                <p>[ سورة النجم : 8 إلى 9 ]</p>
                <p>صدق الله العظيم</p>
                <p>قالت عائشة ام المؤمنين رضي الله عنها وأرضاها الذي دنا فتدلى هو جبريل عليه السلام</p>
                <p>ذكر ذلك الامام البخاري و الامام مسلم</p>
                <p>والحافظ الكبير ابو بكر البيهقي في الاسماء والصفات و...</p>
                <p>ان الذي دنا فتدلى هو جبريل عليه السلام كما قالت ذلك عائشة ام المؤمنين رضي الله عنها وأرضاها ورضي عن ابيها ابي بكر الصديق .</p>
                <p>قال الشيخ احمد بن إسماعيل بن عثمان بن مراد الكوراني ويقال له المللا كوراني وهو شيخ السلطان محمد الفاتح الماتريدي:</p>
                <p>((((اتفقت الروايات على أن الذي دنا فتدلى هو جبريل عليه السلام ))).</p>
                <p>قال الحافظ العراقي من اثبت لله الجهة فهو كافر بإجماع الأمة</p>`
            },
            {
                id: "s38",
                title: "آية ومعنى (38)",
                icon: "fa-book",
                desc: "قوله تعالى ( كل يوم هو في شأن ) سورة الرحمن/٢٩",
                content: `<p><strong>قوله تعالى ( كل يوم هو في شأن ) سورة الرحمن/٢٩</strong> معنى الآية كما فسرها النبي بقوله ( يغفر ذنبا ويكشف كربا ويرفع قوما ويضع ءاخرين ). وليس المعنى أن الله تعالى يتغير من حال إلى حال كل يوم بل الله يغير ولا يتغير.</p>
                <p>مَعْنَى قَوْلِهِ تعالى: "كُلَّ يَوْمٍ هُوَ في شَأنٍ" مَا قَالَهُ الرَّسُولُ صَلَّى اللهُ عليهِ وسَلَّمَ: "يَغْفِرُ ذَنْْبًا وَيُفَرِّجُ كَرْبًا وَيَرْفَعُ قَوْمًا وَيَضَعُ ءاخَرِين" رَواهُ ابنُ حِبَّانَ .</p>
                <p>" كلَّ يوم هو في شأن "، معناه يغير الأشياء، هو لا يتغير، علمه لا يتغير ومشيئته وتقديره لا يتغير، إنما هو يغيّر المحدثات (المخلوقات ) من حالٍ إلى حال .</p>
                <p>وَيُوَافِقُ هَذَا قَوْل النَّاسِ سُبْحَانَ الَّذي يُغَيِّرُ وَلا يَتَغَيَّرُ وَهُوَ كَلامٌ جَمِيلٌ إِذِ التَّغَيُّرُ في الْمَخْلُوقَاتِ وَلَيْسَ في اللهِ وَصِفَاتِهِ فَيَكُونُ مَعْنَى الآيَةِ أَنَّ اللهَ يُغَيِّرُ في خَلْقِهِ مَا شَاءَ.</p>`
            },
            {
                id: "s39",
                title: "آية ومعنى (39)",
                icon: "fa-book",
                desc: "قوله تعالى ( ءأمنتم من في السماء أن يخسف بكم الأرض) سورة الملك/١٦",
                content: `<p><strong>قوله تعالى ( ءأمنتم من في السماء أن يخسف بكم الأرض) سورة الملك/١٦</strong> قال القرطبي أي ءأمنتم خالق من في السماء، وقال بعضهم ءأمنتم جبريل الموكل بالخسف أن يخسف بكم الأرض بأمر من الله، وليس معنى الآية أن الله يسكن السماء فالله لا يحتاج للسماء ولا يسكن المكان.</p>
                <p>قال المفسر الفخر الرازي في تفسيره وأبو حيان الأندلسي في كتابه البحر المحيط: (أأمنتم من في السماء ان يخسف بكم الأرض) المراد بمن في السماء الملائكة‚ وليس المراد ان الله ساكن في السماء.</p>
                <p>قال المفسر #القرطبي: "وقيل: هو إشارة إلى الملائكة. وقيل: إلى جبريل وهو الملك الموكل بالعذاب. قلت: ويحتمل أن يكون المعنى: أأمنتم خالق من في السماء أن يخسف بكم الأرض كما خسفها بقارون. اهـ</p>
                <p>ثم قال: والمراد بها توقيره وتنـزيهه عن السفل والتحت. ووصفه بالعلو والعظمة لا بالأماكن والجهات والحدود لأنها صفات الأجسام. وإنما ترفع الأيدي بالدعاء إلى السماء لأن السماء مهبط الوحي، ومنـزل القطر، ومحل القدس، ومعدن المطهرين من الملائكة، وإليها ترفع أعمال العباد، وفوقها عرشه وجنته كما جعل الله الكعبة قبلة للدعاء والصلاة، ولأنه خلق الأمكنة وهو غير محتاج إليها، وكان في أزله قبل خلق المكان والزمان. #ولا_مكان_له_ولا_زمان. وهو الآن على ما عليه كان" اهـ. .</p>
                <p>تفسير القرطبي الجزء 21 صحيفة 126.</p>`
            },
            {
                id: "s40",
                title: "آية ومعنى (40)",
                icon: "fa-book",
                desc: "قوله تعالى ( سبح اسم ربك الأعلى ) سورة الأعلى/١",
                content: `<p><strong>قوله تعالى ( سبح اسم ربك الأعلى ) سورة الأعلى/١</strong> معناه أنزه ربي الأعلى أي الذي هو أعلى من كل علي علو قدر لا علو حيز ومكان لأن الشأن في علو القدر وليس في علو المكان.</p>
                <p>سبحان ربي الأعلى، أي تنزه ربي عن كل نقص وعيب. والله تعالى هو الأعلى من كل شيء قدرًا سبحانه.</p>
                <p>فنحن نقول في سجودنا: سبحان ربي الأعلى. معناه سبحان ربي الذي هو أعلى من كل شىء قدرًا ومكانة، سبحانه وتعالى،</p>
                <p>وليس المعنى أن الله تبارك وتعالى عالٍ بالمكان والحيز والجهة!</p>
                <p>قال تعالى {سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى} وقال تعالى لسيدنا موسى عليه السلام {قلنا لا تخف إنك أنت الأعلى} ...</p>
                <p>وكثير منا سمع بالقصة التي جاءت يوم نزل الصحابة في معركة أحد عن جبل الرماة ظَنًّا منهم أن المعركة انتهت فوقتها حصلت مقتلة في المسلمين ونادى أبو سفيان فقال "اعلُ هبل" فرد الصحابة رضوان الله عليهم بقولهم "الله أعلى وأجل" ذكر القصة كاملة الإمام البخاري.</p>
                <p>فمن يتأمل هذه الآيات والقصة يجد أقوى دليل على أن العلو المذكور لا يفسر بعلو المكان ولكن بعلو المكانة والقهر والغلبة</p>
                <p>قال الإمام اللغوي أبو القاسم الزَّجَاجِيُّ في [كتابه اشتقاق أسماء الله] : " العلاءُ: أي الرِّفعةُ والسَّناءُ والجَلالُ".</p>
                <p>وقال : "والعَلِيُّ والعَالي أيضًا بمعنى القاهر والغالب للأشياء، وليس معنى الأعلى نسبة علو المكان لله" اهـ.</p>
                <p>وقال الخليل بن أحمد الفراهيدي: " الله عز وجل هو العَلِيُّ الأعلى المتعالي ذو العَلاءِ والعُلوِّ، فأما العلاءُ: فالرفعةُ، والعُلوِّ: العَظَمَة" اهـ.</p>
                <p>قالَ الحافظُ ابنُ حجرٍ في الفتح : " وقد تقرر أنَّ اللهَ ليسَ بجسمٍ فلا يحتاجُ إلى مكانٍ يستقِرُّ فيه فقد كانَ ولا مكان".</p>
                <p>الإمام الرازي الشافعي في كتابه "التفسير الكبير" يقول : "قوله تعالى : (وَهُوَ العَلِيُّ العَظِيم).</p>
                <p>ولا يجوز أن يكون المراد بكونه عليا العلو في الجهة والمكان لما ثبتت الدلالة على فساده".اهـ.</p>`
            },
            {
                id: "s41",
                title: "آية ومعنى (41)",
                icon: "fa-book",
                desc: "قوله تعالى ( والأرض جميعا قبضته يوم القيامة ) سورة الزمر/٦٧",
                content: `<p><strong>قوله تعالى ( والأرض جميعا قبضته يوم القيامة ) سورة الزمر/٦٧</strong> معناه قبضته هنا أي في سلطانه وملكه فلا ملك يومئذ إلا الله، وليس معنى قبضته هنا أن الله له يد جارحة ويقبض بها الأرض كما يفعل المخلوق فالله لا يوصف بالجارحة.</p>
                <p>▪ قَالَ الْقُرْطُبِيّ في تفسيره (في تفسير قوله تعالى: ﴿وَالْأَرْضُ جَمِيعًا قَبْضَتُهُ يَوْمَ الْقِيَامَةِ وَالسَّمَاوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ﴾): يَده عبارَة عَن قدرته وإحاطته بِجَمِيعِ مخلوقاته</p>
                <p>▪ والدليل من القرءان على أن اليد تَأتِي: بِمَعْنى الْقُوَّة  قَوْله تَعَالَى: ﴿وَاذْكُرْ عَبْدَنَا دَاوُودَ ذَا الْأَيْدِ﴾</p>
                <p>▪ وَبِمَعْنى: النِّعْمَة تَقول: كم من  يَد لي عِنْد فلَان، أَي: كم من نعْمَة أسديتها إِلَيْهِ</p>
                <p>▪ وَبِمَعْنى الْجَارِحَة، وَمِنْه قَوْله تَعَالَى: ﴿وَخُذْ بِيَدِكَ ضِغْثًا﴾</p>
                <p>▪ وَبِمَعْنى الذل وَمِنْه قَوْله تَعَالَى: ﴿حَتَّىٰ يُعْطُوا الْجِزْيَةَ عَنْ يَدٍ﴾ أَي عَن ذل</p>
                <p>▪ وَقَوله تَعَالَى ﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾ قيل: فِي الْوَفَاء، وَقيل: فِي الثَّوَاب.</p>
                <p>▪ وَالْيَد السُّلْطَان</p>
                <p>▪ وَالْيَد الطَّاعَة</p>
                <p>▪ وَالْيَد الْجَمَاعَة</p>
                <p>▪ وفِي الحَدِيث: "وَأَخَذَ بِهِم يَدَ الْبَحْرِ" ، يُرِيد طَرِيق السَّاحِل</p>
                <p>▪ وَالْيَد الْحِفْظ والوقاية</p>
                <p>▪ وَيَدُ الْقوس أَعْلَاهَا</p>
                <p>▪ وَيَدُ السَّيْف قَبضته</p>
                <p>▪ وَيَد الطَّائِر جنَاحه</p>
                <p>▪ وبايَعتُه يدًا بيد أَي بعته أو اشتريت منه بِالنَّقْدِ.</p>`
            },
            {
                id: "s42",
                title: "آية ومعنى (42)",
                icon: "fa-book",
                desc: "قوله تعالى ( فقلت استغفروا ربكم إنه كان غفارا ) سورة نوح/١٠",
                content: `<p><strong>قوله تعالى ( فقلت استغفروا ربكم إنه كان غفارا ) سورة نوح/١٠</strong> معناه اطلبوا من الله المغفرة بترك الكفر والدخول في الإسلام بالنطق بالشهادتين، وليس معناه أن الكافر يدخل للإسلام بقول استغفر الله بل لا بد للدخول في الإسلام من النطق بالشهادتين.</p>
                <p>لله تعالى</p>
                <p>أمّا قولُ نبي الله نوح عليه السلام لِقومه:ِ {فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا} (سورة نوح، 10) أي ادخلوا في الإسلام يغفر لكم.</p>
                <p>وهو خطاب لكفار أحياء في زمنه وليس لكفار أموات، ومعنی كلامه أن توبوا إلى الله بِدخولكم في الإسلام بالتشهد ، اي قولوا لا إله إلا الله نوح رسول الله، وليس معنی ذلك أن سيدنا نوح يأمرهم بأن يقولوا: أسْتَغفرُ الله، وهم بَعْدُ مقيمونَ على عبادة الأصنام والأوثان.</p>
                <p>فالكافر لا ينفعه قول أستغفر الله قبل أن يتشهد للدخول في الإسلام، بلسانه يتشهد بطريقة صحيحة.</p>
                <p>والله تعالى يقول: {ما كان للنّبيّ والّذين آمنوا أنْ يسْتغْفروا للْمشْركين ولوْ كانوا أولي قرْبى منْ بعْد ما تبيّن لهمْ أنّهمْ أصْحاب الْجحيم} [التوبة:113]، وقال سبحانه: {ولا تصلِّ على أحد منهم مات أبدا ولا تقم على قبره إنهم كفروا بالله ورسوله وماتوا وهم فاسقون} [التوبة:84].</p>
                <p>ومن الأدلة أيضا على أنه لا يجوز الترحم على الكافر بعد موته أنه مرّةً جاءت إلى النبيّ بنتٌ في غزوةٍ غزاها رسولُ الله صلى الله عليه وسلم فذكَرَت أن أباها كانَ يقري الضّيف أي يُكرم الضّيف ويقضي حاجاتِ الطّالبِين ، لا يرُدّ طَالبًا قالت إنّ أبي كان لا يرُدُّ طالبًا، وكانت بنتُ حاتمٍ الطّائيِّ يُقال لها سفانة وهي حَسناء وفصيحةُ اللّسان أُعجِب الصّحابةُ بها فكلّمَت الرَّسولَ قالت إن أبي كان كذا وكان كذا فذكَرت خِصالَه التي كان يُذكَر بها فقال الرَّسول صلى الله عليه وسلم: "لو كانَ مسلِمًا لَترَحّمنا عليه". رواه البيهقي وابن عساكر.</p>
                <p>الفائدة:</p>
                <p>❌ أنه لا تجوز الرحمة على الميت الكافر.</p>
                <p>لو كانت الرحمة تجوز على الكافر فلمَ أتعب النبي عليه الصلاة والسلام ومعه الصحابة أنفسهم في نشر الإسلام وبث السرايا والبعوث وخوض المعارك من أجل إنقاذ البشر من عبادة الأوثان والعباد إلى عبادة رب العباد؟</p>
                <p>ولكان يكفي لمحمد صلى الله عليه وسلم أن يكتفي بالصلاة والبقاء في المسجد بل في غار حراء ويجنب المسلمين الحروب والغزوات ما دام المسلم والكافر بعد الموت يستويان في الرحمة.</p>
                <p>فالكافر لا رحمة له عند الله بعد موته أبدا أبدا ومن قال بغير ذلك فهو ليس مؤمنا عليه أن ينقذ نفسه بالرجوع الى الإسلام</p>
                <p>قال تعالى {وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ فَسَأَكْتُبُهَا لِلَّذِينَ يَتَّقُونَ وَيُؤْتُونَ الزَّكَاةَ وَالَّذِينَ هُمْ بِآيَاتِنَا يُؤْمِنُونَ الَّذِينَ يَتَّبِعُونَ الرَّسُولَ النَّبِيَّ الْأُمِّيَّ الَّذِي يَجِدُونَهُ مَكْتُوبًا عِنْدَهُمْ فِي التَّوْرَاةِ وَالْإِنجِيل}</p>
                <p>فالرحمة فقط في الآخرة لمن يموت على الإسلام</p>
                <p>اللهم ارزقنا حسن الختام والموت على كامل الإيمان، ءامين</p>`
            },
            {
                id: "s43",
                title: "آية ومعنى (43)",
                icon: "fa-book",
                desc: "قوله تعالى ( إن الله لعن الكافرين وأعد لهم سعيرا خالدين فيها أبدا لا يجدون وليّا ولا نصيرا ) سورة الأحزاب/٦٤-٦٥",
                content: `<p><strong>قوله تعالى ( إن الله لعن الكافرين وأعد لهم سعيرا خالدين فيها أبدا لا يجدون وليّا ولا نصيرا ) سورة الأحزاب/٦٤-٦٥</strong> معناه أن الكفار يخلدون في نار جهنم ولا ينقطع عنهم العذاب في الآخرة، فجهنم باقية لا نهاية لها والكافر لا يخفف عنه العذاب فيها.</p>
                <p>قال الله تعالى: إنّ الله لعنَ الكافرين وأعدّ لهم سعيراً خالدين فيها أبدا لا يجدون وليّا ولا نصيرا .سورة الأحزاب (64-65)</p>
                <p>وقال الله تعالى: ومَنْ لم يؤمن بالله ورسوله فإنا أعتدْنا للكافرين سعيرا .سورة الفتح(13)</p>
                <p>قال الله تعالى: وأمّا الذين فسقوا فمأواهم النار كلما أرادوا أنْ يخرجوا منها أعيدوا فيها وقيلَ لهم ذوقوا عذابَ النار الذي كنتم به تكذبون. سورة السجدة(20)</p>
                <p>معناه لهم عذاب دائم في نكد. لذلك الكفار يوم القيامة بعدما يدخلون جهنم لا تنتهي محاولاتهم للفرار من جهنم، ولكن من دون جدوى. وذلك لأن ملائكة العذاب ترُدّهم. وهذا يدلّ على أنهم في عذاب مستمرّ لا ينتهي</p>
                <p>فالحاصل أنّ الكافر ما دام حَيّا في الدنيا فإنه يتقلب في رحمة الله.</p>
                <p>وأما إذا مات على الكفر فلا يجوز لمنْ عَلِمَ بحاله أنْ يطلب من الله له الرحمة. لأنه يكذب القرءان. ويكذب دين محمّد. ويكذب ما عُلِم من الدين بالضرورة وظهر بين المسلمين وانتشر انشارا لا يُردّ ولا ينفع الجاهل جهله فيما عُلِم من الدين بالضرورة</p>
                <p>دين الله ليس ملعبة، دين الله ليس بالرأي..</p>
                <p>الإيمان هو الأساس، بدون الإيمان لا ينفع الإنسان شىءٌ.</p>
                <p>الرسول أول ما دعا الناس دعاهم إلى الإيمان.</p>
                <p>لما عائشة رضي الله عنها سألت الرسول صلى الله عليه وسلم عن قريب لها يسمى عبد الله بن جدعان، هذا كان رزقه الله رزقًا كثيرًا، كان في الجاهلية قبل بعثة الرسول صلى الله عليه وسلم؛ كان شديد الكرم يوزع الطعام ويضع الطعام في طريق المسافرين ويصل رحمه ويكرم الضيف، فقالت عائشة رضي الله عنها للرسول صلى الله عليه وسلم: إن ابن عمي عبد الله بن جدعان كان يقري الضيف ويصل الرحم ويفعل ويفعل (أي من الإحسانات)، قالت: يا رسول الله، هل ينفعه ذلك؟</p>
                <p>قال: لا لأنه لم يقل يومًا رب اغفر لي خطيئتي يوم الدين.</p>
                <p>معناه لم يكن مسلمًا لم يكن يؤمن بيوم الدين، هو من أهل الفترة قبل البعثة، لكن لا يكتب له حسنات مع أنه قبل بعثة الرسول..</p>
                <p>قال الرسول صلى الله عليه وسلم:</p>
                <p>*"وأما الكافر فيطعم بحسناته في الدنيا حتى إذا أفضى إلى الآخرة لم يكن له منها نصيب"*</p>
                <p>الله لا يرحمه في الآخرة، لا يُدخله الجنة، فلا يجوز الترحم على كافر مات.</p>
                <p>الرسول صلى الله عليه وسلم كان معه سيدنا عمر فقال لعمر:</p>
                <p>*"يا ابن الخطاب نادِ أنه لا يدخل الجنة إلا نفسٌ مؤمنة"*</p>
                <p>ولا يكون شهيدا إلا من شهد بأن لا إله إلا الله محمد رسول الله. ولا يجوز الدعاء بالرحمة والمغفرة والجنة لمن مات على غير دين الإسلام، ولا يجوز الصلاة عليه أيضا.</p>
                <p>هذا من ثوابت العقيدة وأصول الدين.</p>
                <p>قال تعالى في سورة آل عمران آية ٨٥:</p>
                <p>"وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ". صدق الله العظيم</p>
                <p>وقال رسول الله صلى الله عليه وسلم في الحديث الذي رواه الإمام مسلم في صحيحه عن أبي هريرة رضي الله عنه: "والذي نفْسُ محمدٍ بيدِهِ ، لا يسمعُ بي أحدٌ من هذه الأمةِ ، لا يهودِيٌّ ، و لا نصرانِيٌّ ، ثُمَّ يموتُ ولم يؤمِنْ بالذي أُرْسِلْتُ به ، إلَّا كان من أصحابِ النارِ". صدق رسول الله صلى الله عليه وسلم.</p>
                <p>لكن للأسف الميزان اختلّ في هذا الزّمان العجيب الذي نحن فيه، ولو كنتَ وحدك اتبع الحقّ والدّليل ولا تكن من جملة القطيع الذي يُساق إلى الذبح وهو لا يدري.</p>
                <p>والأمر كما أسلفت يحتاج إلى إنصاف وإلى معرفة ودراية بما يُتنازع فيه، فليس للجاهل أن يكون حَكَما في مسائل شرعيّة بل عليه أن يتعلّم ويتّبع الدّليل الواضح القاطع الذي لا لُبس فيه، ولا يحاجج عن غيره بهوى نفس قد يؤدّي به إلى الغوص في الفساد أكثر فأكثر.</p>
                <p>لو نظرت بعد كلمة... أكثرهم ...فى القرآن تجد..</p>
                <p>لا يؤمنون</p>
                <p>لا يعقلون</p>
                <p>لا يفقهون</p>
                <p>لا يعلمون</p>
                <p>لا يعملون</p>
                <p>فلا يهمك كثرة الهالكين وقلة سالكين طريق الحق..</p>
                <p>الجنة لا يدخلها إلا مسلم موحد و لا يقال عن غير المسلم حقا شهيد ولا يجوز الترحم على غيره ومن يكذب يكون عاند القران والدين وكذب الله والرسول وموعده جهنم إن مات على ذلك.</p>
                <p>قول الحق لا يقدم أجلا و لا يمنع رزقا..</p>
                <p>الحمد لله الذي لم يجعلنا من أهل الدنيا السفهاء اللهم حسن الختام.</p>
                <p>وقد نصحناك حامدينَ اللهَ أنْ وفَّقنا إلى ذلك فهنيئًا للرَّاكبين في سفينة النَّجاة واللهُ المُستعان هو نِعمَ المولى ونِعم الوكيل.</p>`
            },

                icon: "fa-book",

                content: `<p><strong>قوله تعالى ( وما يعلم جنود ربك إلا هو ) سورة المدثر/٣١</strong> يعني أن الملائكة الذين خلقهم الله لتعذيب أهل النار لا يعلم عددهم إلا الله، وخزنة النار تسعة عشر ولهم من الأعوان والجنود من الملائكة ما لا يعلم إلا الله، وليس معنى جنود ربك أن الملائكة أعوان الله فالله لا يحتاج أحدا من خلقه.</p>

                <p>الملائكةُ أكثرُ عددًا من أوراقِ الأشجارِ وحباتِ الرمالِ وقطَراتِ الأمطار ، مَن يُحصي ذلك إلا الله!.</p>`

                content: `<p><strong>قوله تعالى ( ووجدك ضالا فهدى ) سورة الضحى/٧</strong> معناه أنك يا محمد لم تكن تدري القرءان وتفاصيل الشرائع فهداك الله أي أرشدك إلى معرفة القرءان وشرائع الإسلام.</p>
                <p>تفسير قوله تعالى (ووجدك ضالا فهدى)</p>
                <p>ووجدك ضالاّ فهدى:فإن سأل سائل فقال:أكان رسول الله صلّى الله عليه وآله ضالاّ قبل ذلك فقل حاشاه مِنْ ذلك ،وفي ذلك اقوالٌ:أحدها أيْ وجدك يا محمد بين قوم ضُلاّل فهداهم الله بك . وقال آخرون :ضلّ ذات يوم عن عمّه أبي طالب فحزن ثمّ وجده.وقال آخرون هذا مثل قوله : وعلّمك ما لم تكن تعلم 113 النساء. فأمّا الضلال الذي هو ضدّ الإيمان فحاشاه صلّى الله عليه وسلّم أن يكون ضلّ طرْفة عين. ألم تسمعْ إلى قوله عزّ وجلّ: والنجمِ إذا هوى . ما ضلّ صاحبُكمْ وما غوى\_ سورة الضحى من كتاب إعراب ثلاثين سورة من القرآن الكريم للحسين بن أحمد إبن خالويه المُتوفّى سنة 370 هجرية رحمه الله تعالى</p>`

            {
                id: "s46",
                title: "آية ومعنى (46)",
                icon: "fa-book",
                desc: "قوله تعالى ( وكلم الله موسى تكليما ) سورة النساء/١٦٤",
                content: `<p><strong>قوله تعالى ( وكلم الله موسى تكليما ) سورة النساء/١٦٤</strong> معناه أن الله تعالى أسمع موسى كلامه الأزلي الأبدي الذي لا يشبه كلام المخلوقين، فالله متصف بكلام ليس حرفا وليس صوتا وليس لغة ليس ككلام خلقه.</p>
                <p>( وكلم الله موسى تكليما ) معناه أن الله أزال الحجاب عن سمع سيدنا موسى فسمع كلام الله الأزلي الذي ليس حرفا ولا صوتا ولا لغة.</p>
                <p>اللهُ تبارك وتعالى يُقالُ لهُ: ( متكلمٌ )ولا يقال له: (ناطقٌ) لأن كلامه ليس حرفًا ولا صوتًا</p>
                <p>لو كان كلامُه حرفًا وصوتًا لقيل له: (نَاطقٌ يَنطِقُ) لكنْ ما ورد في القرءانِ ولا في الحديثِ: (اللهُ نَاطِقٌ) أوْ ( اللهُ يَنطِقُ)</p>
                <p>إنما ورد في القرءان:</p>
                <p>"وكلّم اللهُ موسَى تكليمًا".</p>
                <p>اللهُ أمر موسى بالوحيِ أن يذهب إلى جبل الطور، فمكث هناك أربعينَ ليلة.ً اللهُ أسمَعهُ كلامَهُ الذي ليسَ حَرفًا ولا صَوتًا. اللهُ تعالى أسمَعَ الرسولَ محمدًا كلامَه الذي ليس حرفًا ولا صوتًا ليلة المعراج.</p>
                <p>أما جبريلُ فهو يُبلغُ الوحيَ للأنبياء، كُلُّ الأنبياءِ هو نزلَ عليهِم. جبريلُ يَسمعُ كلامَ اللهِ فيبلغُ الأنبياءَ ثم الأنبياءُ يُبلغون أمَمَهُم.</p>
                <p>كلامُ اللِه الذي ليسَ حرفًا ولا صوتًا لا نَستطيعُ أنْ نتَصورَه بالنفسِ؛ كمَا أنَّهُ لا يُمكنُ تَصَورُ ذاتِ اللهِ في النفسِ.</p>
                <p>لكنْ يومَ القيامةِ كُلُّ الناسِ يَسمعونَ كلامَ الله:</p>
                <p>■ فالكافِرُ يسمَعُ كَلامَ الله فينزعجُ يرتعدُ خَوفًا مِن سماعِه لكلامِ الله .</p>
                <p>■ أما المؤمنُ التقيُّ عندما يسمَعُ كَلامَ الله يزدادُ فَرحًا.</p>
                <p>📌والقرءانُ الكريم والإنجيلُ والتوراة والزبور وكلُّ الكتب السماوية مكتوبة في اللوح المحفوظ. بقدرة الله جرى القلم، من غير إمساك كما يُمسِكُ الإنسانُ القلمَ،</p>
                <p>لأنَّ اللهَ لا يَمَسُّ ولا يُمَسُّ، لأنه ليسَ حَجمًا.</p>
                <p>اللهُ تعالى يَخلقُ بلا ءالةٍ ولا مباشرةٍ، لأنه ليس حجمًا لطيفًا ولا حجمًا كثيفًا.</p>
                <p>كتب القلمُ هذه الكتب ثم أمرَ اللهُ جبريلَ بعد أن خلق الأنبياء: خذ هذا الكتابَ وأنزِلْه على فلانٍ النبيِّ؛ فيُنزلهُ جبريلُ حتى كان ءاخِرَ ما أنزله القرءانُ الكريم، أنزله على محمدٍ صلى الله عليه وسلم.</p>
                <p>جبريلُ قرأه علَى محمدٍ بالحرفِ والصوتِ ليس اللهُ يقرؤُهُ بالحرفِ والصوتِ كما نقرأ نحنُ، لو كان اللهُ يقرأُ بالحرفِ والصوتِ لكانَ مِثلَنا.</p>`
            },

                icon: "fa-book",
                desc: "قوله تعالى ( قل هو الله أحد )",
                content: `<p><strong>قوله تعالى ( قل هو الله أحد )</strong> قُلْ أَيْ يَا مُحَمَّدُ هُوَ اللهُ أَحَدٌ، قَالَ الْبُخَارِيُّ فِي صَحِيحِهِ أَحَدٌ أَيْ وَاحِدٌ، أي الذي لا يَقْبَلُ التَّعَدُّدَ والكَثْرَةَ ولَيْسَ لَهُ شَرِيكٌ في الذَّاتِ أَو الصّفَاتِ أَو الأَفْعَالِ، وَلَيْسَ لأَحَدٍ صِفَةٌ كَصِفَاتِه، بَلْ قُدْرَتُه تَعَالى قُدْرَةٌ وَاحِدَةٌ يَقْدِرُ بِهَا عَلَى كُلِّ شَىءٍ وعِلْمُهُ وَاحِدٌ يَعْلَمُ به كُلَّ شَىءٍ. فَاللهُ تَعَالَى وَاحِدٌ لا شَرِيكَ لَهُ وَلا شَبِيهَ لَهُ وَلا وَزِيرَ لَهُ لا يُشْبِهُ شَيْئًا وَلا يُشْبِهُهُ شَىْءٌ وَهُوَ خَالِقُ كُلِّ شَىْءٍ.</p>`
            },
            {
                id: "s48",
                title: "آية ومعنى (48)",
                icon: "fa-book",
                desc: "قوله تعالى ( الله الصمد ) سورة الإخلاص/٢",
                content: `<p><strong>قوله تعالى ( الله الصمد ) سورة الإخلاص/٢</strong> معناه أن الله تعالى هو الذي يُحتاج له في الأمور كلها وأما الله فلا يحتاج أحدا من خلقه، فالله هو المستغني عن كل ما سواه، ولا يحتاج للعرش ولا للسماء ولا للملائكة.</p>
                <p>قَوْلُهُ تَعَالَى: {اللهُ الصَّمَدُ } (2) أيِ الذي تَفتَقِرُ إِليه جَمِيْع المَخلُوقَاتِ، معَ استِغْنَائِه عنْ كُلِّ مَوْجودٍ، والذي يُقْصَدُ عندَ الشّدَّةِ بجَميعِ أنْواعِها ولا يَجْتَلِبُ بخَلْقِه نَفْعًا لِنَفْسِه ولا يَدْفَعُ بِهمْ عنْ نَفْسِه ضرًّا. أي مُستغْنٍ عنْ كُلِّ شىءٍ وكُلُّ شىءٍ يحتاجُ إليه.</p>`
            },
            {
                id: "s49",
                title: "آية ومعنى (49)",
                icon: "fa-book",
                desc: "قوله تعالى ( لم يلد ولم يولد )",
                content: `<p><strong>قوله تعالى ( لم يلد ولم يولد )</strong> نَفْيٌ لِلْمَادّيَّةِ والانْحِلالِ وَهُوَ أَنْ يَنْحَلَّ مِنْهُ شَىءٌ أَوْ أَنْ يَحُلَّ هًوَ في شَىءٍ. أيْ أنَّه ليسَ أبًا ولا ابنًا.</p>
                <p>وَمَا وَرَدَ في كتاب "مَوْلِدِ العَرُوسِ" مِنْ أنَّ اللهَ تَعالى قَبَضَ قَبْضَةً مِن نُورِ وجْهِهِ فَقَالَ لها كُوْنِي مُحمَّدًا فَكَانَتْ مُحمَّدًا فَهذِه مِنَ الأَبَاطِيلِ المَدْسُوسَةِ، وحُكْمُ مَنْ يَعْتَقِدُ أنَّ مُحمَّدًا صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ جُزْءٌ مِنَ اللهِ تَعَالى التَّكْفِيرُ قَطْعًا، وكَذَلِكَ الذي يَعْتَقِدُ في المَسِيحِ أنَّه جُزْءٌ منَ اللهِ.</p>
                <p>وليسَ هذا الكتاب لابنِ الجَوزيّ رحمهُ اللهُ ولم يَنسُبْهُ إليهِ إلا المُستَشرِق برُوكلمَان.</p>`
            },
            {
                id: "s50",
                title: "آية ومعنى (50)",
                icon: "fa-book",
                desc: "قوله تعالى ( ولم يكن له كفوا أحد )",
                content: `<p><strong>قوله تعالى ( ولم يكن له كفوا أحد )</strong> أيْ لا نَظِيْرَ لَهُ بِوَجْهٍ منَ الوُجُوهِ. أيْ لا شَبِيهَ لَهُ.</p>
                <p>(1) أخرجَ البيهقيُّ في الأسماءِ والصّفاتِ عَنِ ابْنِ عَبَّاسٍ، أَنَّ الْيَهُودَ، جَاءَتِ النَّبِيَّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ مِنْهُمْ كَعْبُ بْنُ الْأَشْرَفِ وَحُيَيُّ بْنُ أَخْطَبَ، فَقَالُوا: يَا مُحَمَّدُ، صِفْ لَنَا رَبَّكَ الَّذِي بَعَثَكَ. فَأَنْزَلَ اللهُ عَزَّ وَجَلَّ: {قُلْ هُوَ اللهُ أَحَدٌ اللهُ الصَّمَدُ، لَمْ يَلِدْ} [الإخلاص: 2] فَيَخْرُجُ مِنْهُ {وَلَمْ يُولَدْ} [الإخلاص: 3]فَيَخْرُجُ مِنْ شَيْءٍ، {وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ} [الإخلاص: 4]وَلَا شَبَهٌ. فَقَالَ: «هَذِهِ صِفَةُ رَبِّي عَزَّ وَجَلَّ وَتَقَدَّسَ عُلُوًّا كَبِيرًا»</p>`
            },
            {
                id: "s51",
                title: "آية ومعنى (51)",
                icon: "fa-book",
                desc: "قوله تعالى ( وهو السميع البصير ) سورة الشورى/١١",
                content: `<p><strong>قوله تعالى ( وهو السميع البصير ) سورة الشورى/١١</strong> معناه أن الله تعالى متصف بالسمع والبصر، والله يسمع كل المسموعات بلا حاجة إلى أذن ولا ءالة أخرى، سمعه ليس كسمعنا، ويرى كل المبصرات بلا حاجة إلى حدقة ولا عين جارحة، بصره ليس كبصرنا.</p>
                <p>الله تبارك وتعالى قال: {لَيْسَ كَمِثْلِهِ شَيءٌ وَهُوَ السَّمِيعُ البَصِير} اللهُ تعالى ذكَر التّنزيهَ قَبلَ إثباتِ السَّمْع والبَصَر حتى لا يتَوَهَّم متوهم أنّ سَمعَه تعالی كسَمْع غَيرِه وأنّ بَصرَه كبصَر غَيرِه، لأنّ سَمعَه وبصرَه سبحانه أزليّان أبديّان.</p>
                <p>اللهُ تعالى بما أنّه ذاتٌ ليسَ حَجمًا كثيفًا ولا لطِيفًا ولا صَغِيرا ولا كبيرا لا يَكونُ ذاتُه كذَواتِ غَيرِه.</p>
                <p>الحَجمُ إن كانَ لَطِيفًا وإن كانَ كثِيفًا لهُ صفاتٌ، ومِن صِفاتِه الحركةُ والسُّكُون.</p>
                <p>النّورُ والظّلام والرّيحُ لهُ امتِدادٌ، مِقدارٌ مِنَ الفَراغ يَنتَهِي إليه. هذا معنی الامتداد.</p>
                <p>قال الامام الطحاوي: ومن وصف الله بمعنی من معاني البشر فقد كفر.</p>`
            },
            {
                id: "s52",
                title: "آية ومعنى (52)",
                icon: "fa-book",
                desc: "قوله تعالى ( هو الأول والآخر ) سورة الحديد/٣",
                content: `<p><strong>قوله تعالى ( هو الأول والآخر ) سورة الحديد/٣</strong> فالله هو الأول الذي لا بداية لوجوده فهو وحده القديم الأزلي الذي ليس لوجوده ابتداء وكذلك هو الآخر الذي لا نهاية لوجوده فلا يفنى فهو الأبدي الذي ليس لوجوده انتهاء، وكذلك سائر صفاته أزلية أبدية.</p>
                <p>قال الله تعالى: {هُوَ الأَوَّلُ وَالآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ} [سورة الحديد/ 3]</p>
                <p>قال الطبري في تفسيره: "فلا شىء أقرب إلى شىء منه، كما قال: {وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ} [سورة ق/ 16]".</p>
                <p>أي أن الطبري نفى القُرْبَ الحِسِّي الذي تقول به المجسمةُ، أما القرب المعنوي فلا يَنفيه، وهذا دليل على تنزيه الله عن المكان والجهة. فالله تعالى هو الأول أي الأزلي الذي لا ابتداء لوجوده، كان ولم يكن مكانٌ ولا زمان ثم خلق الأماكنَ والأزمنة ولا يزال موجودًا بلا مكان، ولا يطرأ عليه تغيّر لا في ذاته ولا في صفاته.</p>
                <p>﴿ هُوَ ٱلْأَوَّلُ وَٱﻵخِرُ وَٱلظَّٰٰاهِرُ وَٱلْبَاطِنُ وَهُوَ بِكُلِّ شَىْءٍ عَلِيمٌ ﴾</p>
                <p>[سورة الحديد/٣]</p>
                <p>قَالَ النَّسَفيُّ فِي تَفسيرِهِ:</p>
                <p>{ هُوَ الأَوَّلُ } هُوَ الْقَدِيمُ الَّذِي كَانَ قَبْلَ كُلِّ شَيْءٍ،</p>
                <p>{وَالآخِرُ } اَلَّذِي يَبْقَى بَعْدَ هَلاكِ كُلِّ شَيْءٍ،</p>
                <p>{وَالظَّاهِرُ } بِاﻷدِلَّةِ الدَّالَّةِ عَلَيْهِ،</p>
                <p>{وَالْبَاطِنُ} لِكَوْنِهِ غَيْرَ مُدْرَكٍ بِالْحَوَاسِّ وَإِنْ كَانَ مَرْئِيًّا، وَالْوَاوُ الْأُولَى مَعْنَاهَا الدَّلَالَةُ عَلَى أَنَّهُ الْجَامِعُ بَيْنَ الصِّفَتَيْنِ؛ الْأَوَّلِيَّةِ وَالْآخِرِيَّةِ؛ وَالثَّالِثَةُ عَلَى أَنَّهُ الْجَامِعُ بَيْنَ الظُّهُورِ وَالْخَفَاءِ؛ وَأَمَّا الْوُسْطَى؛ فَعَلَى أَنَّهُ الْجَامِعُ بَيْنَ مَجْمُوعِ الصِّفَتَيْنِ الْأُولَيَيْنِ وَمَجْمُوعِ الصِّفَتَيْنِ الْأُخْرَيَيْنِ؛ فَهُوَ الْمُسْتَمِرُّ الْوُجُودِ فِي جَمِيعِ الْأَوْقَاتِ الْمَاضِيَةِ وَالْآتِيَةِ وَهُوَ فِي جَمِيعِهَا ظَاهِرٌ وَبَاطِن.</p>
                <p>(فالوَصفُ إِذا أُطلِقَ عَلَى اللهِ تَجَرَّدَ عَنِ الزَّمَانِ وأفادَ مَعنَى اﻷزَلِيَّةَ والدَّوَامِ.</p>
                <p>وَقِيلَ: "اَلظَّاهِرُ": اَلْعَالِي عَلَى كُلِّ شَيْءِ؛ الْغَالِبُ لَهُ؛ مِنْ "ظَهَرَ عَلَيْهِ"؛ إِذَا عَلَاهُ وَغَلَبَهُ؛</p>
                <p>وَ"اَلْبَاطِنُ": اَلَّذِي بَطَنَ كُلَّ شَيْءِ؛ أَيْ: عَلَمَ بَاطِنَهُ؛ وَهُوَ بِكُلِّ شَيْءٍ عَلِيمٌ </p>
                <p>فمَعْنَى الأَوَّلِ إِذَا أُطْلِقَ عَلَى اللَّهِ الَّذِي لا ابْتِدَاءَ لِوُجُودِهِ فَهُوَ وَحْدَهُ الأَوَّلُ بِهَذَا الْمَعْنَى، قَالَ تَعَالَى:</p>
                <p>﴿هُوَ اْلأَوَّلُ وَاْلآخِرُ﴾</p>
                <p>[سُورَةَ الْحَدِيد/ ٣]،</p>
                <p>فأولية الله مطلقة، أما الأولية بالنسبة للمخلوق هي أولية نسبية.</p>
                <p>مثلًا يقال: سيدُنا ءَادَمُ أولُ إنسانٍ.</p>
                <p>قال الإمام النسفيُّ رحمه الله عَنْ تنزيهِ اللِهِ عنِ الزمانِ:</p>
                <p>[《وَلا يَجْرِي عَلَيْهِ زَمَانٌ》].</p>
                <p>مَعنَاهُ أنَّ الزمَانَ عندَ أهلِ الحقِّ مُقارَنةُ مُتجددٍ بِمُتجددٍ ءاخر، أو بِعبارةٍ أُخرَى متجدِّدٌّ يُقَدَّرُ بهِ مُتَجدِّدٌ ءاخَرُ، يعني أنتَ عندَما تَقولُ:</p>
                <p>[(أنا استغرقْتُ في هذا العَملِ سَاعَةً)]</p>
                <p>يعنَي أنا استَمرَرْتُ في هَذا العملِ مُدةً أَقِيسُها بِذِهني بِمُدةِ دوَرانِ عقربِ الدقائقِ في الساعَةِ الفلكية دورةً كاملةً، فَدَورانُ العقرب شيءٌ متجددٌ وعملُكَ متجدِّدٌ، فقارنْتَ متجددًأ بمتجَددٍ ءاخَرَ، عملُكَ اقترَنَ استَمَرَّ نفسَ مدةِ دورانِ عقربِ الدقائقِ دورةً كاملةً، عَملُكَ قارنَ هَذا ، إلَى اﻵن مضَتْ ساعةٌ مِن أولِ ابتداءِك بالعَمَل، فالزمان هو هذا، فالزمان هو مقارنةُ متجددٍ بمتجددٍ ءاخَر، أو تقديرُ متجددٍ بمتجددٍ ءاخَر ﻹزالةِ اﻹبهامِ عنِ اﻷول بالثاني.</p>
                <p>مَثلًا تَقول: (النبيُّ محمدٌ صلى الله عليه وسلم وُلِدَ بمَكةَ) فإنْ قِيلَ : مَتَى وُلِدَ النبيُّ محمدٌ صلى الله عليه وسلم؟</p>
                <p>فالجوابُ: (وُلدَ يومَ الاِثنينِ في الثاني عَشَرَ مِن شهرِ ربيعٍ الأولِ عَامَ الفيلِ).</p>
                <p>فبِالنَسبةِ لِلمستَمِعِ يُقالُ للبصيرِ الذي يَسألُ : (متَى جَاءَ زيدٌ؟)</p>
                <p>الجَوابُ: (جَاءَ زَيدٌ عِندَ طُلوعِ الشمسِ)</p>
                <p>فهُنا أُزيلَ اﻹبهَامُ عَن وَقتِ مَجيءِ زَيدٍ بطلوعِ الشمسِ،</p>
                <p>أما بالنسبةِ للأعمَى فالجوابُ له عندَما يسألُ :متَى طلَعَتِ الشمسُ؟ ﻷنهُ لا يَرى ضَوءَها</p>
                <p>الجوابُ: ( طلَعتْ الشَّمسُ لَمَّا جَاءَ زيدٌ).</p>`
            },
            {
                id: "s53",
                title: "آية ومعنى (53)",
                icon: "fa-book",
                desc: "قوله تعالى ( ولله المثل الأعلى ) سورة النحل/٦٠",
                content: `<p><strong>قوله تعالى ( ولله المثل الأعلى ) سورة النحل/٦٠</strong> أي لله الوصف الذي لا يشبه وصف غيره، فالله تعالى موصوف بصفات الكمال اللائقة به وهو منزه عن كل نقص سبحانه وتعالى كالجسم والعجز والجهل والمكان والحيز.</p>
                <p>قال المفسِّرُ اللغويُّ أبو حيّان الأندلسيّ في تفسيره [النّهر الماد]: "{وَللهِ الْمَثَلُ الْأَعْلَىٰ} أيِ الصّفة العليا من تنـزيهه تعالى عن الولد والصّاحبة وجميع ما تنسب الكفرةُ إليه ممّا لا يليق به تعالى كالتّشبيه والانتقال وظهوره تعالى في صورة" اهـ.</p>`
            },
            {
                id: "s54",
                title: "آية ومعنى (54)",
                icon: "fa-book",
                desc: "قوله تعالى ( ولقد كتبنا في الزبور من بعد الذكر أن الأرض يرثها عبادي الصالحون ) سورة الأنبياء",
                content: `<p><strong>قوله تعالى ( ولقد كتبنا في الزبور من بعد الذكر أن الأرض يرثها عبادي الصالحون ) سورة الأنبياء</strong></p>
                <p>قال ابن جرير الطبري {وَلَقَدْ كَتَبْنَا فِي الزَّبُورِ مِنْ بَعْدِ الذِّكْرِ أَنَّ الأَرْضَ} يعني بذلك أن أرض الجنة {\...يَرِثُهَا عِبَادِيَ} - أي - العاملون بطاعته المنتهون إلى أمره ونهيه»، ثم قال: «وقد ذكرنا قول من قال أن الأرض يرثها عبادي الصالحون أنها أرض الأمم الكافرة ترثها أمة محمد صلى الله عليه وسلم، وهو قول ابن عباس الذي روى عنه علي بن أبي طلحة» اهـ.</p>
                <p>وقال الإمام أبو منصور الماتريدي : «قال عامة أهل التأويل: هي الجنة، أخبر أن الجنة إنما {يَرِثُهَا عِبَادِيَ الصَّالِحُونَ} ، وهو ما ذُكر في آية أخرى {أُولَئِكَ هُمُ الْوَارِثُونَ الَّذِينَ يَرِثُونَ الْفِرْدَوْسَ هُمْ فِيهَا خَالِدُونَ } [سورة المؤمنون] ، فيكون هذا تفسيرًا لذلك».</p>`
            },
            {
                id: "s55",
                title: "آية ومعنى (55)",
                icon: "fa-book",
                desc: "معنى قوله: (وروحٌ منه)",
                content: `<p><strong>معنى قوله: (وروحٌ منه)</strong></p>
                <p>قال الله تعالى: (وروحٌ منه) [النساء: 171]. ومعناها أن روح المسيح روح خلقها الله وشرَّفها، فهي من عند الله تعالى خلقًا وتكوينًا ومشرفة عند الله عز وجل. الإضافة هنا إضافة ملكية وتعظيم، وليست إضافة جزئية.</p>
                <p>ليس المقصود أن المسيح جزء من الله تعالى، لأن الله سبحانه وتعالى ليس أصلًا لغيره ولا هو فرع عن غيره. الله عز وجل ليس روحًا ولا جسدًا. قال الله تعالى: ﴿لَمْ يَلِدْ وَلَمْ يُولَدْ * وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ﴾ [الإخلاص: 3-4].</p>`
            },
            {
                id: "s56",
                title: "آية ومعنى (56)",
                icon: "fa-book",
                desc: "قوله تعالى ( وأشرقت الأرض بنور ربها ) الزمر/٦٩",
                content: `<p><strong>قوله تعالى ( وأشرقت الأرض بنور ربها ) الزمر/٦٩</strong> أي بحُكم الله، هذا عن يوم القيامة، لأنه في يوم القيامة لا يُوجد هناك إلا الحكم الذي هو الحقّ. وليس معناه أن الله ضوء فربنا تعالى هو الذي خلق النور والظلام، قال سبحانه وتعالى : "ولله المثل الأعلى" ( النحل / 60) أي الوصف الذي لا يشبه وصف غيره. قال القرطبيّ: "ومعنى بنور ربّها: بعدل ربّها. وقاله الحسن وغيره. وقال الضحاك بحكم ربّها والمعنى واحد، أي أنارت وأضاءت بعدل الله وقضائه بالحقّ بين عباده، والظلم ظلمات والعدل نور".اهـ</p>`
            },
            {
                id: "s57",
                title: "آية ومعنى (57)",
                icon: "fa-book",
                desc: "قوله تعالى ( وأن إلى ربك المنتهى )",
                content: `<p><strong>قوله تعالى ( وأن إلى ربك المنتهى )</strong> معنى هذه الآية أن الله تبارك وتعالى لا يصل إليه فكر الإنسان أي لا يمكن أن يتصوره فكر الإنسان، أن يتصور الله فكر الإنسان لا يمكن، فكر البشر يصل إلى المخلوقات فقط، لماذا؟ لأن الله ليس له شبيه ولا يشبه شيئًا من العوالم التي يعرفها الإنسان، الإنسان يعرف العالم الكثيف والعالم اللطيف. العالم الكثيف هذه الأشياء التي لها حجم يضبط باليد كالشجر والحجر والشمس والقمر والإنسان والبهائم، والعالم اللطيف هو المخلوق الذي لا يضبط باليد كالنور والظلام. ثم هذان النوعان الكثيف واللطيف كل له صفات، كل من النوعين اللطيف والكثيف له صفات، من جملتها التحيز في جهة ومكان والحركة والسكون والانفعال واللون، هذه صفات العالم. الله تعالى ليس كالعالم اللطيف ولا كالعالم الكثيف، ولا يتصف بصفات العالم اللطيف والعالم الكثيف، ليس جسمًا له حد ومقدار، لا حد صغير ولا حد كبير، الله تعالى ليس كأصغر حجم الذي هو في منتهى القلة، في منتهى الصغر، ولا هو كأكبر حجم وهو العرش، ولا هو حجمًا أوسع من العرش، حتى إنه لا يجوز أن يعتقد أن الله حجم لا نهاية له، كل هذا من صفات الخلق. الخلق إما أن يكون حجمه صغير أو حجمه كبير أو وسط بين الصغير والكبير، وإما أن يكون متحركًا وإما أن يكون ساكنًا، النجوم دائمًا تتحرك كل نجم يتحرك، حتى النجم الذي لا يرى الإنسان حركته له حركة بطيئة. وقسم من العالم ساكن دائمًا، السموات والعرش ساكنون. ثم كل من هذه العوالم له حجم مخصوص وشكل مخصوص، الله ليس كذلك، ليس كشىء من ذلك، لذلك لا يمكن تصور الله تعالى. الإنسان مهما حاول أن يتصور الله فليس هذا الذي يتصوره الله، الله تعالى خلق العرش ليكون كعبة للملائكة، الملائكة الذين حول العرش يطوفون كما نحن نطوف بالكعبة التي في مكة ليس لأن الله يسكن العرش يطوفون حوله أولئك الملائكة، وهذه الكعبة ليس لأن الله يسكنها أو هو قاعد على أعلاها يطوف المؤمنون بها. الله تعالى ليس شيئًا حجمًا صغيرًا ولا كبيرًا ولا حجمًا لطيفًا ولا حجمًا كثيفًا، الحجم هو الذي يأخذ مكانًا وجهة، الشمس لها جهة ومكان في الفضاء، والعرش له جهة ومكان، جهة فوق، والإنسان والجن والبهائم لهم جهة ومكان، وهي هذه الأرض، جهة التحت، بالنسبة للعرش الأرض جهتها تحت. فالله تبارك وتعالى بما أنه لا يشبه شيئًا لذلك لا ينتهي إليه الفكر، لا يصل إليه الفكر، لا يدرك الله تعالى أفكار الخلق لا تدركه، هذا معنى هذه الآية ﴿وَأَنَّ إِلَى رَبِّكَ الْمُنتَهَى﴾ قال سيدنا أبيُ بن كعب رضي الله عنه الذي هو أحد مشاهير الصحابة في تفسير هذه الآية "إليه انتهى فكر من تفكر"، معناه الفكر لا يُدرك الله إنما الفكر في المخلوقات. المؤمن يكفيه أن يعتقد أن الله موجود من غير أن يتصور أنه في جهة فوق أو جهة تحت أو أنه جسم كبير لطيف كالنور أو الهواء، ومن غير أن يتصور أنه جسم كثيف كالشمس والقمر والإنسان، من غير أن يكون متحيزًا في جهة ومكان، من غير أن يكون متحركًا أو ساكنًا، هو موجود من غير أن يكون كذلك، هذه هي معرفة الله، هذا هو الإيمان بالله. أما الذي يعتقد أن الله جسم قاعد على العرش مالئ للعرش أو على بعض العرش ليس على كله، هؤلاء ما عرفوا الله. هذا التفسير الذي ذكرناه عن سيدنا أبيِّ بن كعب معناه مثل هذه الآية ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾. ويوجد عالم جليل ولي من أولياء الله من التابعين ليس من الصحابة فسر هذه الآية كما فسر أبي بن كعب، يقال له عبد الرحمن بن أبي نُعُم، هذا عبد الرحمن بن أبي نُعُم قال مثل ما قال أُبي بن كعب في تفسير الآية، قال إليه انتهى فكر من تفكر. هذا عبد الرحمن بن أبي نُعُم كان من أعبد الناس، من أعبد الناس أي من أكثر الناس اشتغالًا بالعبادة، حتى قال بعض العلماء الذين كانوا في عصره لو قيل لعبد الرحمن بن أبي نُعُم تقبض روحك غدًا ما بقي لك إلا هذا النهار لا يجد زيادة في الاجتهاد في الطاعة أكثر مما كان عليه.</p>
                <p>ثم إنه كان الحجاج أخذ عبد الرحمن بن أبي نعم قال حطوه في السجن احبسوه ولا تفتحوا حتى يموت جوعًا، خمسة عشر يومًا تركوه في الحبس، ثم قال لهم افتحوا ادفنوه ظن أنه مات، لما فتحوا الباب وجدوه قائمًا يصلي ما أثر فيه الجوع، عاش خمسة عشر يومًا لا يأكل ولا يشرب وما فتر عن الصلاة، عن الاجتهاد في العبادة ما فتر، الله تعالى أعطاه قوة بغير أكل بغير شرب.</p>`
            },
            {
                id: "s58",
                title: "آية ومعنى (58)",
                icon: "fa-book",
                desc: "تفسير قوله عز وجل ( وأنه هو رب الشعرى )",
                content: `<p><strong>تفسير قوله عز وجل ( وأنه هو رب الشعرى )</strong></p>
                <p>كلمة ءالهة جمع إله، ولا يوجد إلا إله واحد، يقال الله إلهنا، الله إله واحد، أما المعبودات التي يعبدها الكفار يقال لها ءالهتهم، لا يقال لها ءالهة بمعنى إثبات الألوهية لها، بل بمعنى أنها عبدت من دون الله، عبدها الكفار. كلمة إله، الإله هو الله لكن الكفار أخذوا اسم الإله للأشياء التي عبدوها، مجموعها جملتها يقال ءالهتهم، ثم هذه الآلهة قسمان، قسم بشر عبدهم بعض البشر، وقسم أحجار ونجوم. بعض العرب الأول كانوا يعبدون نجمًا اسمه الشِعرَى وهو النجم الذي قال الله في القرءان ﴿وَأَنَّهُ هُوَ رَبُّ الشِّعْرَى﴾ معناه أنا خالق الشعرى التي يعبدها أولئك الكفار، وقسم يعبدون هؤلاء السبعة الشمس والقمر وزحل وعطارد والمشتري ومريخ والزهرة. وقسم يعبدون أشخاصًا، هذا بوذا، بوذا شخص من بني ءادم يعبده اليابان والصين وغيرهم. كذلك يوجد غير بوذا من البشر الذين عبدهم الكفار، هؤلاء الذين عبدهم الكفار وهم من جماد، ذهب أو فضة أو حجر أو شجر، يوم القيامة يُرمَون في جهنم مع الذين يعبدونهم في الدنيا، وهناك أناس ليسوا كفارًا عبدهم الكفار، هؤلاء لا يشاركونهم في الآخرة بما يصيبهم من العذاب كسيدنا عيسى. عيسى ليس هو أمرهم بعبادته بل أمرهم بعبادة الله وحده فخالفوه هو لا يشاركهم في عذاب الآخرة. كذلك كان رجل اسمه عُزير يجوز أن يكون بلغ إلى النبوة، ويجوز أن يكون لم يبلغ درجة النبوة، يجوز أن يكون لم يدخل في النبوة. هذا أيضًا اليهود في القديم عبدوه كانوا يقولون ابن الله. ويوجد غير سيدنا عيسى وعزير من البشر الذين هم من عباد الله الصالحين عبدهم الكفار كعلي بن أبي طالب، هؤلاء لا يشاركون الذين عبدوهم في العذاب والخزي، خزي يوم القيامة.</p>
                <hr>
                <p>هذا العمل إهداء إلى روح والدي سمير عبد الكريم ضبان</p>
                <p>الرجاء الدعاء له وقراءة الفاتحة لله تعالى</p>`
            }
        ];

        // ============================================================
        //  APP STATE
        // ============================================================
        let currentFont = localStorage.getItem('quranFont') || 'Amiri';
        let fontSize = parseInt(localStorage.getItem('quranFontSize')) || 16;
        let currentTheme = localStorage.getItem('quranTheme') || 'light';
        let favorites = JSON.parse(localStorage.getItem('quranFavorites') || '[]');

        // ============================================================
        //  DOM REFS
        // ============================================================
        const sectionsGrid = document.getElementById('sectionsGrid');
        const homePage = document.getElementById('homePage');
        const articlePage = document.getElementById('articlePage');
        const articleTitle = document.getElementById('articleTitle');
        const articleContent = document.getElementById('articleContent');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const backBtn = document.getElementById('backToHome');
        const themeToggle = document.getElementById('themeToggle');
        const toast = document.getElementById('toast');

        // ============================================================
        //  HELPERS
        // ============================================================
        function setFont(font) {
            currentFont = font;
            document.documentElement.style.setProperty('--font-family', `'${font}', sans-serif`);
            localStorage.setItem('quranFont', font);
            document.querySelectorAll('.font-switcher button').forEach(btn => {
                btn.classList.toggle('active-font', btn.dataset.font === font);
            });
        }

        function setFontSize(size) {
            fontSize = Math.min(28, Math.max(12, size));
            document.documentElement.style.setProperty('--article-font-size', fontSize + 'px');
            localStorage.setItem('quranFontSize', fontSize);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('quranTheme', currentTheme);
            themeToggle.innerHTML = currentTheme === 'light' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ============================================================
        //  RENDER SECTIONS
        // ============================================================
        function renderSections(filter = '') {
            const q = filter.trim().toLowerCase();
            let html = '';
            let found = 0;
            sectionsData.forEach(s => {
                const match = s.title.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q) || s.content.toLowerCase().includes(q);
                if (q && !match) return;
                found++;
                const iconClass = s.icon ? `fa-${s.icon}` : 'fa-book';
                html += `
                    <div class="section-card" data-id="${s.id}" data-title="${s.title}" data-desc="${s.desc}" >
                        <div class="icon"><i class="fas ${iconClass}"></i></div>
                        <h3>${s.title}</h3>
                        <p>${s.desc}</p>
                        <span class="badge">${s.title.replace('آية ومعنى ','')}</span>
                    </div>
                `;
            });
            sectionsGrid.innerHTML = html || `<p style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد نتائج مطابقة للبحث</p>`;

            // Click handlers
            document.querySelectorAll('.section-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const section = sectionsData.find(s => s.id === id);
                    if (section) openArticle(section);
                });
            });
        }

        // ============================================================
        //  OPEN / CLOSE ARTICLE
        // ============================================================
        function openArticle(section) {
            articleTitle.textContent = section.title;
            // Format content: preserve paragraphs
            let contentHtml = section.content;
            // Wrap in div with arabic-text class for Amiri
            articleContent.innerHTML = `<div class="arabic-text" style="font-family:'Amiri',serif">${contentHtml}</div>`;
            // Re-apply font size
            articleContent.style.fontSize = fontSize + 'px';
            articleContent.style.fontFamily = "'Amiri', serif";
            homePage.style.display = 'none';
            articlePage.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Update fav button
            const favBtn = document.getElementById('favArticle');
            const isFav = favorites.includes(section.id);
            favBtn.classList.toggle('fav-active', isFav);
            favBtn.innerHTML = isFav ? '<i class="fas fa-heart"></i>' : '<i class="fas fa-heart"></i>';
        }

        function closeArticle() {
            articlePage.classList.remove('active');
            homePage.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ============================================================
        //  FAVORITES
        // ============================================================
        function toggleFav(sectionId) {
            const idx = favorites.indexOf(sectionId);
            if (idx > -1) {
                favorites.splice(idx, 1);
                showToast('تم إزالة المقال من المفضلة');
            } else {
                favorites.push(sectionId);
                showToast('تمت إضافة المقال إلى المفضلة');
            }
            localStorage.setItem('quranFavorites', JSON.stringify(favorites));
            const favBtn = document.getElementById('favArticle');
            const isFav = favorites.includes(sectionId);
            favBtn.classList.toggle('fav-active', isFav);
        }

        // ============================================================
        //  COPY / SHARE
        // ============================================================
        function copyArticleText() {
            const text = articleContent.innerText;
            navigator.clipboard.writeText(text).then(() => {
                showToast('تم نسخ المقال');
            }).catch(() => {
                // fallback
                const area = document.createElement('textarea');
                area.value = text;
                document.body.appendChild(area);
                area.select();
                document.execCommand('copy');
                area.remove();
                showToast('تم نسخ المقال');
            });
        }

        function shareArticle() {
            const title = articleTitle.textContent;
            const text = articleContent.innerText.slice(0, 800) + '...';
            if (navigator.share) {
                navigator.share({ title, text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(`${title}\n\n${text}`).then(() => {
                    showToast('تم نسخ الرابط (المحتوى)');
                });
            }
        }

        // ============================================================
        //  EVENTS
        // ============================================================
        // Back
        backBtn.addEventListener('click', closeArticle);

        // Search
        searchInput.addEventListener('input', function() {
            const val = this.value;
            clearSearch.style.display = val ? 'block' : 'none';
            renderSections(val);
        });
        clearSearch.addEventListener('click', function() {
            searchInput.value = '';
            clearSearch.style.display = 'none';
            renderSections('');
            searchInput.focus();
        });

        // Theme
        themeToggle.addEventListener('click', toggleTheme);

        // Font switcher
        document.querySelectorAll('.font-switcher button').forEach(btn => {
            btn.addEventListener('click', function() {
                setFont(this.dataset.font);
            });
        });

        // Font size
        document.getElementById('fontIncrease').addEventListener('click', () => setFontSize(fontSize + 2));
        document.getElementById('fontDecrease').addEventListener('click', () => setFontSize(fontSize - 2));

        // Article actions
        document.getElementById('copyArticle').addEventListener('click', copyArticleText);
        document.getElementById('shareArticle').addEventListener('click', shareArticle);
        document.getElementById('favArticle').addEventListener('click', function() {
            const currentSection = sectionsData.find(s => s.title === articleTitle.textContent);
            if (currentSection) toggleFav(currentSection.id);
        });

        // ============================================================
        //  INIT
        // ============================================================
        // Apply saved font & size
        setFont(currentFont);
        setFontSize(fontSize);
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }
        renderSections();
        homePage.style.display = 'block';
        articlePage.classList.remove('active');

        // ============================================================
        //  KEYBOARD SHORTCUT: ESC to close article
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && articlePage.classList.contains('active')) {
                closeArticle();
            }
        });
    </script>
</body>
</html>

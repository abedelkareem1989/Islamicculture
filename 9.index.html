<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الميسر في أحكام الدين (الأجزاء الثلاثة)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== ROOT VARIABLES & RESET ========== */
        :root {
            --primary: #0f7b6b;
            --primary-dark: #0a5f52;
            --primary-light: #1a9b88;
            --gold: #c9a84c;
            --gold-light: #e8d5a3;
            --gold-dark: #b8942e;
            --bg: #faf8f4;
            --bg-card: #ffffff;
            --bg-card-hover: #f6f3ed;
            --text: #2d2a24;
            --text-muted: #6b655a;
            --text-light: #9a9488;
            --shadow: 0 8px 30px rgba(15, 123, 107, 0.10);
            --shadow-hover: 0 14px 40px rgba(15, 123, 107, 0.18);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Cairo', 'Tajawal', 'Noto Kufi Arabic', sans-serif;
            --font-serif: 'Amiri', 'Noto Kufi Arabic', serif;
            --header-bg: rgba(255, 255, 255, 0.92);
            --header-border: rgba(201, 168, 76, 0.25);
            --search-bg: #ffffff;
            --search-border: #e8e2d6;
            --scrollbar-bg: #e8e2d6;
            --scrollbar-thumb: var(--primary);
            --ripple: rgba(15, 123, 107, 0.25);
            --badge-bg: var(--gold-light);
            --badge-text: var(--gold-dark);
            --divider: #ede8de;
        }
        [data-theme="dark"] {
            --bg: #1a1917;
            --bg-card: #282520;
            --bg-card-hover: #322e28;
            --text: #ece7dd;
            --text-muted: #b5aea0;
            --text-light: #8a8274;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 14px 40px rgba(0, 0, 0, 0.7);
            --header-bg: rgba(26, 25, 23, 0.95);
            --header-border: rgba(201, 168, 76, 0.15);
            --search-bg: #322e28;
            --search-border: #4a443c;
            --scrollbar-bg: #322e28;
            --badge-bg: #3d3522;
            --badge-text: var(--gold-light);
            --divider: #3d3830;
            --ripple: rgba(201, 168, 76, 0.25);
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .slide-up {
            animation: slideUp 0.4s ease forwards;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== HEADER ========== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--header-border);
            padding: 12px 0;
            transition: background var(--transition), border var(--transition);
        }
        .app-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
        }
        .brand-icon {
            font-size: 28px;
            color: var(--gold);
            filter: drop-shadow(0 2px 8px rgba(201, 168, 76, 0.3));
        }
        .brand-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            transition: color var(--transition);
        }
        .brand-name span {
            color: var(--gold);
        }
        [data-theme="dark"] .brand-name {
            color: var(--gold-light);
        }
        [data-theme="dark"] .brand-name span {
            color: var(--gold);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .header-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), transform 0.2s;
            position: relative;
        }
        .header-actions button:hover {
            background: var(--gold-light);
            color: var(--primary);
            transform: scale(1.05);
        }
        [data-theme="dark"] .header-actions button:hover {
            background: rgba(201, 168, 76, 0.2);
            color: var(--gold-light);
        }
        .header-actions button:active {
            transform: scale(0.92);
        }
        .header-actions .badge-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: var(--gold);
            border-radius: 50%;
            border: 2px solid var(--header-bg);
            transition: background var(--transition);
        }
        .search-wrapper {
            flex: 1;
            min-width: 160px;
            max-width: 420px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 18px 10px 44px;
            border-radius: 60px;
            border: 1.5px solid var(--search-border);
            background: var(--search-bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 0.95rem;
            outline: none;
            transition: border var(--transition), box-shadow var(--transition), background var(--transition);
        }
        .search-wrapper input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201, 168, 76, 0.15);
        }
        .search-wrapper input::placeholder {
            color: var(--text-light);
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
            font-size: 1rem;
        }

        /* ========== PAGES ========== */
        .page {
            display: none;
            padding: 32px 0 60px;
            animation: fadeIn 0.4s ease forwards;
        }
        .page.active {
            display: block;
        }

        /* ========== HOME (PARTS) ========== */
        .hero {
            text-align: center;
            padding: 30px 0 20px;
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.3;
        }
        .hero h1 span {
            color: var(--gold);
        }
        .hero p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 580px;
            margin: 8px auto 0;
        }
        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 28px;
        }
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 20px 20px;
            box-shadow: var(--shadow);
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--gold-light);
        }
        .card:active {
            transform: scale(0.97);
        }
        [data-theme="dark"] .card:hover {
            border-color: rgba(201, 168, 76, 0.3);
        }
        .card .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: var(--ripple);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .card-icon {
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 10px;
            display: inline-block;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ========== PART PAGE (Sections list) ========== */
        .part-header {
            padding-bottom: 16px;
            border-bottom: 2px solid var(--divider);
            margin-bottom: 20px;
        }
        .part-header .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .part-header .top-row .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: color var(--transition);
            padding: 4px 0;
        }
        .part-header .top-row .back-btn:hover {
            color: var(--gold);
        }
        .part-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 6px;
        }
        .part-header h2 i {
            color: var(--gold);
            margin-left: 10px;
        }

        /* ========== SECTION PAGE ========== */
        .section-header {
            padding-bottom: 16px;
            border-bottom: 2px solid var(--divider);
            margin-bottom: 20px;
        }
        .section-header .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header .top-row .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: var(--primary);
            font-family: var(--font);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: color var(--transition);
            padding: 4px 0;
        }
        .section-header .top-row .back-btn:hover {
            color: var(--gold);
        }
        .section-header .top-row .tools {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .section-header .top-row .tools button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background var(--transition), color var(--transition), transform 0.2s;
        }
        .section-header .top-row .tools button:hover {
            background: var(--gold-light);
            color: var(--primary);
            transform: scale(1.05);
        }
        [data-theme="dark"] .section-header .top-row .tools button:hover {
            background: rgba(201, 168, 76, 0.2);
            color: var(--gold-light);
        }
        .section-header .top-row .tools button:active {
            transform: scale(0.90);
        }
        .section-header .top-row .tools button.favorited {
            color: var(--gold);
        }
        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: 10px;
        }
        .section-header h2 i {
            color: var(--gold);
            margin-left: 10px;
        }
        .section-meta {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }
        .section-meta i {
            margin-left: 4px;
        }
        .section-body {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            line-height: 2;
            color: var(--text);
            background: var(--bg-card);
            padding: 28px 30px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            transition: background var(--transition), color var(--transition);
        }
        .section-body p {
            margin-bottom: 1.2rem;
        }
        .section-body h3,
        .section-body h4 {
            font-family: var(--font);
            color: var(--primary);
            margin: 1.6rem 0 0.8rem;
            font-weight: 700;
        }
        .section-body ul,
        .section-body ol {
            padding-right: 28px;
            margin-bottom: 1.2rem;
        }
        .section-body li {
            margin-bottom: 0.4rem;
        }
        .section-body blockquote {
            border-right: 4px solid var(--gold);
            padding-right: 18px;
            margin: 1.2rem 0;
            color: var(--text-muted);
            font-style: italic;
        }

        /* ========== FAVORITES ========== */
        .fav-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .fav-empty i {
            font-size: 4rem;
            color: var(--gold-light);
            margin-bottom: 16px;
            display: block;
        }
        .fav-empty h3 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
        }
        .fav-item {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
            border-right: 4px solid var(--gold-light);
            margin-bottom: 14px;
        }
        .fav-item:hover {
            transform: translateX(-4px);
            box-shadow: var(--shadow-hover);
            background: var(--bg-card-hover);
        }
        .fav-item .title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
        }
        .fav-item .desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ========== SETTINGS ========== */
        .settings-group {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 24px 28px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: background var(--transition);
        }
        .settings-group h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-group h3 i {
            color: var(--gold);
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--divider);
            flex-wrap: wrap;
            gap: 10px;
        }
        .setting-row:last-child {
            border-bottom: none;
        }
        .setting-row label {
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-row label i {
            color: var(--gold);
            width: 20px;
        }
        .setting-row select,
        .setting-row input[type="range"] {
            background: var(--search-bg);
            color: var(--text);
            border: 1.5px solid var(--search-border);
            border-radius: 8px;
            padding: 6px 14px;
            font-family: var(--font);
            font-size: 0.95rem;
            outline: none;
            transition: border var(--transition);
            min-width: 120px;
        }
        .setting-row select:focus,
        .setting-row input[type="range"]:focus {
            border-color: var(--gold);
        }
        .setting-row input[type="range"] {
            min-width: 140px;
            accent-color: var(--gold);
            padding: 0;
        }
        .setting-row .range-value {
            font-weight: 600;
            color: var(--primary);
            min-width: 36px;
            text-align: center;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: var(--divider);
            border-radius: 40px;
            cursor: pointer;
            transition: background var(--transition);
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: var(--gold);
        }
        .toggle-switch .knob {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            transition: transform var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }
        .toggle-switch.active .knob {
            transform: translateX(-22px);
        }

        /* ========== PROGRESS & SCROLL ========== */
        .reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--divider);
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .reading-progress .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--primary));
            transition: width 0.1s linear;
            border-radius: 0 2px 2px 0;
        }
        .scroll-top {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(15, 123, 107, 0.35);
            transition: transform var(--transition), opacity var(--transition), background var(--transition);
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .scroll-top:hover {
            transform: scale(1.08);
            background: var(--gold);
        }
        .scroll-top:active {
            transform: scale(0.92);
        }

        /* ========== SEARCH OVERLAY ========== */
        .search-results-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 80px 20px 40px;
            overflow-y: auto;
        }
        .search-results-overlay.open {
            display: flex;
        }
        .search-results-panel {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 700px;
            width: 100%;
            padding: 24px 28px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease forwards;
        }
        .search-results-panel .close-btn {
            float: left;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition);
        }
        .search-results-panel .close-btn:hover {
            color: var(--primary);
        }
        .search-results-panel h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .search-result-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background var(--transition);
            border-right: 3px solid transparent;
            margin-bottom: 6px;
        }
        .search-result-item:hover {
            background: var(--bg-card-hover);
            border-right-color: var(--gold);
        }
        .search-result-item .sr-title {
            font-weight: 700;
            color: var(--text);
        }
        .search-result-item .sr-preview {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .search-result-item .sr-section {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .search-result-item .sr-section i {
            margin-left: 4px;
        }
        .search-empty {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
        }
        .search-empty i {
            font-size: 2.6rem;
            color: var(--gold-light);
            display: block;
            margin-bottom: 10px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .app-header .container {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .brand {
                justify-content: center;
            }
            .brand-name {
                font-size: 1.1rem;
            }
            .header-actions {
                justify-content: center;
            }
            .search-wrapper {
                max-width: 100%;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .section-grid {

                                text: "\" تبارك الذي بيده الملك وهو على كل شيء قدير (1) الذي خلق الموت والحياة ليبلوكم أيكم أحسن عملاً وهو العزيز الغفور (2) الذي خلق سبع سماوات طباقاً ما ترى في خلق الرحمن من تفاوت فارجع البصر هل ترى من فطور (3) ثم ارجع البصر كرتين ينقلب عليك البصر خاسئاً وهو حسير (4) ولقد زينّا السماء الدنيا بمصابيح وجعلناها رجومًا للشياطين وأعتدنا لهم عذاب السعير (5) وللذين كفروا بربهم عذابُ جهنم وبئس المصير (6) إذا ألقوا فيها سمعوا لها شهيقًا وهي تفور (7) تكاد تميز من الغيظ كلما أُلقِىَ فيها فوج سألهم خزنتها ألم يأتِكم نذير (8) قالوا بلى قد جاءنا نذير فكذبنا وقلنا ما نَزَّل الله من شيء إن أنتم إلا في ضلال كبير (9) وقالوا لو كنا نسمع أو نعقل ما كنا في أصحاب السعير (10) فاعترفوا بذنبهم فسحقًا لأصحاب السعير (11) إن الذين يخشون ربهم بالغيب لهم مغفرة وأجر كبير (12) وأَسِرُّوا قولكم أو اجهروا به إنه عليم بذات الصدور (13) ألا يعلم من خلق وهو اللطيف الخبير (14) هو الذي جعل لكم الأرض ذلولاً فامشوا في مناكبها وكلوا من رزقه وإليه النشور (15) ءأمنتم من في السماء أن يخسف بكم الأرض فإذا هي تمور (16) أم أمنتم من في السماء أن يرسل عليكم حاصبًا فستعلمون كيف نذير (17) ولقد كذب الذين من قبلهم فكيف كان نكير (18) أولم يروا إلى الطير فوقهم صافات ويقبضن ما يمسكهن إلا الرحمن إنه بكل شيء بصير (19) أمّن هذا الذي هو جند لكم ينصركم من دون الرحمن إن الكافرون إلا في غرور (20) أمّن هذا الذي يرزقكم إن أمسك رزقه بل لَّجُّوا في عُتُوٍّ ونفور (21) أفمن يمشي مُكبًا على وجهه أهدى أمّن يمشي سويًا على صراط مستقيم (22) قل هو الذي أنشأكم وجعل لكم السمع والأبصار والأفئدة قليلاً ما تشكرون (23) قل هو الذي ذرأكم في الأرض وإليه تحشرون (24) ويقولون متى هذا الوعد إن كنتم صادقين (25) قل إنما العِلمُ عند الله وإنما أنا نذير مبين (26) فلما رأوه زلفة سيئت وجوه الذين كفروا وقيل هذا الذي كنتم به تدعون (27) قل أرءيتم إن أهلكنيَ الله ومن معي أو رحمنا فمن يُجير الكافرين من عذاب أليم (28) قل هو الرحمن ءامنا به وعليه توكلنا فستعلمون من هو في ضلال مبين (29) قل أرءيتم إن أصبح ماؤكم غوراً فمن يأتيكم بماء معين (30) \"" }

                                text: "قال رسول الله صلى الله عليه وسلم عندما سئل عن الإسلام :\" الإسلام ان تشهد أن لا إله إلا الله وأن محمدا رسول الله وتقيم الصلاة وتؤتي الزكاة وتصوم رمضان وتحج البيت إن استطعت إليه سبيلاً \" ، وعندما سئل عن الإيمان قال عليه الصلاة والسلام :\" أن تؤمن بالله وملائكته وكتبه ورسله واليوم الآخر وتؤمن بالقدر خيره وشره \" رواه مسلم" }
                        ]
                    }, {
                        id: "p3-allah-khaliq",
                        title: "الله تعالى خالق هذا العالم (الدرس الثاني)",
                        icon: "fa-crown",
                        description: "الدليل العقلي على وجود الله",
                        content: [
                            { type: "p",
                                text: "قال الله تعالى : \" أفي الله شك \" ( سورة إبراهيم ) إن أول واجب على المكلف هو معرفة الله تعالى ، فهو الخالق لجميع الموجودات ، المدبر لهذه الكائنات ، لأننا إذا تأملنا جميع الصنائع وتفكرنا فيها تفكيراً سليماً علمنا أن لها صانعاً خلقها ." },
                            { type: "p", text: "الدليل العقلي على وجود الله تعالى :" },
                            { type: "p",
                                text: "ندرك بالعقل السليم أن الكتابة لا بد لها من كاتب ، والضرب لا بد له من ضارب ، والبناء لا بد له من بناء ، فإذاً هذا العالم بما فيه من مخلوقات لا بد له من خالق حي مريد عالم قدير وهو الله سبحانه وتعالى ، الذي لا يشبه شيئاً من مخلوقاته ولا يشابهه شيء ، لأنه لا يصح في العقل وجود فعل ما بدون فاعل ." },
                            { type: "p",
                                text: "•ولا يصح أن يكون ذلك الفاعل طبيعة ، لأن الطبيعة لا إرادة لها ، فكيف تخلق ؟ لا تخلق ." },
                            { type: "p", text: "•ولا يصح أيضاً أن يكون الشيء خالقاً لنفسه لأنه مستحيل ." },
                            { type: "p", text: "•وكذلك لا يصح أن يخلق الشيء مثله أي مشابهه ." },
                            { type: "p",
                                text: "فالطفل مثلاً يولد صغيراً ، لا يتكلم ولا يمشي ، ثم يتطور ، فيبدأ بالكلام والمشي شيئاً فشيئاً ، ثم ينمو فيصير شاباً ثم كهلاً ثم هرماً ، ثم يموت ، فمن الذي طورّه وغيّره من حال إلى حال ؟ الله عز وجل هو الذي خلقه وطوّره وغيّره ثم أماته ." },
                            { type: "p", text: "قصة رجل ينكر وجود الله :" },
                            { type: "p",
                                text: "يروى أن رجلاً من منكري وجود الله أتى إلى أحد الخلفاء ، وقال له : \" إن علماء عصرك يقولون إن لهذا الكون صانعاً ، وأنا مستعد أن أثبت لهم أن هذا الكون لا صانع له \" ." },
                            { type: "p",
                                text: "فبعث الخليفة إلى عالم كبير يعلمه بالخبر ويأمره بالحضور ، فتعمّد العالم أن يتأخر قليلاً عن الوقت ، ثم حضر ، فاستقبله الخليفة وأجلسه في صدر المجلس ، وكان قد اجتمع العلماء وكبار الناس ، فقال الرجل : لم تأخرت في مجيئك ؟ فقال العالم : \" ماذا تقول لو أخبرتك أنه قد حصل لي أمر عجيب ، فتأخرت ، وذلك أن بيتي وراء نهر دجلة ، فجئت لأعبر النهر ، فلم أجد سوى سفينة عتيقة ، قد تكسرت ألواحها الخشبية ، ولما وقع نظري عليها تحركت الألواح واجتمعت ، واتصل بعضها ببعض ، وصارت السفينة صالحة للسير بلا مباشرة نجار ولا عمل عامل ، فقعدت عليها وعبرت النهر ، وجئت إلى هذا المكان أتصدقني \" . فقال الرجل : \" اسمعوا أيها الناس ماذا يقول عالمكم ، فهذا لا يصدق ؟ كيف توجد السفينة بدون أن يصنعها نجار ؟ هذا كذب محض \" . فقال العالم : \" ايها الكافر ، إذا لم يعقل أن توجد سفينة بلا صانع ولا نجار ، فكيف تقول بوجود العالم بلا صانع ؟ ." },
                            { type: "p", text: "فسكت الرجل ولزمته الحجة ، وعاقبه الخليفة لسوء اعتقاده" }
                        ]
                    }, {
                        id: "p3-la-ilaha-illa-allah",
                        title: "معنى لا إله إلا الله (الدرس الثالث)",
                        icon: "fa-shield-halved",
                        description: "شرح الصفات الثلاث عشرة لله تعالى",
                        content: [
                            { type: "p",
                                text: "معنى الشهادة الأولى أنه لا أحد يستحق أن يتذلل له نهاية التذلل إلا الله . والعبادة هي نهاية التذلل ، فلا يجوز أن يتذلل شخص نهاية التذلل لغير الله ." },
                            { type: "p",
                                text: "وأما مجرد الاستعانة أو الاستغاثة أو التوسل بنبي صالح مع الاعتقاد بأن الله هو الخالق فليس نهاية التذلل ، وهذا الأمر واضح ، فقد أمر النبي صلى الله عليه وسلم الأعمى أن يتوسل به ، ففعل ، فشفاه الله ." },
                            { type: "p",
                                text: "وبعدما مات رسول الله صلى الله عليه وسلم علّم بعض الصحابة وهو عثمان بن حنيف ، صاحب الحاجة أن يدعو الأعمى بالدعاء نفسه ففعل ، فقضيت حاجته ." },
                            { type: "p",
                                text: "والحديث صحيح ، رواه الطبراني وصححه ، ورواه البيهقي ، وصححه التقي السبكي والحافظ العلائي ." },
                            { type: "p",
                                text: "ولا يكفي العلم بمعنى الشهادتين من غير الاعتقاد الجازم في القلب فقد علم قسمٌ من الناس أن سيدنا محمد نبي مرسل ، ومع ذلك لم يؤمنوا به كاليهود وغيرهم ." },
                            { type: "p",
                                text: "وقد تكرر في القرءان ذكر ثلاث عشرة صفة لله ، إما لفظاً وإما معنى كثيراً وهي : الوجود -- الوحدانية -- القِدم أي الأزلية -- البقاء -- القيام بالنفس -- القدرة -- الإرادة -- العلم -- السمع -- البصر -- الحياة -- الكلام -- والمخالفة للحوادث ." },
                            { type: "p",
                                text: "فلما كانت هذه الصفات ذكرها كثيراً في النصوص الشرعية قال العلماء : يجب معرفتها وجوباً عينياً ." },
                            { type: "p",
                                text: "1. الوجود : أي أن الله تعالى موجود ، ووجوده ليس كوجودنا ، فهو موجود بلا مكان ." },
                            { type: "p",
                                text: "2. الوحدانية : أي أن الله واحد لا شبيه له ولا شريك له . قال ابو حنيفة رضي الله عنه : والله واحد لا من طريق العدد ولكن من طريق أنه لا شريك له فإن العدد مخلوق يقبل الزيادة والله منزه عن ذلك سبحانه ." },
                            { type: "p",
                                text: "3. القدم : قال الله تعالى \" هو الأول والآخر \" أي الأزلي الذي لا ابتداء لوجوده ، وبمعناه القديم إذا أطلق في حق الله تعالى ، وكل ما سوى الله مخلوق لوجوده بداية ، وليس مع الله شيء أزلي ، لا عرش ولا كرسي ، ولا سماوات ولا أرض ، فقد قال رسول الله صلى الله عليه وسلم : \" كان الله ولم يكن شيء غيره \" حديث صحيح رواه البخاري وابن الجارود . وحكم من يعتقد أن شيئاً غير الله أزلي أي لا بداية لوجوده التكفير قطعاً فإنه كذّب قول الله تعالى :\" الله خالق كل شيء \" واجمعت الأمة على تكفيره وقد نقل هذا الإجماع الزركشي والنووي والسيوطي والمتولي والقاضي عياض ومحمد بن يوسف وغيرهم . وتأتي كلمة قديم إذا وصف بها المخلوق بمعنى الذي مضى عليه زمن طويل . قال الله تعالى حكاية عن القمر :\" حتى عاد كالعرجون القديم \" ." },
                            { type: "p",
                                text: "4. البقاء : قال الله عز وجل :\" هو الأول والآخر \" ومعنى الآخر الباقي الذي لا يموت ولا يطرأ عليه عدم ." },
                            { type: "p",
                                text: "5. القيام بالنفس : قال الله تعالى :\" الله الصمد \" فالله مستغن عن غيره ، وغيره محتاج إليه ." },
                            { type: "p",
                                text: "6. القدرة : قال تعالى :\" وهو على كل شيء قدير \" فالله تعالى لا يعجزه شيء ، بقدرته يوجد ويعدم ، وقدرته صفة أزلية أبدية يؤثر بها في الممكنات جميعاً إيجادا وإعداما ." },
                            { type: "p",
                                text: "7. الإرادة : فالله عز وجل موصوف بالإرادة أي المشيئة . قال تعالى :\" وربك يخلق ما يشاء ويختار \" فما أراد الله حصوله لا بد أن يحصل في الوقت الذي أراد حصوله فيه ، وما لم يرد حصوله لا يحصل أبداً .قال رسول الله صلى الله عليه وسلم :\" ما شاء الله كان وما لم يشأ لم يكن \" رواه ابو داوود . فكل ما يحصل في هذا العالم يحصل بمشيئة الله ، فالخير يحصل بتقدير الله وإرادته ، والشر يحصل بتقدير الله وإرادته . لكن الخير يحصل بأمر الله ورضاه والشر ليس بأمر الله ولا بمحبته ولا برضاه وإن كان بعلمه وإرادته. فالأمور تنقسم إلى أربعة : •أمر اراد الله حصوله وأمر به ، كإيمان الملائكة ، أمرهم الله به وأراد حصوله منهم •وأمر لم يرد الله حصوله وأمر به كالإيمان بالنسبة للكفار أمرهم الله بالإيمان ولم يشأ لهم أن يؤمنوا فلم يؤمنوا . •وأمر أراد الله حصوله ولم يأمر به ككفر الكافرين ، أراد الله لهم أن يكفروا ولم يأمرهم بذلك ، بل نهاهم عنه . •وأمر لم يرد الله حصوله ولم يأمر به كالكفر بالنسبة للملائكة ، لم يأمرهم الله به ولم يرد لهم ذلك فلا يكفرون . فللعبد مشيئة ، وهو مختار ، لكت تحت مشيئة الله تعالى . قال تعالى :\" وما تشاءون إلا أن يشاء الله \" ومن زعم أن شيئاً في هذا العالم يحصل بغير إرادة الله فقد كفر ، سواء كان هذا الشيء خيراً أو شراً . ومن ينسب لله تعالى خلق الخير دون الشر فقد نسب إلى الله العجز وجعل للعالم أكثر من مدبر ، وهذا كفر وإشراك مشابه لاعتقاد المجوس الذين يعتقدون أن للعالم مدبرين ، مدبر للخير ومدبر للشر . قال رسول الله صلى الله عليه وسلم :\" لكل أمة مجوس ومجوس هذه الأمة الذي يقولون لا قدر \" رواه ابو داود. وقد نص على كفر أمثال هؤلاء ابن عباس ، فقد قال : \" كلام القدرية -- اي من ينفي القدر -- كفر \" وقال ابو يوسف :\" المعتزلة زنادقة \" ، ووصفهم عبد القاهر التميمي بأنهم مشركون ، ونقل تكفيرهم عن الأئمة جزاهم الله عنا خيراً . فالله عز وجل هو مبرز الأشياء من العدم إلى الوجود ، فالخير والشر ، الطاعة والمعصية ، والكفر والإيمان ، الحسن والقبيح ، كل ذلك الله تعالى خالقه ومبرزه من العدم إلى الوجود . فالعبد لا يخلق فعله ، إنما يكتسبه اكتساباً ، وخالق العبد وفعله هو الله تعالى فقط ، قال تعالى :\" والله خلقكم وما تعملون \" وقال الإمام أبو حنيفة في الوصية \"والعبد مع أعماله وإقراره ومعرفته مخلوق ، فإذا كان الفاعل مخلوقا فأفعاله أولى أن تكون مخلوقة \" فلا خالق بهذا المعنى أي الابراز من العدم إلى الوجود إلا الله تبارك وتعالى ." },
                            { type: "p",
                                text: "8. العلم : أي أن الله موصوف بعلم أزلي ابدي لا يتغير ، لا يزيد ولا ينقص ، فالله تعالى عالم بذاته وبصفاته وبما يحدثه من مخلوقاته بعلم واحد لا يتبدل ، يعلم الأشياء قبل حصولها . قال تعالى :\" وهو بكل شيء عليم \" ." },
                            { type: "p",
                                text: "9. السمع : قال تعالى :\" وهو السميع البصير\" وسمعه ليس كسمع غيره ، يسمع كل المسموعات بسمع أزلي أبدي لا يشبه سمع خلقه من غير أذنٍ ولا صماخ ولا ءالةٍ أخرى ." },
                            { type: "p",
                                text: "10. البصر : أي أن الله تعالى يرى كل المبصرات بلا حدقة ولا ءالة أخرى ولا شعاع ضوء ، بصره ليس كبصر غيره سبحانه ." },
                            { type: "p",
                                text: "11. الحياة : قال تعالى :\" الله لا إله إلا هو الحي \" فالله تعالى حي بحياة لا تشبه حياتنا ، نحن حياتنا باجتماع روح ولحم وعظم ودم ، والله منزه عن مشابهة المخلوقات ، حياته صفة لا تشبه حياة غيره ." },
                            { type: "p",
                                text: "12. الكلام : فالله تعالى متكلم بكلام أزلي أبدي لا يشبه كلامنا ليس حرفاً ولا صوتاً ولا لغة عربية ولا أجنبية ، فإن الحروف والأصوات واللغات حادثة مخلوقة والله لا يوصف بصفة حادثة . وأما الفاظ القرءان الكريم التي أنزلت على سيدنا محمد باللغة العربية فلا شك أنها مخلوقة ، ولكنها تسمى كلام الله ايضاً لأنها ليست من تأليف جبريل ولا من تأليف سيدنا محمد صلى الله عليه وسلم ، وهي تدل على كلام الله الذاتي وعبارة عنه . وتقريب ذلك أنك إذا كتبت لفظ الجلالة الله ثم قلت أعبد الله ، فليس مقصودك أنك تعبد الأحرف المكتوبة ، إنما قصدك أنك تعبد الذات المقدس الذي يدل عليه هذا اللفظ ، فهذا اللفظ عبارة عن الذات المقدس ، واللفظ المنزل على سيدنا محمد المكتوب في المصحف عبارة عن كلام الله الذاتي الذي لا يشبه كلامنا يدل عليه . ومن اعتقد ان الله يتكلم بلغةٍ من اللغات بحرف وصوت ، فهو كافر والعياذ بالله تعالى ، إذ صفات الخالق لا تشبه صفات الخلق . قال أبو حنيفة :\" ولا يوصف ، أي الله ، بصفات المخلوقين \" ." },
                            { type: "p",
                                text: "13. المخالفة للحوادث : أي أن الله تعالى لا يشبه شيئاً من خلقه ، لا ذاته يشبه ذوات المخلوقين ولا فعله يشبه فعل المخلوقين ، ولا صفاته تشبه صفات المخلوقين . خلق الأجسام فليس جسماً ، خلق الألوان ولا يوصف بأن له لونا ، خلق الطول والعرض ، فلا يوصف بأن له طولاً وعرضاً ، بل هو سبحانه وتعالى موجود لا كالموجودات فمهما تصورت ببالك فالله بخلاف ذلك ، \" ليس كمثله شيء وهو السميع البصير \" . فالله تعالى كان موجودا قبل خلق المكان بلا مكان وبعد أن خلق المكان هو موجود بلا مكان ، كما قال علي كرم الله وجهه :\" كان الله ولا مكان ، وهو الآن على ما عليه كان \" رواه الرملي . فلا يقال إن الله جالس على العرش لأن الجلوس لا يحصل إلا من مخلوق له جزء أعلى وجزء أسفل . ولا يقال إن الله ساكن في السماء ، لأن السماء مسكن الملائكة ، والله كان موجوداً قبل أن يخلق السماء بلا سماء إنما خلق الله العرش العظيم إظهاراً لكمال قدرته فإن الملائكة الحافين بالعرش لما يرون اتساع العرش يزدادون علماً بكمال الله تعالى وتمام قدرته وحكمته . وما أحسن ما قاله جعفر الصادق ، الإمام ابن الإمام في تنزيه الله تعالى :\" من زعم أن الله في شيء أو من شيء أو على شيء فقد اشرك ، إذ لو كان في شيء لكان محصوراً ولو كان على شيء لكان محمولاً ولو كان من شيء لكان محدثاً \" أي مخلوقاً" }
                        ]
                    }, {
                        id: "p3-iman-bil-rusul",
                        title: "الإيمان بالرسل (الدرس الرابع)",
                        icon: "fa-people-arrows",
                        description: "صفات الأنبياء والفرق بين النبي والرسول",
                        content: [
                            { type: "p",
                                text: "قال الله تعالى : \" ولقد أرسلنا رسلاً من قبلك منهم من قصصنا عليك \" ( سورة غافر)" },
                            { type: "p",
                                text: "إن الإنسان لا يستطيع أن يعرف بنفسه الأمور التي تنجي يوم القيامة من غيرها دون أن ينبهه أحد إلى ذلك ، فمصالح العباد تقتضي وجود معلمين ومرشدين يبينون لهم ما يجب عليهم ، ولذلك أرسل الله إليهم بشراً ليرشدوهم ، ويبينوا لهم كيفية العبادات والمعاملات ، وأولئك هم الأنبياء ." },
                            { type: "p",

                                text: "وتحصل بأن يعتقد الشخص بقلبه ما ينافي معنى الشهادتين ، وذلك كأن يحصل له شك في الله أو في رسوله أو في القرءان أو في الجنة أو في النار فيشك هل سيدخل الله الطائعين الجنة ويعذب الكفار في النار أم لا فإن مثل هذا الشك كفر والعياذ بالله . •ومن الكفر الاعتقادي اعتقاد أن شيئاً أزلياً ( اي لا بداية لوجوده ) غير الله . قال تعالى :\" الله خالق كل شيء \" . •ومن الكفر الاعتقادي اعتقاد أن الله تعالى جسم أو أن له طولاً أو عرضاً أو لوناً أو نحو ذلك من صفات المخلوقات . كما بين ذلك النووي وغيره . •ومن الكفر الاعتقادي اعتقاد تحليل محرم معلوم من الدين بالضرورة حرمته أي يعرف العالم والجاهل من المسلمين ذلك ويكون مجمعاً عليه ، وهذا كشرب الخمر فمن أحله كفر وكالزنا فمن أحله كفر إلا إن كان حديث عهد بالإسلام أو عاش في بادية بعيداً عن العلماء وكان اعتقد حل نحو شرب الخمر ولم يعرف أنها حرام عند المسلمين فلا نكفره بل نعلمه . •ومن الكفر الاعتقادي اعتقاد تحريم حلال مجمع عليه معلوم من الدين بالضرورة مما لا يخفى عليه يعلم العالم والجاهل من المسلمين أنه حلال كالنكاح والتجارة ونحو ذلك فإن حرمه كفر والعياذ بالله تعالى . قال رسول الله صلى الله عليه وسلم :\" إن محرم الحلال كمستحل الحرام \" . •ومن الكفر الاعتقادي اعتقاد أن الصلوات الخمس غير مفروضة فإن هذا تكذيب صريح لشرع الله تعالى . •ومن الكفر الاعتقادي العزم على الكفر في المستقبل فمن نوى أن يكفر في المستقبل ولو بعد زمان طويل كفر في الحال وكذلك لو هدد بالكفر أو تردد فيه •ومنه اعتقاد أن ءادم ليس نبياً أو أن عيسى ليس نبياً أو أن محمداً ليس ءاخر الأنبياء بل سينبأ بعده أحد ، فذلك كله كفر عند الله عز وجل . قال رسول الله صلى الله عليه وسلم :\" وختم بي النبيون \"" },
                            { type: "p", text: "2. الردة الفعلية :" },
                            { type: "p",
                                text: "وتحصل بأن يفعل فعلا لا يصدر إلا من كافر ، وذلك كالسجود للشيطان أو للصنم أو للشمس فإن المسلمين أجمعوا على أن مثل هذا الفعل لا يصدر إلا من كافر ، كما ذكر القاضي عياض في الشفا وغيره . •ومن الكفر الفعلي رمي المصحف في القاذورات فإن هذا استهزاءاً ظاهراً وهو كفر يخرج من الإسلام كما ذكر الرافعي وغيره . قال ابن عابدين ولو لم يقصد الاستخفاف فإن فعله يدل على الاستخفاف . •ومن الكفر الفعلي إلقاء كتب الحديث أو كتب العلوم الشرعية أو أوراقها في القذر كما بينه الروياني والزركشي وغيرهما . •ومن الكفر الفعلي كتابة ءايات القرءان بالبول أو ءاية منه أو كتابة الفاتحة به فإنه استهزاء واضح بالقرءان الكريم ولو بنية التداوي . •وأما السجود لمسلم تحية واحتراما فليس كفراً لكنه حرام في شرع سيدنا محمد صلى الله عليه وسلم ، وأما السجود لإنسان بنية عبادته فهذا كفر لا شك في ذلك ." },
                            { type: "p", text: "3. الردة القولية :" },
                            { type: "p",
                                text: "وهي منتشرة جدا في هذا الزمن ، ومن الناس من يقول هي كفر لكن لا يعرف أنها تخرج من الإسلام وأن على من صدر منه ذلك الرجوع إلى الإسلام بالنطق بالشهادتين ، بل يظن ان الاستغفار يكفيه في هذه الحالة اي قول استغفر الله وهذا مناقض لحديث النبي صلى الله عليه وسلم :\" \....حتى يشهدوا أن لا إله إلا الله وأني رسول الله \" رواه البخاري ، ولم يقل حتى يقولوا أستغفر الله . وهذا الذي يحصل من قسم من الناس في هذا الزمن مصداق حديث رسول الله صلى الله عليه وسلم :\" إن العبد ليتكلم بالكلمة لا يرى بها بأساً يهوي بها في النار سبعين خريفاً \" أي سبعين سنة فيصل إلى قعر جهنم حيث لا يصله إلا الكافر . وقد بين الأئمة جزاهم الله خيراً أن الكفر اللساني ليس ذنباً هيناً بل هو مخرج من الإسلام ولو لم ينضم إليه الكفر الفعلي أو الكفر الاعتقادي . وقد ذكر العلماء من المذاهب الأربعة أمثلة على الكفر اللفظي وبينوها في كتبهم كروضة الطالبين للنووي والشفا للقاضي عياض والعزيز للرافعي والإعلام لابن حجر والفتاوى الخانية لقاضيخان وغيرهم كثير فمن شاء فليراجع كتبهم . •فمن الكفر اللفظي قول الشخص لمسلم وهو يعرفه مسلماً يا كافر لأنه سمى الإسلام كفراً فإن كان يفهم من ذلك أن فعله يشبه أفعال الكفار أو قال له يا يهودي ويفهم من ذلك أن فعله يشبه أفعال اليهود فإنه لا يُكَفّر ولكنه حرام ولكن ينهى عن ذلك اللفظ ويُمنع من قوله . •ومن الكفر القولي سب الله والاستهزاء به فقد قال القاضي عياض : لا خلاف أن ساب الله تعالى من المسلمين كافر . •ومنه سبُّ نبي من الأنبياء أو ملك من الملائكة أو سب الدين الاسلامي والاستهزاء به . •ومن الكفر القولي الاستخفاف بالجنة او بعذاب النار كمن يقول غدا نتدفأ في جهنم ، فإنه تكذيب صريح للقرءان . •ومنه قول الشخص لو شهد عندي الأنبياء بكذا ما قبلتهم لأنه خوّن الأنبياء ، أو يقول لو شهد عندي الملائكة بكذا ما قبلتهم لأنه خَوّن الملائكة ، أو شهد عندي جميع المسلمين بكذا ما قبلتهم لأنه خَوّن كل المسلمين . •ومن الكفر القولي قول الشخص لو ءاخذني الله بترك الصلاة مع ما أنا فيه من المرض ظلمني ، فيكفر القائل لأنه نسب الظلم إلى الله . •ومن الكفر القولي التكذيب بالقدر كقول الشخص عن شيء حصل : هذا ليس بتقدير الله فقد قال رسول الله صلى الله عليه وسلم :\" كل شيء بقدر حتى العجز والكيس \" رواه مسلم . •ومن الكفر القولي قول الشخص لو كان فلان نبياً ما ءامنت به ، فإن هذا استهزاء بمنصب النبوة ونقل تكفيره عن العلماء النووي والرافعي وأقراه . •ومن الكفر أن يقول شخص لستُ مسلماً فقد أفتى النووي في الروضة أن من غضب على ولده أو غلامه فضربه ضرباً شديداً فقال له رجل ألست مسلم فقال لا متعمداً كفر . ( متعمداً : أي على غير وجه سبق اللسان ) . •ومن الكفر الاستهزاء بآية من ءايات القرءان فقد بيّن الله تعالى أن هذا شأن الكافرين لا المؤمنين . •ومن الكفر القولي الاستهزاء بالصلاة أو الصيام أو الحج وذلك كان يقول شخص ما أصبت خيراً منذ صليت ( يعني أن الصلاة نحس عليه ) فإن في هذا الكلام تكذيباً للشرع فإن الله عظم شأن الصلاة وهذا الكلام استهزاء بها وحط من شأنها . والقاعدة : أن كل اعتقاد بالقلب أو فعل بالجوارح أو كلام باللسان فيه استهزاء واستخفاف بالله أو ملائكته أو كتبه أو رسله أو شعائر دينه أو وعده أو وعيده كفر فليحذر الإنسان من ذلك جهده فإن الله تعالى قال : \" ولئِن سألتهم ليقولن إنما كنا نخوض ونلعب قل أبالله وءاياته ورسوله كنتم تستهزئون لا تعتذروا قد كفرتم بعد إيمانكم \" ( سورة التوبة ) فلينظر العاقل لئلا يرى في كتابه يوم القيامة مثل هذه الكلمات الخبيثة وقد قال تعالى :\" ما يلفظ من قول إلا لديه رقيب عتيد \" ( سورة ق) ." }

                                text: "1. التكبر : هو ردّ الحق على قائله واستحقار الناس . قال النبي صلى الله عليه وسلم :\" الكِبرُ بطرُ الحقِ وغَمطُ الناس \" رواه مسلم ، ومعنى بَطر الحق : دفعُهُ على قائله ، ومعنى غَمط الناس : احتقارهم . ويفهم من هذا الحديث أن التكبر هو رد الحق على قائله مع العلم بأن الصواب مع القائل ، إما لكونه صغيراً أو فقيراً أو تلميذاً أو ضعيفاً ، واستحقار الناس أي ازدراؤهم كأن يتكبر على الفقير وينظر إليه نظر احتقار أو يعرض عنه يترفع عليه في الخطاب ." },

                                text: "الغيبة : هي ذكر المسلم بما فيه مما يكره في غيبته ، فلو كان شخص مسلم قصير القامة فقال عنه شخص في غيبته : فلان قصير وكان يكره أن يقال عنه ذلك فإن ذلك من الغيبة المحرمة التي نهى عنها رسول الله صلى الله عليه وسلم . قال الله تعالى :\" ولا يغتب بعضكم بعضاً \" ( سورة الحجرات ) ." },

                            { type: "p",

                                    "الندم : هو الركن الأعظم وهو من واجبات القلوب ، فيجب على التائب أن يندم أسفاً على عدم رعاية حق الله ، لأنه ارتكب ما نهى الله عنه .",
                                    "الإقلاع : أي الاقلاع عن الذنب أي تركه ، فيجب على شارب الخمر ( مثلاً ) أن يترك شرب الخمر لتُقبل توبته ، أما إن قال : لا اشرب الخمر بعد اليوم بلسانه ، وهو ما زال على شرب الخمر فليست هذه بتوبة .",
                                    "العزم على ان لا يعود إلى الذنب : أي أن يعزم في قلبه أن لا يعود إلى المعصية التي يريد أن يتوب منها ."
                                ] },
                            { type: "p", text: "من شروط التوبة : ردّ الحقوق ، والتوبة قبل الغرغرة ." },
                            { type: "list", items: [
                                    "رد الحقوق : يشترط إن كانت المعصية تتعلق بحق إنسان ، كالضرب بغير حق أو أكل مال الغير ظُلمًا أن يخرج من هذه المظلمة ، باسترضاء المظلوم أو برد المال ، فقد قال عليه الصلاة والسلام :\" من كان لأخيه عنده مظلمة فليتحلله قبل أن لا يكون دينار ولا درهم \" رواه مسلم .",
                                    "التوبة قبل الغرغرة : ويشترط ايضاً أن تكون التوبة قبل الغرغرة ، والغرغرة هي بلوغ الروح الحلقوم ، فمن وصل إلى حدّ الغرغرة لا تقبل توبته ."
                                ] },
                            { type: "p", text: "انتهى والحمد لله رب العالمين" }
                        ]
                    }
                ]
            }]
        };

        /* ============================================================
           APP STATE
           ============================================================ */
        const state = {
            currentPartId: null,
            currentSectionId: null,
            favorites: JSON.parse(localStorage.getItem('islamApp_favorites') || '[]'),
            fontSize: parseInt(localStorage.getItem('islamApp_fontSize') || '18'),
            fontFamily: localStorage.getItem('islamApp_fontFamily') || 'Cairo',
            darkMode: localStorage.getItem('islamApp_darkMode') === 'true',
            lastPart: localStorage.getItem('islamApp_lastPart') || null,
            lastSection: localStorage.getItem('islamApp_lastSection') || null,
            lastScroll: parseInt(localStorage.getItem('islamApp_lastScroll') || '0'),
        };

        /* ============================================================
           DOM REFS
           ============================================================ */
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const pages = {
            home: $('#page-home'),
            part: $('#page-part'),
            section: $('#page-section'),
            favorites: $('#page-favorites'),
            settings: $('#page-settings'),
        };

        const homeGrid = $('#homeGrid');
        const partTitle = $('#partTitle span');
        const partSectionsGrid = $('#partSectionsGrid');
        const sectionTitle = $('#sectionTitle span');
        const sectionBody = $('#sectionBody');
        const readTimeEl = $('#readTime');
        const wordCountEl = $('#wordCount');
        const favList = $('#favList');
        const favBadge = $('#favBadge');
        const globalSearchInput = $('#globalSearchInput');
        const searchOverlay = $('#searchOverlay');
        const searchResultsList = $('#searchResultsList');
        const progressBar = $('#progressBar');
        const scrollTopBtn = $('#scrollTopBtn');
        const favoriteSectionBtn = $('#favoriteSectionBtn');

        /* ============================================================
           HELPERS
           ============================================================ */
        function getPartById(id) {
            return APP_DATA.parts.find(p => p.id === id);
        }

        function getSectionById(id) {
            for (const part of APP_DATA.parts) {
                const found = part.sections.find(s => s.id === id);
                if (found) return { part, section: found };
            }
            return null;
        }

        function getAllSections() {
            const all = [];
            for (const part of APP_DATA.parts) {
                for (const sec of part.sections) {
                    all.push({ part, section: sec });
                }
            }
            return all;
        }

        function renderContent(contentArr) {
            let html = '';
            for (const item of contentArr) {
                if (item.type === 'p') {
                    html += `<p>${item.text}</p>`;
                } else if (item.type === 'list') {
                    html += '<ul>';
                    for (const li of item.items) {
                        html += `<li>${li}</li>`;
                    }
                    html += '</ul>';
                } else if (item.type === 'h3') {
                    html += `<h3>${item.text}</h3>`;
                } else if (item.type === 'h4') {
                    html += `<h4>${item.text}</h4>`;
                } else if (item.type === 'blockquote') {
                    html += `<blockquote>${item.text}</blockquote>`;
                }
            }
            return html;
        }

        function countWords(text) {
            const clean = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
            return clean ? clean.split(' ').length : 0;
        }

        function estimateReadTime(text) {
            const words = countWords(text);
            return Math.max(1, Math.round(words / 200));
        }

        function getFullSectionText(section) {
            let txt = '';
            for (const item of section.content) {
                if (item.type === 'p') txt += item.text + ' ';
                else if (item.type === 'list') txt += item.items.join(' ') + ' ';
                else if (item.type === 'h3' || item.type === 'h4') txt += item.text + ' ';
                else if (item.type === 'blockquote') txt += item.text + ' ';
            }
            return txt;
        }

        /* ============================================================
           NAVIGATION
           ============================================================ */
        function showPage(pageId) {
            Object.keys(pages).forEach(key => {
                pages[key].classList.toggle('active', key === pageId);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
            state.currentPartId = null;
            state.currentSectionId = null;
            showPage('home');
            renderHome();
        }

        function goToPart(partId) {
            state.currentPartId = partId;
            state.currentSectionId = null;
            showPage('part');
            const part = getPartById(partId);
            if (!part) return;
            partTitle.textContent = part.title;
            renderPartSections(part);
            localStorage.setItem('islamApp_lastPart', partId);
        }

        function goToSection(sectionId) {
            const result = getSectionById(sectionId);
            if (!result) return;
            state.currentSectionId = sectionId;
            state.currentPartId = result.part.id;
            showPage('section');

            const { part, section } = result;
            sectionTitle.textContent = section.title;

            const fullText = getFullSectionText(section);
            const wordCount = countWords(fullText);
            const readMin = estimateReadTime(fullText);

            wordCountEl.textContent = wordCount;
            readTimeEl.textContent = readMin + ' دقائق';

            sectionBody.innerHTML = renderContent(section.content);

            updateFavoriteBtn(sectionId);
            localStorage.setItem('islamApp_lastSection', sectionId);
            localStorage.setItem('islamApp_lastPart', part.id);

            setTimeout(() => {
                const saved = parseInt(localStorage.getItem('islamApp_lastScroll') || '0');
                if (saved > 0) window.scrollTo({ top: saved, behavior: 'smooth' });
            }, 100);
        }

        function goToFavorites() {
            showPage('favorites');
            renderFavorites();
        }

        function goToSettings() {
            showPage('settings');
        }

        /* ============================================================
           RENDER: HOME (Parts)
           ============================================================ */
        function renderHome() {
            let html = '';
            for (const part of APP_DATA.parts) {
                const icon = part.icon || 'fa-book';
                const desc = part.description || '';
                const count = part.sections ? part.sections.length : 0;
                html += `
                    <div class="card fade-in" data-part="${part.id}" style="animation-delay:${Math.random()*0.15}s;">
                        <div class="card-icon"><i class="fas ${icon}"></i></div>
                        <div class="card-title">${part.title}</div>
                        <div class="card-desc">${desc}</div>
                        <div class="card-meta"><i class="fas fa-folder-open"></i> ${count} قسم</div>
                    </div>
                `;
            }
            homeGrid.innerHTML = html;

            homeGrid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', function(e) {
                    const id = this.dataset.part;
                    createRipple(e, this);
                    setTimeout(() => goToPart(id), 150);
                });
            });
        }

        /* ============================================================
           RENDER: PART SECTIONS
           ============================================================ */
        function renderPartSections(part) {
            let html = '';
            for (const sec of part.sections) {
                const icon = sec.icon || 'fa-book';
                const desc = sec.description || '';
                const count = sec.content ? sec.content.length : 0;
                html += `
                    <div class="card fade-in" data-section="${sec.id}" style="animation-delay:${Math.random()*0.15}s;">
                        <div class="card-icon"><i class="fas ${icon}"></i></div>
                        <div class="card-title">${sec.title}</div>
                        <div class="card-desc">${desc}</div>
                        <div class="card-meta"><i class="fas fa-file-alt"></i> ${count} فقرة</div>
                    </div>
                `;
            }
            partSectionsGrid.innerHTML = html;

            partSectionsGrid.querySelectorAll('.card').forEach(el => {
                el.addEventListener('click', function(e) {
                    const id = this.dataset.section;
                    createRipple(e, this);
                    setTimeout(() => goToSection(id), 150);
                });
            });
        }

        /* ============================================================
           RENDER: FAVORITES
           ============================================================ */
        function renderFavorites() {
            const favs = state.favorites;
            if (!favs.length) {
                favList.innerHTML = `
                    <div class="fav-empty">
                        <i class="fas fa-heart"></i>
                        <h3>لا توجد أقسام في المفضلة</h3>
                        <p>أضف الأقسام التي تهمك لتجدها هنا</p>
                    </div>
                `;
                return;
            }
            let html = '';
            for (const sid of favs) {
                const result = getSectionById(sid);
                if (!result) continue;
                const { part, section } = result;
                html += `
                    <div class="fav-item" data-section="${sid}">
                        <div class="title"><i class="fas fa-heart" style="color:var(--gold);margin-left:8px;"></i> ${section.title}</div>
                        <div class="desc">${part.title} — ${section.description || ''}</div>
                    </div>
                `;
            }
            favList.innerHTML = html;

            favList.querySelectorAll('.fav-item').forEach(el => {
                el.addEventListener('click', function() {
                    const sid = this.dataset.section;
                    goToSection(sid);
                });
            });
        }

        /* ============================================================
           FAVORITES LOGIC
           ============================================================ */
        function toggleFavorite(sectionId) {
            const idx = state.favorites.indexOf(sectionId);
            if (idx > -1) {
                state.favorites.splice(idx, 1);
            } else {
                state.favorites.push(sectionId);
            }
            localStorage.setItem('islamApp_favorites', JSON.stringify(state.favorites));
            updateFavBadge();
            updateFavoriteBtn(sectionId);
            if (pages.favorites.classList.contains('active')) renderFavorites();
        }

        function isFavorited(sectionId) {
            return state.favorites.includes(sectionId);
        }

        function updateFavoriteBtn(sectionId) {
            const fav = isFavorited(sectionId);
            favoriteSectionBtn.classList.toggle('favorited', fav);
            favoriteSectionBtn.innerHTML = fav ? '<i class="fas fa-heart"></i>' : '<i class="fas fa-heart"></i>';
            favoriteSectionBtn.title = fav ? 'إزالة من المفضلة' : 'إضافة إلى المفضلة';
        }

        function updateFavBadge() {
            favBadge.style.display = state.favorites.length > 0 ? 'block' : 'none';
        }

        /* ============================================================
           RIPPLE
           ============================================================ */
        function createRipple(e, el) {
            const rect = el.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size / 2;
            const y = e.clientY - rect.top - size / 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple-effect';
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            el.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        }

        /* ============================================================
           SEARCH
           ============================================================ */
        function performSearch(query) {
            const results = [];
            const q = query.trim().toLowerCase();
            if (q.length < 2) return results;

            const all = getAllSections();
            for (const { part, section } of all) {
                let fullText = getFullSectionText(section);
                if (fullText.toLowerCase().includes(q)) {
                    const idx = fullText.toLowerCase().indexOf(q);
                    const start = Math.max(0, idx - 40);
                    const end = Math.min(fullText.length, idx + q.length + 40);
                    let snippet = fullText.substring(start, end);
                    if (start > 0) snippet = '…' + snippet;
                    if (end < fullText.length) snippet += '…';
                    results.push({
                        sectionId: section.id,
                        sectionTitle: section.title,
                        partTitle: part.title,
                        preview: snippet,
                    });
                }
            }
            return results;
        }

        function renderSearchResults(results) {
            if (!results.length) {
                searchResultsList.innerHTML = `
                    <div class="search-empty">
                        <i class="fas fa-search"></i>
                        <p>لا توجد نتائج تطابق بحثك</p>
                    </div>
                `;
                return;
            }
            let html = '';
            for (const r of results) {
                html += `
                    <div class="search-result-item" data-section="${r.sectionId}">
                        <div class="sr-title">${r.sectionTitle}</div>
                        <div class="sr-preview">${r.preview}</div>
                        <div class="sr-section"><i class="fas fa-folder-open"></i> ${r.partTitle}</div>
                    </div>
                `;
            }
            searchResultsList.innerHTML = html;

            searchResultsList.querySelectorAll('.search-result-item').forEach(el => {
                el.addEventListener('click', function() {
                    const sid = this.dataset.section;
                    searchOverlay.classList.remove('open');
                    globalSearchInput.value = '';
                    goToSection(sid);
                });
            });
        }

        /* ============================================================
           SETTINGS
           ============================================================ */
        function applySettings() {
            document.body.style.fontFamily = `'${state.fontFamily}', 'Cairo', 'Tajawal', 'Noto Kufi Arabic', sans-serif`;
            const bodyEl = document.getElementById('sectionBody');
            if (bodyEl) bodyEl.style.fontSize = state.fontSize + 'px';

            if (state.darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeToggle').innerHTML = '<i class="fas fa-moon"></i>';
            }

            document.getElementById('fontSelect').value = state.fontFamily;
            document.getElementById('fontSizeRange').value = state.fontSize;
            document.getElementById('fontSizeDisplay').textContent = state.fontSize;
            document.getElementById('darkModeToggle').classList.toggle('active', state.darkMode);

            localStorage.setItem('islamApp_fontFamily', state.fontFamily);
            localStorage.setItem('islamApp_fontSize', String(state.fontSize));
            localStorage.setItem('islamApp_darkMode', String(state.darkMode));
        }

        /* ============================================================
           TOOLS
           ============================================================ */
        function copySection() {
            const text = sectionBody.innerText;
            navigator.clipboard.writeText(text).then(() => showToast('تم نسخ المحتوى بنجاح'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showToast('تم نسخ المحتوى بنجاح');
                });
        }

        function shareSection() {
            const title = sectionTitle.textContent;
            const text = sectionBody.innerText.substring(0, 500);
            if (navigator.share) {
                navigator.share({ title, text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(title + '\n\n' + text).then(() => showToast('تم نسخ الرابط للمشاركة'));
            }
        }

        function changeFontSize(delta) {
            state.fontSize = Math.min(28, Math.max(14, state.fontSize + delta));
            document.getElementById('fontSizeRange').value = state.fontSize;
            document.getElementById('fontSizeDisplay').textContent = state.fontSize;
            applySettings();
        }

        function showToast(msg) {
            const old = document.querySelector('.toast-msg');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = 'toast-msg';
            div.style.cssText = `
                position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: #fff;
                padding: 14px 28px; border-radius: 12px; font-family: var(--font); font-size: 0.95rem;
                box-shadow: 0 6px 30px rgba(0,0,0,0.2); z-index: 9999; animation: slideUp 0.3s ease forwards;
                max-width: 90%;
            `;
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transform = 'translateY(20px)';
                div.style.transition = '0.3s';
                setTimeout(() => div.remove(), 300);
            }, 2500);
        }

        /* ============================================================
           PROGRESS & SCROLL
           ============================================================ */
        function updateProgress() {
            const scrollTop = window.scrollY;
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
            progressBar.style.width = Math.min(100, progress) + '%';
            scrollTopBtn.classList.toggle('visible', scrollTop > 300);
        }

        function saveScrollPosition() {
            if (pages.section.classList.contains('active')) {
                localStorage.setItem('islamApp_lastScroll', String(window.scrollY));
            }
        }

        /* ============================================================
           INIT
           ============================================================ */
        function init() {
            applySettings();
            renderHome();
            updateFavBadge();

            // Restore last state
            const lastSec = state.lastSection;
            if (lastSec) {
                const result = getSectionById(lastSec);
                if (result) {
                    setTimeout(() => goToSection(lastSec), 300);
                    return;
                }
            }
            const lastPart = state.lastPart;
            if (lastPart) {
                const part = getPartById(lastPart);
                if (part) setTimeout(() => goToPart(lastPart), 300);
            }

            // Event bindings
            document.getElementById('brandHome').addEventListener('click', goHome);
            document.getElementById('partBackBtn').addEventListener('click', goHome);
            document.getElementById('sectionBackBtn').addEventListener('click', function() {
                if (state.currentPartId) goToPart(state.currentPartId);
                else goHome();
            });
            document.getElementById('favBackBtn').addEventListener('click', goHome);
            document.getElementById('settingsBackBtn').addEventListener('click', goHome);

            document.getElementById('favoritesBtn').addEventListener('click', goToFavorites);
            document.getElementById('settingsBtn').addEventListener('click', goToSettings);

            document.getElementById('themeToggle').addEventListener('click', function() {
                state.darkMode = !state.darkMode;
                applySettings();
                this.innerHTML = state.darkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
                document.getElementById('darkModeToggle').classList.toggle('active', state.darkMode);
            });

            document.getElementById('darkModeToggle').addEventListener('click', function() {
                state.darkMode = !state.darkMode;
                applySettings();
                document.getElementById('themeToggle').innerHTML = state.darkMode ? '<i class="fas fa-sun"></i>' :
                    '<i class="fas fa-moon"></i>';
                this.classList.toggle('active', state.darkMode);
            });

            document.getElementById('fontSelect').addEventListener('change', function() {
                state.fontFamily = this.value;
                applySettings();
            });

            document.getElementById('fontSizeRange').addEventListener('input', function() {
                state.fontSize = parseInt(this.value);
                document.getElementById('fontSizeDisplay').textContent = state.fontSize;
                applySettings();
            });

            document.getElementById('copySectionBtn').addEventListener('click', copySection);
            document.getElementById('shareSectionBtn').addEventListener('click', shareSection);
            document.getElementById('fontPlusBtn').addEventListener('click', () => changeFontSize(2));
            document.getElementById('fontMinusBtn').addEventListener('click', () => changeFontSize(-2));

            favoriteSectionBtn.addEventListener('click', function() {
                if (state.currentSectionId) toggleFavorite(state.currentSectionId);
            });

            document.getElementById('resetSettingsBtn').addEventListener('click', function() {
                if (confirm('هل أنت متأكد من إعادة ضبط جميع الإعدادات؟')) {
                    ['favorites', 'fontSize', 'fontFamily', 'darkMode', 'lastPart', 'lastSection', 'lastScroll']
                    .forEach(key => localStorage.removeItem('islamApp_' + key));
                    state.favorites = [];
                    state.fontSize = 18;
                    state.fontFamily = 'Cairo';
                    state.darkMode = false;
                    state.lastPart = null;
                    state.lastSection = null;
                    applySettings();
                    updateFavBadge();
                    renderHome();
                    if (pages.favorites.classList.contains('active')) renderFavorites();
                    showToast('تم إعادة ضبط الإعدادات');
                }
            });

            // Search
            let searchTimeout;
            globalSearchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                const q = this.value.trim();
                if (q.length < 2) { searchOverlay.classList.remove('open'); return; }
                searchTimeout = setTimeout(() => {
                    const results = performSearch(q);
                    searchOverlay.classList.add('open');
                    renderSearchResults(results);
                }, 300);
            });

            globalSearchInput.addEventListener('focus', function() {
                const q = this.value.trim();
                if (q.length >= 2) {
                    const results = performSearch(q);
                    searchOverlay.classList.add('open');
                    renderSearchResults(results);
                }
            });

            document.getElementById('searchCloseBtn').addEventListener('click', function() {
                searchOverlay.classList.remove('open');
                globalSearchInput.value = '';
            });

            searchOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('open');
                    globalSearchInput.value = '';
                }
            });

            window.addEventListener('scroll', function() {
                updateProgress();
                saveScrollPosition();
            });

            scrollTopBtn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (searchOverlay.classList.contains('open')) {
                        searchOverlay.classList.remove('open');
                        globalSearchInput.value = '';
                    }
                }
                if (e.ctrlKey && e.key === 'f') {
                    e.preventDefault();
                    globalSearchInput.focus();
                }
            });

            updateProgress();
            console.log(`📖 تطبيق الميسر في أحكام الدين - ${APP_DATA.parts.length} أجزاء، ${getAllSections().length} قسم`);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>

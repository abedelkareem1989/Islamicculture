<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>عقيدة المسلمين — موسوعة المقالات</title>
    <!-- Google Fonts (Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-body: #f7f5f0;
            --bg-card: #ffffff;
            --text-primary: #1e2a3a;
            --text-secondary: #2c3e50;
            --accent: #a67c52;
            --accent-light: #d4b48c;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
            --radius: 24px;
            --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-family: 'Cairo', 'Tajawal', 'Noto Kufi Arabic', 'Amiri', sans-serif;
            --card-hover: translateY(-6px);
            --icon-size: 2.2rem;
        }

        body.dark {
            --bg-body: #12181f;
            --bg-card: #1e2a36;
            --text-primary: #e8edf2;
            --text-secondary: #cfd9e6;
            --accent: #c9a87c;
            --accent-light: #a6845a;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            transition: background 0.2s, color 0.2s;
            padding: 1rem 1.5rem 4rem;
            min-height: 100vh;
        }

        /* container */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(166, 124, 82, 0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-area i {
            font-size: 2rem;
            color: var(--accent);
        }

        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .toolbar {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border-radius: 60px;
            padding: 0.3rem 0.3rem 0.3rem 1.2rem;
            box-shadow: var(--shadow);
            border: 1px solid rgba(166, 124, 82, 0.15);
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(166, 124, 82, 0.2);
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 0.6rem 0;
            font-size: 0.95rem;
            font-family: var(--font-family);
            color: var(--text-primary);
            width: 160px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .search-box button {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .search-box button:hover {
            background: var(--accent-light);
        }

        .dark-toggle {
            background: var(--bg-card);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 60px;
            font-size: 1.3rem;
            box-shadow: var(--shadow);
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark-toggle:hover {
            background: var(--accent);
            color: #fff;
        }

        /* font size controls */
        .font-controls {
            display: flex;
            gap: 0.3rem;
            background: var(--bg-card);
            padding: 0.2rem 0.4rem;
            border-radius: 60px;
            box-shadow: var(--shadow);
        }

        .font-controls button {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.15s;
        }

        .font-controls button:hover {
            background: var(--accent);
            color: #fff;
        }

        /* font family switcher */
        .font-family-switcher {
            display: flex;
            gap: 0.2rem;
            background: var(--bg-card);
            padding: 0.2rem 0.3rem;
            border-radius: 60px;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
        }

        .font-family-switcher button {
            background: transparent;
            border: none;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-primary);
            transition: 0.15s;
            font-family: inherit;
        }

        .font-family-switcher button:hover,
        .font-family-switcher button.active {
            background: var(--accent);
            color: #fff;
        }

        /* grid cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
            margin-top: 1.5rem;
        }

        .card-item {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.8rem 1.2rem 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.25s, box-shadow 0.25s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid rgba(166, 124, 82, 0.08);
            position: relative;
        }

        .card-item:hover {
            transform: var(--card-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .card-item .icon-wrap {
            background: rgba(166, 124, 82, 0.12);
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--icon-size);
            color: var(--accent);
            margin-bottom: 1rem;
        }

        .card-item h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--text-primary);
        }

        .card-item p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            opacity: 0.8;
        }

        .card-item .badge {
            margin-top: 0.8rem;
            background: var(--accent-light);
            color: #fff;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .no-results {
            text-align: center;
            padding: 3rem 0;
            font-size: 1.2rem;
            color: var(--text-secondary);
            width: 100%;
        }

        /* ===== DETAIL PAGE ===== */
        .detail-page {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .detail-page.active {
            display: block;
        }

        .detail-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid rgba(166, 124, 82, 0.2);
        }

        .back-btn {
            background: var(--bg-card);
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-primary);
            transition: 0.2s;
        }

        .back-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .detail-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0.5rem 0 0.2rem;
        }

        .detail-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 2rem 2.2rem;
            box-shadow: var(--shadow);
            line-height: 1.9;
            font-size: 1.05rem;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid rgba(166, 124, 82, 0.06);
        }

        .detail-content h2, .detail-content h3 {
            color: var(--text-primary);
            margin-top: 1.8rem;
            margin-bottom: 0.8rem;
        }

        .detail-content p {
            margin-bottom: 1rem;
        }

        .copy-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 0.5rem 1.6rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1.2rem;
        }

        .copy-btn:hover {
            background: var(--accent-light);
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* responsive */
        @media (max-width: 700px) {
            body { padding: 0.8rem; }
            .header { flex-direction: column; align-items: stretch; gap: 0.8rem; }
            .logo-area h1 { font-size: 1.5rem; }
            .toolbar { flex-wrap: wrap; justify-content: flex-start; }
            .search-box input { width: 120px; }
            .cards-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .detail-content { padding: 1.5rem; }
            .font-family-switcher button { font-size: 0.65rem; padding: 0.2rem 0.5rem; }
        }

        @media (max-width: 480px) {
            .cards-grid { grid-template-columns: 1fr; }
            .detail-title { font-size: 1.6rem; }
            .font-controls button { width: 32px; height: 32px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 10px; }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="app-container">

    <!-- Header -->
    <header class="header">
        <div class="logo-area">
            <i class="fas fa-book-quran"></i>
            <h1>عقيدة المسلمين</h1>
        </div>
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن مقال..." aria-label="بحث">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="font-family-switcher" id="fontFamilySwitcher">
                <button data-font="Cairo" class="active">كايرو</button>
                <button data-font="Tajawal">تاجوال</button>
                <button data-font="Noto Kufi Arabic">نوتو</button>
                <button data-font="Amiri">أميري</button>
            </div>
            <div class="font-controls">
                <button id="fontDec" aria-label="تصغير الخط"><i class="fas fa-minus"></i></button>
                <button id="fontInc" aria-label="تكبير الخط"><i class="fas fa-plus"></i></button>
            </div>
            <button class="dark-toggle" id="darkToggle" aria-label="الوضع الليلي"><i class="fas fa-moon"></i></button>
        </div>
    </header>

    <!-- Main Grid -->
    <div id="mainGrid">
        <div class="cards-grid" id="cardsContainer"></div>
    </div>

    <!-- Detail Page -->
    <div id="detailPage" class="detail-page">
        <div class="detail-header">
            <button class="back-btn" id="backBtn"><i class="fas fa-arrow-right"></i> العودة</button>
            <span style="flex:1;"></span>
            <button class="copy-btn" id="copyArticleBtn"><i class="fas fa-copy"></i> نسخ المقال</button>
        </div>
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-content" id="detailContent"></div>
    </div>

</div>

<script>
    (function() {
        // ========== DATA ==========
        const articles = [
            { id: 1, title: "الفرض العيني من علم الدين", icon: "fas fa-book", summary: "يجب على كل مكلف تعلم القدر الذي لا يستغنى عنه من العقيدة والطهارة...", content: "يَجِبُ عَلَى كُلِّ مُكَلَّفٍ تَعَلُّمُ قَدْرٍ لا يَسْتَغْنِى عَنْهُ مِنَ الْعَقِيدَةِ وَالطَّهَارَةِ وَالصَّلاةِ وَالصِّيَامِ وَالزَّكَاةِ لِمَنْ تَجِبُ عَلَيْهِ وَالْحَجِّ عَلَى الْمُسْتَطِيعِ وَمَعَاصِى الْقَلْبِ وَالْيَدِ وَالْعَيْنِ وَغَيْرِهَا قَالَ تَعَالَى ﴿قُلْ هَلْ يَسْتَوِى الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لا يَعْلَمُونَ﴾ [سُورَةَ الزُّمَر/9] وَقَالَ رَسُولُ اللَّهِ ﷺ «طَلَبُ الْعِلْمِ فَرِيضَةٌ عَلَى كُلِّ مُسْلِمٍ» رَوَاهُ الْبَيْهَقِىُّ." },
            { id: 2, title: "الحكمة من خلق الجن والإنس", icon: "fas fa-book", summary: "ليأمرهم الله بعبادته قال تعالى: وما خلقت الجن والإنس إلا ليعبدون.", content: "لِيَأْمُرَهُمُ اللَّهُ بِعِبَادَتِهِ قَالَ تَعَالَى ﴿وَمَا خَلَقْتُ الْجِنَّ وَالإِنْسَ إِلَّا لِيَعْبُدُونَ﴾ [سُورَةَ الذَّارِيَات/56] وَقَالَ رَسُولُ اللَّهِ ﷺ «حَقُّ اللَّهِ عَلَى الْعِبَادِ أَنْ يَعْبُدُوهُ وَلا يُشْرِكُوا بِهِ شَيْئًا» [رَوَاهُ الشَّيْخَانِ]." },
            { id: 3, title: "كيف تصح العبادة", icon: "fas fa-book", summary: "تصح عبادة الله ممن يعتقد وجود الله ولا يشبهه بشيء من خلقه.", content: "تَصِحُّ عِبَادَةُ اللَّهِ مِمَّنْ يَعْتَقِدُ وُجُودَ اللَّهِ وَلا يُشَبِّهُهُ بِشَىْءٍ مِنْ خَلْقِهِ قَالَ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] وَقَالَ رَسُولُ اللَّهِ ﷺ «لا فِكْرَةَ فِى الرَّبِّ» رَوَاهُ أَبُو الْقَاسِمِ الأَنْصَارِىُّ وَقَالَ الْغَزَالِىُّ «لا تَصِحُّ الْعِبَادَةُ إِلَّا بَعْدَ مَعْرِفَةِ الْمَعْبُودِ»." },
            { id: 4, title: "لماذا أرسل الله الرسل", icon: "fas fa-book", summary: "أرسل الله الرسل ليعلموا الناس مصالح دينهم ودنياهم وليدعوهم إلى عبادته.", content: "أَرْسَلَ اللَّهُ الرُّسُلَ لِيُعَلِّمُوا النَّاسَ مَصَالِحَ دِينِهِمْ وَدُنْيَاهُمْ وَلِدَعْوَةِ النَّاسِ إِلَى عِبَادَةِ اللَّهِ وَأَنْ لا يُشْرِكُوا بِهِ شَيْئًا قَالَ تَعَالَى ﴿فَبَعَثَ اللَّهُ النَّبِيِّينَ مُبَشِّرِينَ وَمُنْذِرِينَ﴾ [سُورَةَ الْبَقَرَة/213] وَقَالَ رَسُولُ اللَّهِ ﷺ «أَفْضَلُ مَا قُلْتُ أَنَا وَالنَّبِيُّونَ مِنْ قَبْلِى لا إِلَهَ إِلَّا اللَّهُ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 5, title: "معنى التوحيد", icon: "fas fa-book", summary: "هو إفراد القديم من المحدث كما قال الإمام الجنيد.", content: "هُوَ إِفْرَادُ الْقَدِيـمِ مِنَ الْمُحْدَثِ كَمَا قَالَ الإِمَامُ الْجُنَيْدُ وَمُرَادُهُ بِالْقَدِيـمِ اللَّهُ الَّذِى لا بِدَايَةَ لَهُ وَالْمُحْدَثُ الْمَخْلُوقُ قَالَ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] وَسُئِلَ رَسُولُ اللَّهِ ﷺ أَىُّ الْعَمَلِ أَفْضَلُ فَقَالَ «إِيمَانٌ بِاللَّهِ وَرَسُولِهِ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 6, title: "وجود الله", icon: "fas fa-book", summary: "الله موجود لا شك في وجوده، موجود بلا كيف ولا مكان ولا جهة.", content: "اللَّهُ مَوْجُودٌ لا شَكَّ فِى وُجُودِهِ مَوْجُودٌ بِلا كَيْفٍ وَلا مَكَانٍ وَلا جِهَةٍ لا يُشْبِهُ شَيْئًا مِنْ خَلْقِهِ وَلا يُشْبِهُهُ شَىْءٌ مِنْ خَلْقِهِ قَالَ تَعَالَى ﴿أَفِى اللَّهِ شَكٌّ﴾ [سُورَةَ إِبْرَاهِيم/10] وَقَالَ رَسُولُ اللَّهِ ﷺ «كَانَ اللَّهُ وَلَمْ يَكُنْ شَىْءٌ غَيْرُهُ» رَوَاهُ الْبُخَارِىُّ وَغَيْرُهُ." },
            { id: 7, title: "معنى ﴿وهو معكم أين ما كنتم﴾", icon: "fas fa-book", summary: "معناه الإحاطة بالعلم قاله الثوري والشافعي وأحمد ومالك.", content: "مَعْنَاهُ الإِحَاطَةُ بِالْعِلْمِ قَالَهُ الثَّوْرِىُّ وَالشَّافِعِىُّ وَأَحْمَدُ وَمَالِكٌ وَغَيْرُهُمْ قَالَ تَعَالَى ﴿وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًا﴾ [سُورَةَ الطَّلاق/12] وَقَالَ رَسُولُ اللَّهِ ﷺ «ارْبَعُوا عَلَى أَنْفُسِكُمْ فَإِنَّكُمْ لا تَدْعُونَ أَصَمَّ وَلا غَائِبًا وَإِنَّمَا تَدْعُونَ سَمِيعًا قَرِيبًا» رَوَاهُ الْبُخَارِىُّ، مَعْنَاهُ لا يَخْفَى عَلَى اللَّهِ شَىْءٌ." },
            { id: 8, title: "أعظم الذنوب", icon: "fas fa-book", summary: "أعظم الذنوب الكفر ومن الكفر الشرك، والشرك معناه عبادة غير الله.", content: "أَعْظَمُ الذُّنُوبِ الْكُفْرُ وَمِنَ الْكُفْرِ الشِّرْكُ وَالشِّرْكُ مَعْنَاهُ عِبَادَةُ غَيْرِ اللَّهِ قَالَ تَعَالَى حِكَايَةً عَنْ لُقْمَانَ ﴿يَا بُنَىَّ لا تُشْرِكْ بِاللَّهِ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾ [سُورَةَ لُقْمَان/13] وَقَدْ سُئِلَ النَّبِىُّ ﷺ أَىُّ الذُّنُوبِ أَعْظَمُ قَالَ «أَنْ تَجْعَلَ لِلَّهِ نِدًّا وَهُوَ خَلَقَكَ» رَوَاهُ الْبُخَارِىُّ وَغَيْرُهُ." },
            { id: 9, title: "معنى العبادة", icon: "fas fa-book", summary: "العبادة أقصى غاية الخشوع والخضوع كما قال الحافظ السبكي.", content: "الْعِبَادَةُ أَقْصَى غَايَةِ الْخُشُوعِ وَالْخُضُوعِ كَمَا قَالَهَا الْحَافِظُ السُّبْكِىُّ قَالَ تَعَالَى ﴿لا إِلَهَ إِلَّا أَنَا فَاعْبُدُونِ﴾ [سُورَةَ الأَنْبِيَاء/25]." },
            { id: 10, title: "هل يأتي الدعاء بمعنى العبادة", icon: "fas fa-book", summary: "نعم، قال تعالى: قل إنما أدعو ربي ولا أشرك به أحدًا.", content: "نَعَمْ قَالَ تَعَالَى ﴿قُلْ إِنَّمَا أَدْعُو رَبِّى وَلا أُشْرِكُ بِهِ أَحَدًا﴾ [سُورَةَ الْجِنّ/20] مَعْنَاهُ أَعْبُدُ اللَّهَ وَقَالَ تَعَالَى ﴿فَلا تَدْعُوا مَعَ اللَّهِ أَحَدًا﴾ [سُورَةَ الْجِنّ/18] وَقَالَ رَسُولُ اللَّهِ ﷺ «الدُّعَاءُ هُوَ الْعِبَادَةُ» رَوَاهُ الْبُخَارِىُّ وَمَعْنَى الْعِبَادَةِ هُنَا الْحَسَنَاتُ." },
            { id: 11, title: "هل يأتي الدعاء بغير معنى العبادة", icon: "fas fa-book", summary: "نعم، قال تعالى: لا تجعلوا دعاء الرسول بينكم كدعاء بعضكم بعضًا.", content: "نَعَمْ قَالَ تَعَالَى ﴿لا تَجْعَلُوا دُعَاءَ الرَّسُولِ بَيْنَكُمْ كَدُعَاءِ بَعْضِكُمْ بَعْضًا﴾ [سُورَةَ النُّور/63]." },
            { id: 12, title: "حكم نداء نبي أو ولي", icon: "fas fa-book", summary: "يجوز ذلك لأن مجرد ذلك لا يعد عبادة لغير الله.", content: "يَجُوزُ ذَلِكَ لِأَنَّ مُجَرَّدَ ذَلِكَ لا يُعَدُّ عِبَادَةً لِغَيْرِ اللَّهِ وَلَيْسَ مُجَرَّدُ قَوْلِ يَا رَسُولَ اللَّهِ إِشْرَاكًا بِاللَّهِ وَقَدْ ثَبَتَ أَنَّ بِلالَ بنَ الْحَارِثِ الْمُزَنِىَّ أَتَى قَبْرَ الرَّسُولِ عَامَ الرَّمَادَةِ أَيَّامَ عُمَرَ فَقَالَ يَا رَسُولَ اللَّهِ اسْتَسْقِ لِأُمَّتِكَ فَإِنَّهُمْ قَدْ هَلَكُوا رَوَاهُ الْبَيْهَقِىُّ وَغَيْرُهُ فَلَمْ يُنْكِرْ عَلَيْهِ عُمَرُ وَلا غَيْرُهُ بَلِ اسْتَحْسَنُوا فِعْلَهُ قَالَ تَعَالَى ﴿وَلَوْ أَنَّهُمْ إِذْ ظَّلَمُوا أَنفُسَهُمْ جَآؤُوكَ فَاسْتَغْفَرُوا اللَّهَ وَاسْتَغْفَرَ لَهُمُ الرَّسُولُ لَوَجَدُوا اللَّهَ تَوَّابًا رَّحِيمًا﴾ [سُورَةَ النِّسَاء/64]. وَثَبَتَ أَنَّ ابْنَ عُمَرَ قَالَ «يَا مُحَمَّد» لَمَّا خَدِرَتْ رِجْلُهُ رَوَاهُ الْبُخَارِىُّ فِى الأَدَبِ الْمُفْرَدِ." },
            { id: 13, title: "معنى الاستغاثة والاستعانة", icon: "fas fa-book", summary: "الاستغاثة طلب الغوث عند الضيق والاستعانة أعم.", content: "الِاسْتِغَاثَةُ هِىَ طَلَبُ الْغَوْثِ عِنْدَ الضِّيقِ وَالِاسْتِعَانَةُ أَعَمُّ وَأَشْمَلُ قَالَ تَعَالَى ﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلاةِ﴾ [سُورَةَ الْبَقَرَة/45] وَقَالَ رَسُولُ اللَّهِ ﷺ «تَدْنُو الشَّمْسُ مِنْ رُءُوسِ النَّاسِ يَوْمَ الْقِيَامَةِ فَبَيْنَمَا هُمْ كَذَلِكَ إِذِ اسْتَغَاثُوا بِآدَمَ» رَوَاهُ الْبُخَارِىُّ وَفِى هَذَا دَلِيلٌ عَلَى أَنَّ الِاسْتِعَانَةَ بِغَيْرِ اللَّهِ جَائِزَةٌ لَكِنْ مَعَ اعْتِقَادِ أَنَّهُ لا ضَارَّ وَلا نَافِعَ عَلَى الْحَقِيقَةِ إِلَّا اللَّهُ." },
            { id: 14, title: "التوسل بالأنبياء", icon: "fas fa-book", summary: "يجوز التوسل بهم بالإجماع، والتوسل طلب جلب منفعة أو دفع مضرة.", content: "يَجُوزُ التَّوَسُّلُ بِهِمْ بِالإِجْمَاعِ وَالتَّوَسُّلُ هُوَ طَلَبُ جَلْبِ مَنْفَعَةٍ أَوِ انْدِفَاعِ مَضَرَّةٍ مِنَ اللَّهِ بِذِكْرِ نَبِىٍّ أَوْ وَلِىٍّ إِكْرَامًا لِلْمُتَوَسَّلِ بِهِ مَعَ اعْتِقَادِ أَنَّ اللَّهَ هُوَ الضَّارُّ وَالنَّافِعُ عَلَى الْحَقِيقَةِ قَالَ تَعَالَى ﴿وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ﴾ [سُورَةَ الْمَائِدَة/35] وَالرَّسُولُ عَلَّمَ الأَعْمَى أَنْ يَتَوَسَّلَ بِهِ فَفَعَلَ الأَعْمَى فِى غَيْرِ حَضْرَةِ النَّبِىِّ فَرَدَّ اللَّهُ بَصَرَهُ إِلَيْهِ رَوَاهُ الطَّبَرَانِىُّ وَصَحَّحَهُ." },
            { id: 15, title: "التوسل بالأولياء", icon: "fas fa-book", summary: "يجوز التوسل بهم ولا يعرف في ذلك مخالف من أهل الحق.", content: "يَجُوزُ التَّوَسُّلُ بِهِمْ وَلا يُعْرَفُ فِى ذَلِكَ مُخَالِفٌ مِنْ أَهْلِ الْحَقِّ سَلَفًا وَخَلَفًا وَقَدْ تَوَسَّلَ عُمَرُ بِالْعَبَّاسِ قَائِلًا اللَّهُمَّ إِنَّا نَتَوَسَّلُ إِلَيْكَ بِعَمِّ نَبِيِّنَا، رَوَاهُ الْبُخَارِىُّ." },
            { id: 16, title: "معنى حديث الجارية", icon: "fas fa-book", summary: "الحديث مضطرب، ومن صححه فليس معناه أن الله ساكن السماء.", content: "الْحَدِيثُ مُضْطَرِبٌ وَمَنْ جَرَى عَلَى تَصْحِيحِهِ فَلَيْسَ مَعْنَاهُ أَنَّ اللَّهَ سَاكِنُ السَّمَاءِ. قَالَ النَّوَوِىُّ فِى شَرْحِهِ عَلَى الْحَدِيثِ قَوْلُ أَيْنَ اللَّهُ سُؤَالٌ عَنِ الْمَكَانَةِ لا عَنِ الْمَكَانِ مَعْنَاهُ مَا اعْتِقَادُكِ مِنَ التَّعْظِيمِ فِى اللَّهِ وَقَوْلُهَا فِى السَّمَاءِ أَىْ رَفِيعُ الْقَدْرِ جِدًّا، وَلا يَجُوزُ اعْتِقَادُ أَنَّ الرَّسُولَ سَأَلَهَا عَنِ الْمَكَانِ وَلا اعْتِقَادُ أَنَّهَا قَصَدَتْ أَنَّ اللَّهَ سَاكِنُ السَّمَاء، قَالَ الإِمَامُ عَلِىٌّ «لا يُقَالُ أَيْنَ لِمَنْ أَيَّنَ الأَيْنَ» ذَكَرَ ذَلِكَ أَبُو الْقَاسِمِ الْقُشَيْرِىُّ فِى رِسَالَتِهِ وَقَالَ أَبُو حَنِيفَةَ فِى كِتَابِ الْفِقْهِ الأَبْسَطِ «كَانَ قَبْلَ الْمَكَانِ كَانَ وَلَمْ يَكُنْ أَيْنٌ وَلا خَلْقٌ وَهُوَ خَالِقُ كُلِّ شَىْءٍ». قَالَ تَعَالَى ﴿لَيْسَ كَمِثْلِهِ شَىْءٌ﴾ [سُورَةَ الشُّورَى/11] وَقَالَ رَسُولُ اللَّهِ ﷺ «كَانَ اللَّهُ وَلَمْ يَكُنْ شَىْءٌ غَيْرُهُ» رَوَاهُ الْبُخَارِىُّ" },
            { id: 17, title: "حكم ساب الله", icon: "fas fa-book", summary: "نقل القاضي عياض الإجماع على أن ساب الله كافر.", content: "نَقَلَ الْقَاضِى عِيَاضٌ الإِجْمَاعَ عَلَى أَنَّ سَابَّ اللَّهِ كَافِرٌ وَلَوْ كَانَ غَاضِبًا أَوْ مَازِحًا أَوْ غَيْرَ مُنْشَرِحِ الصَّدْرِ قَالَ تَعَالَى ﴿وَلَئِنْ سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ قُلْ أَبِاللَّهِ وَءَايَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِؤُونَ لا تَعْتَذِرُوا قَدْ كَفَرْتُمْ بَعْدَ إِيـمَانِكُمْ﴾ [سُورَةَ التَّوْبَة] وَقَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ لا يَرَى بِهَا بَأْسًا يَهْوِى بِهَا فِى النَّارِ سَبْعِينَ خَرِيفًا» رَوَاهُ التِّرْمِذِىُّ." },
            { id: 18, title: "زيارة القبور للرجال والنساء", icon: "fas fa-book", summary: "الحديث: زوروا القبور فإنها تذكركم بالآخرة.", content: "الْحَدِيثُ «زُورُوا الْقُبُورَ فَإِنَّهَا تُذَكِّرُكُمْ بِالآخِرَةِ» رَوَاهُ الْبَيْهَقِىُّ." },
            { id: 19, title: "كيف يكون الدخول في الإسلام", icon: "fas fa-book", summary: "الدخول في الإسلام يكون بالنطق بالشهادتين.", content: "الدُّخُولُ فِى الإِسْلامِ يَكُونُ بِالنُّطْقِ بِالشَّهَادَتَيْنِ وَلَيْسَ بِقَوْلِ أَسْتَغْفِرُ اللَّهَ أَمَّا قَوْلُ اللَّهِ تَعَالَى إِخْبَارًا عَنْ نُوحٍ أَنَّهُ قَالَ ﴿فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ﴾ [سُورَةَ نُوح/10] فَمَعْنَاهُ أَنَّ نُوحًا طَلَبَ مِنْ قَوْمِهِ أَنْ يَدْخُلُوا فِى الإِسْلامِ بِالإِيـمَانِ بِاللَّهِ وَبِنَبِيِّهِ نُوحٍ لِيَغْفِرَ اللَّهُ لَهُمْ وَقَالَ رَسُولُ اللَّهِ ﷺ «أُمِرْتُ أَنْ أُقَاتِلَ النَّاسَ حَتَّى يَشْهَدُوا أَنْ لا إِلَهَ إِلَّا اللَّهُ وَأَنِّى رَسُولُ اللَّهِ» مُتَّفَقٌ عَلَيْهِ." },
            { id: 20, title: "حكم مدح رسول الله", icon: "fas fa-book", summary: "جائز بالإجماع، قال تعالى: وإنك لعلى خلق عظيم.", content: "جَائِزٌ بِالإِجْمَاعِ قَالَ تَعَالَى ﴿وَإِنَّكَ لَعَلى خُلُقٍ عَظِيمٍ﴾ [سُورَةَ الْقَلَم/4] وَقَالَ تَعَالَى ﴿وَعَزَّرُوهُ وَنَصَرُوهُ﴾ [سُورَةَ الأَعْرَاف/157] وَمَعْنَى عَزَّرُوهُ أَثْنَوْا عَلَيْهِ وَمَدَحُوهُ وَعَظَّمُوهُ. وَقَدْ وَرَدَ أَنَّ بَعْضَ النِّسَاءِ مَدَحْنَ النَّبِىَّ عَلَيْهِ السَّلامُ بِقَوْلِهِنَّ أَمَامَ النَّبِىِّ «يَا حَبَّذَا مُحَمَّدٌ مِنْ جَارِ» رَوَاهُ ابْنُ مَاجَهْ، وَثَبَتَ مَدْحُ أَكْثَرَ مِنْ صَحَابِىٍّ لَهُ كَحَسَّانِ بنِ ثَابِتٍ وَالْعَبَّاسِ وَغَيْرِهِمَا وَالرَّسُولُ لَمْ يُنْكِرْ ذَلِكَ بَلِ اسْتَحْسَنَهُ." },
            { id: 21, title: "عذاب القبر", icon: "fas fa-book", summary: "يجب الإيمان بعذاب القبر، ومن أنكره كفر.", content: "يَجِبُ الإِيـمَانُ بِعَذَابِ الْقَبْرِ وَهُوَ ثَابِتٌ بِالإِجْمَاعِ وَمَنْ أَنْكَرَهُ كَفَرَ قَالَ تَعَالَى ﴿النَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوًّا وَعَشِيًّا وَيَوْمَ تَقُومُ السَّاعَةُ أَدْخِلُوا ءَالَ فِرْعَوْنَ أَشَدَّ الْعَذَابِ﴾ [سُورَةَ غَافِر/46] وَقَالَ رَسُولُ اللَّهِ ﷺ «اسْتَعِيذُوا بِاللَّهِ مِنْ عَذَابِ الْقَبْرِ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 22, title: "أول المخلوقات", icon: "fas fa-book", summary: "أول المخلوقات الماء، قال تعالى: وجعلنا من الماء كل شيء حي.", content: "أَوَّلُ الْمَخْلُوقَاتِ الْمَاءُ قَالَ تَعَالَى ﴿وَجَعَلْنَا مِنَ الْمَاءِ كُلَّ شَىْءٍ حَىٍّ﴾ [سُورَةَ الأَنْبِيَاء/30] وَقَالَ رَسُولُ اللَّهِ ﷺ «كُلُّ شَىْءٍ خُلِقَ مِنَ الْمَاءِ» رَوَاهُ ابْنُ حِبَّانَ." },
            { id: 23, title: "أنواع البدع والدليل على وجود بدعة حسنة", icon: "fas fa-book", summary: "البدعة لغة كل ما أحدث على غير مثال سابق، وتنقسم إلى بدعة هدى وضلالة.", content: "الْبِدْعَةُ لُغَةً هِىَ كُلُّ مَا أُحْدِثَ عَلَى غَيْرِ مِثَالٍ سَابِقٍ لَهُ أَمَّا مِنْ حَيْثُ الشَّرْعُ فَتَنْقَسِمُ إِلَى بِدْعَةِ هُدًى وَبِدْعَةِ ضَلالَةٍ قَالَ تَعَالَى ﴿وَرَهْبَانِيَّةً ابْتَدَعُوهَا مَا كَتَبْنَاهَا عَلَيْهِمْ إِلَّا ابْتِغَاءَ رِضْوَانِ اللَّهِ﴾ [سُورَةَ الْحَدِيد/27]. اللَّهُ مَدَحَ فِعْلَ أَتْبَاعِ عِيسَى الْمُسْلِمِينَ مِنِ انْقِطَاعِهِمْ عَنِ الشَّهَوَاتِ مِمَّا لَمْ يُفْرَضْ عَلَيْهِمْ وَذَلِكَ ابْتِغَاءَ رِضْوَانِ اللَّهِ، وَقَالَ رَسُولُ اللَّهِ ﷺ «مَنْ سَنَّ فِى الإِسْلامِ سُنَّةً حَسَنَةً فَلَهُ أَجْرُهَا وَأَجْرُ مَنْ عَمِلَ بِهَا مِنْ بَعْدِهِ» رَوَاهُ مُسْلِمٌ. وَقَدْ أَحْدَثَ الصَّحَابَةُ وَمَنْ بَعْدَهُمْ كَثِيرًا مِنَ الأُمُورِ الْحَسَنَةِ فِى الدِّينِ وَتَلَقَّتْهَا الأُمَّةُ بِالْقَبُولِ كَعَمَلِ الْمَحَارِيبِ وَالأَذَانِ الثَّانِى لِصَلاةِ الْجُمُعَةِ وَتَنْقِيطِ الْمُصْحَفِ وَعَمَلِ الْمَوْلِدِ النَّبَوِىِّ الشَّرِيفِ." },
            { id: 24, title: "العمل بالسحر", icon: "fas fa-book", summary: "العمل بالسحر حرام، قال تعالى: وما كفر سليمان ولكن الشياطين كفروا.", content: "الْعَمَلُ بِالسِّحْرِ حَرَامٌ قَالَ تَعَالَى ﴿وَمَا كَفَرَ سُلَيْمَانُ وَلَكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ﴾ [سُورَةَ الْبَقَرَة/102] وَقَالَ رَسُولُ اللَّهِ ﷺ «اجْتَنِبُوا السَّبْعَ الْمُوبِقَاتِ» قِيلَ وَمَا هِىَ يَا رَسُولَ اللَّهِ قَالَ «الشِّرْكُ بِاللَّهِ وَالسِّحْرُ\...» الْحَدِيثَ رَوَاهُ مُسْلِمٌ." },
            { id: 25, title: "حكم رمي ورقة فيها اسم الله في القاذورات", icon: "fas fa-book", summary: "لا يجوز رمي ورقة فيها اسم الله في المستقذر، ومن فعل ذلك استخفافًا يكفر.", content: "لا يَجُوزُ رَمْىُ وَرَقَةٍ فِيهَا اسْمُ اللَّهِ فِى الْمُسْتَقْذَرِ وَالَّذِى يَفْعَلُ ذَلِكَ اسْتِخْفَافًا يَكْفُرُ قَالَ تَعَالَى ﴿قُلْ أَبِاللَّهِ وَءَايَاتِهِ وَرَسُولِهِ كُنْتُمْ تَسْتَهْزِؤُونَ لا تَعْتَذِرُوا قَدْ كَفَرْتُمْ بَعْدَ إِيـمَانِكُمْ﴾ [سُورَةَ التَّوْبَة]. قَالَ ابْنُ عَابِدِينَ «يَكْفُرُ مَنْ رَمَى الْمُصْحَفَ فِى الْقَاذُورَاتِ وَلَوْ لَمْ يَقْصِدِ الِاسْتِخْفَافَ لِأَنَّ فِعْلَهُ يَدُلُّ عَلَى الِاسْتِخْفَافِ»." },
            { id: 26, title: "حكم النذر", icon: "fas fa-book", summary: "يجوز النذر فيما هو قربة إلى الله ويجب الوفاء به.", content: "يَجُوزُ النَّذْرُ فِيمَا هُوَ قُرْبَةٌ إِلَى اللَّهِ وَيَجِبُ الْوَفَاءُ بِهِ أَمَّا مَا هُوَ مُحَرَّمٌ فَلا يَجُوزُ وَلا يَجِبُ الْوَفَاءُ بِهِ قَالَ تَعَالَى ﴿يُوفُونَ بِالنَّذْرِ﴾ [سُورَةَ الإِنْسَان/7] وَقَالَ رَسُولُ اللَّهِ ﷺ «مَنْ نَذَرَ أَنْ يُطِيعَ اللَّهَ فَلْيُطِعْهُ وَمَنْ نَذَرَ أَنْ يَعْصِيَهُ فَلا يَعْصِهِ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 27, title: "صوت المرأة ليس عورة", icon: "fas fa-book", summary: "قال تعالى: وقلن قولًا معروفًا، وقد سمع الأحنف الحديث من فم عائشة.", content: "قَالَ تَعَالَى ﴿وَقُلْنَ قَوْلًا مَّعْرُوفًا﴾ [سُورَةَ الأَحْزَاب/32] وَقَدْ قَالَ الأَحْنَفُ بنُ قَيْسٍ سَمِعْتُ الْحَدِيثَ مِنْ فِى [أَىْ فَمِ] أَبِى بَكْرٍ وَعُمَرَ وَعُثْمَانَ وَعَلِىٍّ كَمَا سَمِعْتُهُ مِنْ فِى عَائِشَةَ، رَوَاهُ الْحَاكِمُ فِى الْمُسْتَدْرَكِ." },
            { id: 28, title: "صفة الكلام لله تعالى", icon: "fas fa-book", summary: "الله يتكلم لا ككلامنا، كلامه ليس حرفًا ولا صوتًا ولا لغة.", content: "اللَّهُ يَتَكَلَّمُ لا كَكَلامِنَا كَلامُهُ لَيْسَ حَرْفًا وَلا صَوْتًا وَلا لُغَةً قَالَ تَعَالَى ﴿وَكَلَّمَ اللَّهُ مُوسَى تَكْلِيمًا﴾ [سُورَةَ النِّسَاء/164] وَقَالَ الإِمَامُ أَبُو حَنِيفَةَ فِى الْفِقْهِ الأَبْسَطِ «وَيَتَكَلَّمُ لا كَكَلامِنَا وَنَحْنُ نَتَكَلَّمُ بِالآلاتِ وَالْحُرُوفِ وَاللَّهُ تَعَالَى يَتَكَلَّمُ بِلا ءَالَةٍ وَلا حُرُوفٍ»." },
            { id: 29, title: "معنى ﴿الرحمن على العرش استوى﴾", icon: "fas fa-book", summary: "قال الإمام مالك: استوى كما وصف نفسه، ولا يقال عنه كيف.", content: "قَالَ الإِمَامُ مَالِكٌ «اسْتَوْى كَمَا وَصَفَ نَفْسَهُ وَلا يُقَالُ عَنْهُ كَيْفَ وَكَيْفَ عَنْهُ مَرْفُوعٌ» وَالْكَيْفُ صِفَةُ الْمَخْلُوقِ وَمِنْ صِفَةِ الْمَخْلُوقِ الْجُلُوسُ وَالِاسْتِقْرَارُ وَالتَّحَيُّزُ فِى الْمَكَانِ وَالْجِهَةِ، وَقَالَ الْقُشَيْرِىُّ اسْتَوَى أَىْ حَفِظَ وَقَهَرَ وَأَبْقَى وَلا يَجُوزُ اعْتِقَادُ أَنَّهُ جَالِسٌ عَلَى الْعَرْشِ لِأَنَّ هَذِهِ عَقِيدَةُ الْيَهُودِ وَفِيهَا تَكْذِيبٌ لِقَوْلِهِ تَعَالَى ﴿فَلا تَضْرِبُوا لِلَّهِ الأَمْثَالَ﴾ [سُورَةَ النَّحْل/74]. قَالَ تَعَالَى ﴿وَبَرَزُوا لِلَّهِ الْوَاحِدِ الْقَهَّارِ﴾ [سُورَةَ إِبْرَاهِيم/48] وَقَالَ الإِمَامُ عَلِىٌّ «إِنَّ اللَّهَ خَلَقَ الْعَرْشَ إِظْهَارًا لِقُدْرَتِهِ وَلَمْ يَتَّخِذْهُ مَكَانًا لِذَاتِهِ» رَوَاهُ أَبُو مَنْصُورٍ الْبَغْدَادِىُّ." },
            { id: 30, title: "القَدَر", icon: "fas fa-book", summary: "كل شيء يحصل في الدنيا من خير أو شر بتقدير الله ومشيئته.", content: "كُلُّ شَىْءٍ يَحْصُلُ فِى هَذِهِ الدُّنْيَا مِنْ خَيْرٍ أَوْ شَرٍّ مِنْ طَاعَةٍ أَوْ مَعْصِيَةٍ مِنْ إِيمَانٍ أَوْ كُفْرٍ بِتَقْدِيرِ اللَّهِ وَمَشِيئَتِهِ وَعِلْمِهِ، الْخَيْرُ وَالإِيمَانُ وَالطَّاعَةُ بِتَقْدِيرِهِ وَمَحَبَّتِهِ وَرِضَاهُ أَمَّا الشَّرُّ وَالْمَعْصِيَةُ وَالْكُفْرُ فَبِتَقْدِيرِ اللَّهِ وَلَيْسَ بِمَحَبَّتِهِ وَلَيْسَ بِرِضَاهُ وَلا يُوصَفُ تَقْدِيرُ اللَّهِ الَّذِى هُوَ صِفَتُهُ بِالشَّرِّ قَالَ تَعَالَى ﴿إنَّا كُلَّ شَىْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾ [سُورَةَ الْقَمَر/49] وَقَالَ رَسُولُ اللَّهِ ﷺ «كُلُّ شَىْءٍ بِقَدَرٍ حَتَّى الْعَجْزُ وَالْكَيْسُ» رَوَاهُ مُسْلِمٌ." },
            { id: 31, title: "مصافحة الرجل للمرأة الأجنبية", icon: "fas fa-book", summary: "قال رسول الله: لأن يطعن أحدكم بحديدة في رأسه خير له من أن يمس امرأة لا تحل له.", content: "قَالَ رَسُولُ اللَّهِ ﷺ «لَأَنْ يُطْعَنَ أَحَدُكُمْ بِحَدِيدَةٍ فِى رَأْسِهِ خَيْرٌ لَهُ مِنْ أَنْ يَمَسَّ امْرَأَةً لا تَحِلُّ لَهُ» رَوَاهُ الدَّارَقُطْنِىُّ وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «وَزِنَى الْيَدِ الْبَطْشُ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 32, title: "قراءة القرآن على الميت", icon: "fas fa-book", summary: "قراءة القرآن على الميت جائزة، قال تعالى: وافعلوا الخير.", content: "قِرَاءَةُ الْقُرْءَانِ عَلَى الْمَيِّتِ جَائِزَةٌ قَالَ تَعَالَى ﴿وَافْعَلُوا الْخَيْرَ﴾ [سُورَةَ الْحَجّ/77] وَقَالَ رَسُولُ اللَّهِ ﷺ «اقْرَءُوا عَلَى مَوْتَاكُمْ يس» رَوَاهُ ابْنُ حِبَّانَ وَصَحَّحَهُ وَإِجْمَاعُ أَهْلِ الْحَقِّ عَلَى جَوَازِهِ وَنَفْعِهِ. قَالَ الشَّافِعِىُّ «لَوْ قَرَءُوا عِنْدَ قَبْرِهِ شَيْئًا مِنَ الْقُرْءَانِ كَانَ حَسَنًا وَلَوْ قَرَءُوا الْقُرْءَانَ كُلَّهُ كَانَ أَحْسَنَ» نَقَلَهُ النَّوَوِىُّ فِى رِيَاضِ الصَّالِحِينَ." },
            { id: 33, title: "انتفاع الميت بالصدقة", icon: "fas fa-book", summary: "إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، وعلم ينتفع به، وولد صالح يدعو له.", content: "الْحَدِيثُ «إِذَا مَاتَ ابْنُ ءَادَمَ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلاثٍ صَدَقَةٍ جَارِيَةٍ وَعِلْمٍ يُنْتَفَعُ بِهِ وَوَلَدٍ صَالِحٍ يَدْعُو لَهُ» رَوَاهُ مُسْلِمٌ، مَعْنَاهُ أَنَّ هَذَا مِمَّا يَنْتَفِعُ بِهِ الْمُسْلِمُ مِمَّا يَكُونُ هُوَ سَبَبًا فِيهِ. وَكَذَلِكَ قَوْلُهُ تَعَالَى ﴿وَأَنْ لَّيْسَ لِلإِنْسَانِ إِلَّا مَا سَعَى﴾ [سُورَةَ النَّجْم/39] أَىْ مَا يَكُونُ مِنْ فِعْلِهِ مِنَ الْخَيْرِ انْتَفَعَ بِهِ وَمَا كَانَ مِنْ إِحْسَانِ غَيْرِهِ إِلَيْهِ وَلَمْ يَكُنْ مِنْ فِعْلِهِ انْتَفَعَ بِهِ بِفَضْلِ اللَّهِ عَلَيْهِ وَذَلِكَ كَصَلاةِ الْجِنَازَةِ لَيْسَتْ مِنْ فِعْلِ الْمَيِّتِ وَيَنْتَفِعُ بِهَا وَكَدُعَاءِ الرَّسُولِ لِغَيْرِهِ لَيْسَ مِنْ فِعْلِ هَذَا الْغَيْرِ وَيَنْتَفِعُ بِهِ كَقَوْلِهِ فِى دُعَائِهِ لِابْنِ عَبَّاسٍ «اللَّهُمَّ عَلِّمْهُ الْحِكْمَةَ وَتَأْوِيلَ الْكِتَابِ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 34, title: "قيام رمضان بأكثر من إحدى عشرة ركعة", icon: "fas fa-book", summary: "قال تعالى: وافعلوا الخير لعلكم تفلحون، وصلاة الليل مثنى مثنى.", content: "قَالَ تَعَالَى ﴿وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ﴾ [سُورَةَ الْحَجّ/77] وَقَالَ رَسُولُ اللَّهِ ﷺ «صَلاةُ اللَّيْلِ مَثْنَى مَثْنَى» رَوَاهُ الْبُخَارِىُّ وَرَوَى مُسْلِمٌ «الصَّلاةُ خَيْرٌ مَوْضُوعٌ فَمَنْ شَاءَ اسْتَقَلَّ وَمَنْ شَاءَ اسْتَكْثَرَ»." },
            { id: 35, title: "استعمال الدف", icon: "fas fa-book", summary: "الحديث: أن امرأة قالت للرسول إني نذرت إن ردك الله سالمًا أن أضرب بالدف بين يديك، قال: أوفي بنذرك.", content: "الْحَدِيثُ «أَنَّ امْرَأَةً قَالَتْ لِلرَّسُولِ إِنِّى نَذَرْتُ إِنْ رَدَّكَ اللَّهُ سَالِمًا أَنْ أَضْرِبَ بِالدُّفِّ بَيْنَ يَدَيْكَ قَالَ إِنْ كُنْتِ نَذَرْتِ فَأَوْفِى بِنَذْرِكِ» رَوَاهُ أَبُو دَاوُدَ." },
            { id: 36, title: "أول الأنبياء والرسل", icon: "fas fa-book", summary: "أول الأنبياء والرسل آدم عليه السلام.", content: "أَوَّلُ الأَنْبِيَاءِ وَالرُّسُلِ ءَادَمُ عَلَيْهِ السَّلامُ قَالَ تَعَالَى ﴿إِنَّ اللَّهَ اصْطَفَى ءَادَمَ﴾ [سُورَةَ ءَالِ عِمْرَان/33] وَقَالَ رَسُولُ اللَّهِ ﷺ «ءَادَمُ فَمَنْ سِوَاهُ مِنَ الأَنْبِيَاءِ تَحْتَ لِوَائِى يَوْمَ الْقِيَامَةِ» رَوَاهُ التِّرْمِذِىُّ." },
            { id: 37, title: "ما يجب للأنبياء وما يستحيل عليهم", icon: "fas fa-book", summary: "يجب أن يكونوا متصفين بالصدق والأمانة والفطانة والعفة والشجاعة والفصاحة.", content: "يَجِبُ أَنْ يَكُونُوا مُتَّصِفِينَ بِالصِّدْقِ وَالأَمَانَةِ وَالْفَطَانَةِ وَالْعِفَّةِ وَالشَّجَاعَةِ وَالْفَصَاحَةِ وَيَسْتَحِيلُ عَلَيْهِمُ الْكَذِبُ وَالْخِيَانَةُ وَالرَّذَالَةُ وَالزِّنَى وَسَائِرُ الْكَبَائِرِ وَالْكُفْرُ قَبْلَ النُّبُوَّةِ وَبَعْدَهَا قَالَ تَعَالَى ﴿وَكُلًّا فَضَّلْنَا عَلَى الْعَالَمِينَ﴾ [سُورَةَ الأَنْعَام/86] وَقَالَ رَسُولُ اللَّهِ ﷺ «مَا بَعَثَ اللَّهُ نَبِيًّا إِلَّا حَسَنَ الْوَجْهِ حَسَنَ الصَّوْتِ» رَوَاهُ التِّرْمِذِىُّ." },
            { id: 38, title: "معنى ﴿لم يلد ولم يولد﴾", icon: "fas fa-book", summary: "نفي المادية والانحلال عن الله، فالله لا يحل في شيء ولا ينحل منه شيء.", content: "مَعْنَاهُ نَفْىُ الْمَادِّيَّةِ وَالِانْحِلالِ عَنِ اللَّهِ فَاللَّهُ لا يَحُلُّ فِى شَىْءٍ وَلا يَنْحَلُّ مِنْهُ شَىْءٌ وَلا يَحُلُّ فِيهِ شَىْءٌ قَالَ الإِمَامُ جَعْفَرٌ الصَّادِقُ «مَنْ زَعَمَ أَنَّ اللَّهَ فِى شَىْءٍ أَوْ مِنْ شَىْءٍ أَوْ عَلَى شَىْءٍ فَقَدْ أَشْرَكَ» رَوَاهُ الْقُشَيْرِىُّ فِى الرِّسَالَةِ الْقُشَيْرِيَّةِ." },
            { id: 39, title: "الصلاة على النبي بعد الأذان", icon: "fas fa-book", summary: "تجوز الصلاة على النبي بعد الأذان، قال تعالى: إن الله وملائكته يصلون على النبي.", content: "تَجُوزُ الصَّلاةُ عَلَى النَّبِىِّ بَعْدَ الأَذَانِ وَلا يُلْتَفَتُ إِلَى مَنْ حَرَّمَ ذَلِكَ قَالَ تَعَالَى ﴿إِنَّ اللَّهَ وَمَلائِكَتَهُ يُصَلُّونَ عَلَى النَّبِىِّ يَا أَيُّهَا الَّذِينَ ءَامَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا﴾ [سُورَةَ الأَحْزَاب/56] وَقَالَ رَسُولُ اللَّهِ ﷺ «إِذَا سَمِعْتُمُ الْمُؤَذِّنَ فَقُولُوا كَمَا يَقُولُ ثُمَّ صَلُّوا عَلَىَّ» رَوَاهُ مُسْلِمٌ. وَقَالَ عَلَيْهِ الصَّلاةُ وَالسَّلامُ «مَنْ ذَكَرَنِى فَلْيُصَلِّ عَلَىَّ» رَوَاهُ الْحَافِظُ السَّخَاوِىُّ." },
            { id: 40, title: "الردة وأنواعها", icon: "fas fa-book", summary: "الردة هي قطع الإسلام بالكفر، وتنقسم إلى ثلاثة أقسام: قولية، فعلية، قلبية.", content: "الرِّدَّةُ هِىَ قَطْعُ الإِسْلامِ بِالْكُفْرِ وَتَنْقَسِمُ إِلَى ثَلاثَةِ أَقْسَامٍ: الرِّدَّةُ الْقَوْلِيَّةُ كَمَسَبَّةِ اللَّهِ أَوِ الأَنْبِيَاءِ أَوِ الإِسْلامِ وَلَوْ فِى حَالَةِ الْغَضَبِ. الرِّدَّةُ الْفِعْلِيَّةُ كَإِلْقَاءِ الْمُصْحَفِ فِى الْقَاذُورَاتِ وَكَالدَّوْسِ عَلَى الْمُصْحَفِ. الرِّدَّةُ الْقَلْبِيَّةُ كَاعْتِقَادِ أَنَّ اللَّهَ جِسْمٌ أَوْ رُوحٌ أَوْ أَنَّهُ جَالِسٌ عَلَى الْعَرْشِ أَوْ أَنَّهُ يَسْكُنُ السَّمَاءَ أَوْ فِى كُلِّ مَكَانٍ بِذَاتِهِ أَوْ أَنَّهُ فِى جِهَةٍ قَالَ تَعَالَى ﴿وَلَقَدْ قَالُوا كَلِمَةَ الْكُفْرِ وَكَفَرُوا بَعْدَ إِسْلامِهِمْ﴾ [سُورَةَ التَّوْبَة/74] وَقَالَ تَعَالَى ﴿لا تَسْجُدُوا لِلشَّمْسِ وَلا لِلْقَمَرِ﴾ [سُورَةَ فُصِّلَتْ/37] وَقَالَ رَسُولُ اللَّهِ ﷺ «إِنَّ الْعَبْدَ لَيَتَكَلَّمُ بِالْكَلِمَةِ مَا يَتَبَيَّنُ فِيهَا يَهْوِى بِهَا فِى النَّارِ أَبْعَدَ مِمَّا بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ» رَوَاهُ مُسْلِمٌ وَالْبُخَارِىُّ." },
            { id: 41, title: "الاحتفال بالمولد النبوي", icon: "fas fa-book", summary: "قال تعالى: وافعلوا الخير لعلكم تفلحون، ومن سن في الإسلام سنة حسنة فله أجرها.", content: "قَالَ تَعَالَى ﴿وَافْعَلُوا الْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَ﴾ [سُورَةَ الْحَجّ/77] وَقَالَ رَسُولُ اللَّهِ ﷺ «مَنْ سَنَّ فِى الإِسْلامِ سُنَّةً حَسَنَةً فَلَهُ أَجْرُهَا» الْحَدِيثَ رَوَاهُ مُسْلِمٌ." },
            { id: 42, title: "معنى قول الرسول: إذا سألت فاسأل الله", icon: "fas fa-book", summary: "معناه أن الذي يسأل هو الله، وليس معناه لا تسأل غير الله.", content: "هَذَا مَعْنَاهُ أَنَّهُ مِنْ بَابِ الأَوْلَى أَنَّ الَّذِى يُسْأَلُ هُوَ اللَّهُ وَأَنَّ الَّذِى يُسْتَعَانُ بِهِ هُوَ اللَّهُ وَلَيْسَ مَعْنَاهُ لا تَسْأَلْ غَيْرَ اللَّهِ وَلا تَسْتَعِنْ بِغَيْرِ اللَّهِ وَهَذَا كَحَدِيثِ ابْنِ حِبَّانَ «لا تُصَاحِبْ إِلَّا مُؤْمِنًا وَلا يَأْكُلْ طَعَامَكَ إِلَّا تَقِىٌّ» أَىِ الأَوْلَى بِالإِطْعَامِ التَّقِىُّ وَبِالصُّحْبَةِ الْمُؤْمِنُ وَلَيْسَ مَعْنَى ذَلِكَ أَنَّهُ حَرَامٌ إِطْعَامُ غَيْرِ الْمُؤْمِنِ أَوْ صُحْبَتُهُ وَقَدْ مَدَحَ اللَّهُ تَعَالَى فِى الْقُرْءَانِ الْمُسْلِمِينَ بِقَوْلِهِ تَعَالَى ﴿وَيُطْعِمُونَ الطَّعَامَ عَلَى حُبِّهِ مِسْكِينًا وَيَتِيمًا وَأَسِيرًا﴾ [سُورَةَ الإِنْسَان/8] وَالأَسِيرُ هُنَا الْمُرَادُ بِهِ الْكَافِرُ وَقَدْ وَرَدَ فِى صَحِيحِ الْبُخَارِىِّ وَمُسْلِمٍ أَنَّ ثَلاثَةَ نَفَرٍ سَأَلُوا اللَّهَ بِصَالِحِ أَعْمَالِهِمْ فَفَرَّجَ اللَّهُ عَنْهُمْ." },
            { id: 43, title: "زيارة قبر النبي للرجال والنساء", icon: "fas fa-book", summary: "تسن زيارة قبر النبي بالإجماع، نقله القاضي عياض والنووي.", content: "تُسَنُّ زِيَارَةُ قَبْرِ النَّبِىِّ بِالإِجْمَاعِ نَقَلَ ذَلِكَ الْقَاضِى عِيَاضٌ وَالنَّوَوِىُّ قَالَ تَعَالَى ﴿وَلَوْ أَنَّهُمْ إِذْ ظَّلَمُوا أَنفُسَهُمْ جَآؤُوكَ فَاسْتَغْفَرُوا اللَّهَ وَاسْتَغْفَرَ لَهُمُ الرَّسُولُ لَوَجَدُوا اللَّهَ تَوَّابًا رَّحِيمًا﴾ [سُورَةَ النِّسَاء/64] وَقَالَ رَسُولُ اللَّهِ ﷺ «مَنْ زَارَ قَبْرِى وَجَبَتْ لَهُ شَفَاعَتِى» رَوَاهُ الدَّارَقُطْنِىُّ وَقَوَّاهُ الْحَافِظُ السُّبْكِىُّ. وَأَمَّا حَدِيثُ «لا تُشَدُّ الرِّحَالُ إِلَّا إِلَى ثَلاثَةِ مَسَاجِدٍ» مَعْنَاهُ مَنْ أَرَادَ السَّفَرَ لِأَجْلِ الصَّلاةِ فِى مَسْجِدٍ يَنْبَغِى أَنْ يُسَافِرَ لِهَؤُلاءِ الْمَسَاجِدِ الثَّلاثَةِ لِأَنَّ الصَّلاةَ فِيهَا تَتَضَاعَفُ وَيُحْمَلُ هَذَا عَلَى النَّدْبِ لا عَلَى الْوُجُوبِ. فَالْحَدِيثُ مَخْصُوصٌ بِالسَّفَرِ لِأَجْلِ الصَّلاةِ وَلَيْسَ فِيهِ أَنَّهُ لا تَجُوزُ زِيَارَةُ قَبْرِ النَّبِىِّ عَلَيْهِ السَّلامُ." },
            { id: 44, title: "التبرك", icon: "fas fa-book", summary: "التبرك بالنبي وآثاره جائز، قال تعالى عن يوسف: اذهبوا بقميصي هذا.", content: "التَّبَرُّكُ بِالنَّبِىِّ وَءَاثَارِهِ جَائِزٌ قَالَ تَعَالَى حِكَايَةً عَنْ يُوسُفَ ﴿اذْهَبُوا بِقَمِيصِى هَذَا فَأَلْقُوهُ عَلَى وَجْهِ أَبِى يَأْتِ بَصِيرًا﴾ [سُورَةَ يُوسُف/93] وَرَوَى الْبُخَارِىُّ وَمُسْلِمٌ أَنَّ الرَّسُولَ قَسَّمَ شَعَرَهُ وَوَزَّعَهُ بَيْنَ النَّاسِ لِيَتَبَرَّكُوا بِهِ." },
            { id: 45, title: "لبس الحِرز الذي فيه قرآن", icon: "fas fa-book", summary: "قال تعالى: وننزل من القرآن ما هو شفاء ورحمة للمؤمنين.", content: "قَالَ تَعَالَى ﴿وَنُنَزِّلُ مِنَ الْقُرْءانِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾ [سُورَةَ الإِسْرَاء/82] وَقَالَ عَبْدُ اللَّهِ بنُ عَمْرٍو «كُنَّا نُعَلِّمُ صِبْيَانَنَا الآيَاتِ مِنَ الْقُرْءَانِ وَمَنْ لَمْ يَبْلُغْ نَكْتُبُهَا عَلَى وَرَقَةٍ وَنُعَلِّقُهَا عَلَى صَدْرِهِ» رَوَاهُ التِّرْمِذِىُّ." },
            { id: 46, title: "ذكر الله في الجنائز", icon: "fas fa-book", summary: "ذكر الله في الجنائز جائز بلا خلاف، وكان رسول الله يذكر الله على جميع أحواله.", content: "ذِكْرُ اللَّهِ فِى الْجَنَائِزِ جَائِزٌ بِلا خِلافٍ قَالَ تَعَالَى ﴿يَا أَيُّهَا الَّذِينَ ءَامَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا﴾ [سُورَةَ الأَحْزَاب/41] وَقَالَ تَعَالَى ﴿الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَى جُنُوبِهِمْ﴾ [سُورَةَ ءَالِ عِمْرَان/191] وَكَانَ رَسُولُ اللَّهِ يَذْكُرُ اللَّهَ عَلَى جَمِيعِ أَحْوَالِهِ، رَوَاهُ مُسْلِمٌ." },
            { id: 47, title: "التأويل", icon: "fas fa-book", summary: "التأويل هو إخراج النص عن ظاهره، وهو جائز في الآيات والأحاديث التي يوهم ظاهرها التشبيه.", content: "التَّأْوِيلُ هُوَ إِخْرَاجُ النَّصِّ عَنْ ظَاهِرِهِ وَهُوَ جَائِزٌ فِى الآيَاتِ وَالأَحَادِيثِ الَّتِى يُوهِمُ ظَاهِرُهَا أَنَّ اللَّهَ لَهُ يَدٌ جَارِحَةٌ أَوْ وَجْهٌ جَارِحَةٌ أَوْ أَنَّهُ يَجْلِسُ عَلَى الْعَرْشِ أَوْ يَسْكُنُ فِى جِهَةٍ أَوْ أَنَّهُ يُوصَفُ بِصِفَةٍ مِنْ صِفَاتِ الْخَلْقِ قَالَ تَعَالَى ﴿وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ وَالرَّاسِخُونَ فِى الْعِلْمِ﴾ [سُورَةَ ءَالِ عِمْرَان/7] وَقَدْ دَعَا الرَّسُولُ لِابْنِ عَبَّاسٍ بِقَوْلِهِ «اللَّهُمَّ عَلِّمْهُ الْحِكْمَةَ وَتَأْوِيلَ الْكِتَابِ» رَوَاهُ الْبُخَارِىُّ وَابْنُ مَاجَهْ وَالْحَافِظُ ابْنُ الْجَوْزِىِّ." },
            { id: 48, title: "الإيمان شرط لقبول الأعمال", icon: "fas fa-book", summary: "قال تعالى: ومن يعمل من الصالحات من ذكر أو أنثى وهو مؤمن.", content: "قَالَ تَعَالَى ﴿وَمَنْ يَعْمَلْ مِنَ الصَّالِحَاتِ مِنْ ذَكَرٍ أَوْ أُنثَى وَهُوَ مُؤْمِنٌ فَأُوْلَئِكَ يَدْخُلُونَ الْجَنَّةَ وَلا يُظْلَمُونَ نَقِيرًا﴾ [سُورَةَ النِّسَاء/124] وَقَالَ رَسُولُ اللَّهِ ﷺ «أَفْضَلُ الأَعْمَالِ إِيـمَانٌ بِاللَّهِ وَرَسُولِهِ» رَوَاهُ الْبُخَارِىُّ." },
            { id: 49, title: "معنى ﴿كل شيء هالك إلا وجهه﴾", icon: "fas fa-book", summary: "قال البخاري: إلا وجهه أي إلا ملكه، وقال الثوري: إلا ما أريد به وجه الله.", content: "قَالَ الإِمَامُ الْبُخَارِىُّ فِى قَوْلِهِ تَعَالَى ﴿إِلَّا وَجْهَهُ﴾ أَىْ إِلَّا مُلْكَهُ وَقَالَ الإِمَامُ سُفْيَانُ الثَّوْرِىُّ ﴿إِلَّا وَجْهَهُ﴾ أَىْ إِلَّا مَا أُرِيدَ بِهِ وَجْهُ اللَّهِ أَىِ الأَعْمَالَ الصَّالِحَة." },
            { id: 50, title: "معنى ﴿أأمنتم من في السماء﴾", icon: "fas fa-book", summary: "قال الرازي وأبو حيان: المراد بمن في السماء الملائكة، وليس المراد أن الله ساكن في السماء.", content: "قَالَ الْمُفَسِّرُ الْفَخْرُ الرَّازِىُّ فِى تَفْسِيرِهِ وَأَبُو حَيَّانَ الأَنْدَلُسِىُّ فِى كِتَابِهِ الْبَحْرُ الْمُحِيطُ الْمُرَادُ بِمَنْ فِى السَّمَاءِ الْمَلائِكَةُ وَلَيْسَ الْمُرَادُ أَنَّ اللَّهَ سَاكِنٌ فِى السَّمَاءِ." },
            { id: 51, title: "معنى ﴿والسماء بنيناها بأيد﴾", icon: "fas fa-book", summary: "قال ابن عباس: بأيدٍ أي بقدرة، وليس المقصود اليد الجارحة.", content: "قَالَ ابْنُ عَبَّاسٍ ﴿بِأَيْدٍ﴾ أَىْ بِقُدْرَةٍ وَلَيْسَ الْمَقْصُودُ بِالْيَدِ هُنَا الْيَدَ الْجَارِحَةَ الَّتِى لَنَا فَإِنَّ اللَّهَ مُنَزَّهٌ عَنْ ذَلِك." }
        ];

        // DOM refs
        const cardsContainer = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const darkToggle = document.getElementById('darkToggle');
        const mainGrid = document.getElementById('mainGrid');
        const detailPage = document.getElementById('detailPage');
        const detailTitle = document.getElementById('detailTitle');
        const detailContent = document.getElementById('detailContent');
        const backBtn = document.getElementById('backBtn');
        const copyBtn = document.getElementById('copyArticleBtn');
        const fontInc = document.getElementById('fontInc');
        const fontDec = document.getElementById('fontDec');
        const fontFamilySwitcher = document.getElementById('fontFamilySwitcher');

        let currentFontSize = 1;
        let currentArticles = [...articles];
        let activeArticleId = null;

        // render cards
        function renderCards(filter = '') {
            const query = filter.trim().toLowerCase();
            const filtered = query ? currentArticles.filter(a => 
                a.title.includes(query) || a.summary.includes(query) || a.content.includes(query)
            ) : currentArticles;

            if (filtered.length === 0) {
                cardsContainer.innerHTML = `<div class="no-results"><i class="fas fa-search" style="margin-left:0.5rem;"></i> لا نتائج مطابقة</div>`;
                return;
            }

            cardsContainer.innerHTML = filtered.map(article => `
                <div class="card-item" data-id="${article.id}">
                    <div class="icon-wrap"><i class="${article.icon}"></i></div>
                    <h3>${article.title}</h3>
                    <p>${article.summary}</p>
                    <span class="badge">اقرأ المقال</span>
                </div>
            `).join('');

            document.querySelectorAll('.card-item').forEach(el => {
                el.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    openArticle(id);
                });
            });
        }

        function openArticle(id) {
            const article = currentArticles.find(a => a.id === id);
            if (!article) return;
            activeArticleId = id;
            detailTitle.textContent = article.title;
            detailContent.innerHTML = article.content.replace(/\n/g, '<br>');
            mainGrid.style.display = 'none';
            detailPage.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goBack() {
            detailPage.classList.remove('active');
            mainGrid.style.display = 'block';
            activeArticleId = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyArticle() {
            if (!activeArticleId) return;
            const article = currentArticles.find(a => a.id === activeArticleId);
            if (!article) return;
            const text = `${article.title}\n\n${article.content}`;
            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
                setTimeout(() => { copyBtn.innerHTML = original; }, 1800);
            }).catch(() => {
                alert('تعذر نسخ النص');
            });
        }

        function performSearch() {
            renderCards(searchInput.value);
        }

        function toggleDark() {
            document.body.classList.toggle('dark');
            const icon = darkToggle.querySelector('i');
            if (document.body.classList.contains('dark')) {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }

        function changeFontSize(delta) {
            let newSize = currentFontSize + delta;
            if (newSize < 0.7) newSize = 0.7;
            if (newSize > 1.8) newSize = 1.8;
            currentFontSize = newSize;
            document.querySelector('.detail-content').style.fontSize = (currentFontSize * 1.05) + 'rem';
            document.querySelectorAll('.card-item p').forEach(p => p.style.fontSize = (currentFontSize * 0.9) + 'rem');
        }

        // Font family switching
        function setFontFamily(font) {
            document.body.style.fontFamily = font + ', ' + "'Cairo','Tajawal','Noto Kufi Arabic','Amiri', sans-serif";
            document.querySelectorAll('.font-family-switcher button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.font === font);
            });
        }

        // event listeners
        searchBtn.addEventListener('click', performSearch);
        searchInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') performSearch(); });
        darkToggle.addEventListener('click', toggleDark);
        backBtn.addEventListener('click', goBack);
        copyBtn.addEventListener('click', copyArticle);
        fontInc.addEventListener('click', () => changeFontSize(0.1));
        fontDec.addEventListener('click', () => changeFontSize(-0.1));

        fontFamilySwitcher.addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn || !btn.dataset.font) return;
            setFontFamily(btn.dataset.font);
        });

        // init
        renderCards();
        document.querySelector('.detail-content').style.fontSize = '1.05rem';
        // set default active font
        setFontFamily('Cairo');
    })();
</script>
